[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# gRPC
prost = "0.14"

# Query IR
substrait = { version = "0.62", features = ["serde"] }
arrow = { version = "55", default-features = false, features = ["json"] }

# SQL generation
polyglot-sql = { version = "0.1", default-features = false }

# Graph analysis
petgraph = "0.7"
fixedbitset = { version = "0.5", features = ["serde"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# AWS (optional, behind aws feature)
aws-config = { version = "1.8" }
aws-credential-types = { version = "1.2" }
aws-sdk-secretsmanager = { version = "1.103" }

# Utilities
uuid = { version = "1", features = ["v4"] }
indexmap = { version = "2", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

# API (optional)
axum = { version = "0.8" }
clap = { version = "4", features = ["derive"] }
tonic = { version = "0.14" }

# Internal workspace crates
semstrait-core = { path = "crates/semstrait-core" }
semstrait-model = { path = "crates/semstrait-model" }
semstrait-catalog = { path = "crates/semstrait-catalog" }
semstrait-manifest = { path = "crates/semstrait-manifest" }
semstrait-ir = { path = "crates/semstrait-ir" }
semstrait-planner = { path = "crates/semstrait-planner" }
semstrait-adapter = { path = "crates/semstrait-adapter" }
semstrait-api = { path = "crates/semstrait-api" }

# Workspace-level integration tests package
[package]
name = "semstrait-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
semstrait-manifest = { workspace = true }
semstrait-planner = { workspace = true }
semstrait-ir = { workspace = true }
semstrait-core = { workspace = true }
semstrait-api = { workspace = true }
semstrait-adapter = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
default = []
datafusion = ["semstrait-adapter/datafusion", "semstrait-api/datafusion"]
duckdb = ["semstrait-adapter/duckdb", "semstrait-api/duckdb"]
iceberg = ["semstrait-api/iceberg"]
unity = ["semstrait-api/unity"]
aws = ["semstrait-api/aws"]
spark = ["semstrait-adapter/spark", "semstrait-api/spark"]

# polyglot-sql is extremely slow in unoptimized debug builds (recursive AST
# walking becomes ~1000x slower). Compile it with opt-level 1 so that `cargo test`
# completes in reasonable time.
[profile.dev.package.polyglot-sql]
opt-level = 1
