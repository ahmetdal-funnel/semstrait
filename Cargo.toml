[workspace]
members = ["crates/semstrait-common", "crates/semstrait-ir"]
exclude = [
    "crates/semstrait",
    "crates/semstrait-adapter",
    "crates/semstrait-api",
    "crates/semstrait-catalog",
    "crates/semstrait-manifest",
    "crates/semstrait-model",
    "crates/semstrait-planner",
]
resolver = "2"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# gRPC
prost = "0.14"

# Query IR
substrait = { version = "0.62", features = ["serde"] }
arrow = { version = "55", default-features = false, features = ["json"] }

# SQL generation
polyglot-sql = { version = "0.1", default-features = false }

# Graph analysis
petgraph = "0.7"
fixedbitset = { version = "0.5", features = ["serde"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# AWS (optional, behind aws feature)
aws-config = { version = "1.8" }
aws-credential-types = { version = "1.2" }
aws-sdk-s3 = { version = "1" }
aws-sdk-secretsmanager = { version = "1.103" }

# Utilities
uuid = { version = "1", features = ["v4"] }
indexmap = { version = "2", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
bon = "3"
jsonschema = { version = "0.30", default-features = false }
bytes = "1"
dashmap = "6"
object_store = { version = "0.12", default-features = false }
schemars = "0.8"
tempfile = "3"

# API (optional)
axum = { version = "0.8" }
clap = { version = "4", features = ["derive"] }
tonic = { version = "0.14" }

# Internal workspace crates
semstrait-common = { path = "crates/semstrait-common", default-features = true }
semstrait-ir = { path = "crates/semstrait-ir" }
