# Example: Measure constraints — controlling when a measure can be queried.
#
# The `constraints.dimensions.one_of` block requires that at least one of
# the listed dimensions is present in the query. The planner rejects queries
# that violate this constraint before any dataset routing.

semantic_model:
  name: constrained_example
  description: Revenue measure constrained to require a time dimension

  grainsets:
    - name: orders

      dimensions:
        - name: order_date
          data_type: date
          type:
            temporal:
              grains:
                - day
        - name: region
          data_type: string
          type:
            categorical: {}

      measures:
        - name: revenue
          data_type: float64
          expr: "SUM(amount)"
          # This measure requires order_date in the query scope.
          # Querying revenue by region alone will be rejected.
          constraints:
            dimensions:
              one_of:
                - order_date

      datasets:
        - name: orders_daily
          extras:
            column_mapping:
              order_date: created_at
              region: region_name
              revenue: amount
            storage:
              path: warehouse.orders_daily
