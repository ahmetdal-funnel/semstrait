# Example: Grainset kind with multiple datasets at different grains.
#
# The planner picks the optimal dataset based on the requested dimensions.
# Column mapping binds semantic names to physical columns per dataset.

semantic_model:
  name: orders_example
  description: Order analytics with daily and monthly grain datasets

  kinds:
    - name: orders
      type:
        grainset:

      dimensions:
        - name: order_date
          data_type: date
          type:
            temporal:
              grains:
                - day
                - month
        - name: region
          data_type: string
          type:
            categorical: {}
        - name: customer
          data_type: string
          type:
            categorical: {}

      measures:
        - name: revenue
          data_type: float64
          expr: "SUM(amount)"
        - name: order_count
          data_type: int64
          expr: "COUNT(order_id)"

      metrics:
        - name: avg_order_value
          data_type: float64
          expr: "revenue / order_count"

      datasets:
        - name: orders_daily
          extras:
            column_mapping:
              order_date: created_at
              region: region_name
              customer: customer_name
              revenue: amount
              order_count: order_id
            storage:
              path: warehouse.orders_daily

        - name: orders_monthly
          extras:
            column_mapping:
              order_date:
                column: month_start
                grain: month
              region: region_name
              revenue: total_amount
              order_count: num_orders
            storage:
              path: warehouse.orders_monthly
