# Example: Joinset kind — joining multiple datasets into one entity.
#
# The planner automatically prunes unused datasets from the join tree.
# Only datasets that provide requested columns are included.

semantic_model:
  name: sales_joinset_example
  description: Sales entity joining orders with customer and product dimensions

  kinds:
    - name: sales
      type:
        joinset:
          associativity: left

      dimensions:
        - name: order_date
          data_type: date
          type:
            temporal:
              grains:
                - day
        - name: customer_name
          data_type: string
          type:
            categorical: {}
        - name: product_category
          data_type: string
          type:
            categorical: {}

      measures:
        - name: revenue
          data_type: float64
          expr: "SUM(amount)"

      datasets:
        - name: orders
          extras:
            column_mapping:
              order_date: created_at
              revenue: amount
            storage:
              path: warehouse.orders

        - name: customers
          extras:
            column_mapping:
              customer_name: name
            storage:
              path: warehouse.customers

        - name: products
          extras:
            column_mapping:
              product_category: category
            storage:
              path: warehouse.products

      relationships:
        - name: orders_to_customers
          from: orders
          to: customers
          type: left
          columns:
            - from: customer_id
              to: id
          cardinality: many_to_one

        - name: orders_to_products
          from: orders
          to: products
          type: left
          columns:
            - from: product_id
              to: id
          cardinality: many_to_one
