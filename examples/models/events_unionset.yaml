# Example: Unionset kind — combining multiple source datasets via UNION ALL.
#
# Each dataset contributes its available columns; missing columns are NULL-filled.
# The planner can prune branches when filters exclude NULL values.

semantic_model:
  name: events_unionset_example
  description: Unified event stream from multiple source systems

  kinds:
    - name: events
      type:
        unionset:

      dimensions:
        - name: event_date
          data_type: date
          type:
            temporal:
              grains:
                - day
        - name: source
          data_type: string
          type:
            categorical: {}
        - name: channel
          data_type: string
          type:
            categorical: {}

      measures:
        - name: event_count
          data_type: int64
          expr: "COUNT(event_id)"

      datasets:
        - name: web_events
          extras:
            column_mapping:
              event_date: occurred_at
              source: source_system
              channel: web_channel
              event_count: event_id
            storage:
              path: warehouse.web_events

        - name: mobile_events
          extras:
            column_mapping:
              event_date: created_at
              source: app_source
              event_count: event_id
              # channel is not mapped — will be NULL-filled in UNION
            storage:
              path: warehouse.mobile_events
