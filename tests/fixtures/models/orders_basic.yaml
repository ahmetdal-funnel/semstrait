semantic_model:
  name: e2e_test
  description: E2E pipeline test model
  grainsets:
    - name: orders
      dimensions:
        - name: order_date
          data_type: date
          type:
            temporal:
              grains:
                - day
        - name: region
          data_type: string
          type:
            categorical: {}
        - name: customer
          data_type: string
          type:
            categorical: {}
      measures:
        - name: revenue
          data_type: float64
          agg: sum
        - name: order_count
          data_type: int64
          agg: count
      metrics:
        - name: avg_order_value
          data_type: float64
          expr: "revenue / order_count"
      datasets:
        - name: orders_daily
          extras:
            column_mapping:
              order_date: created_at
              region: region_name
              customer: customer_name
              revenue: amount
              order_count: order_id
            storage:
              format: parquet
              paths:
                - warehouse.orders_daily
