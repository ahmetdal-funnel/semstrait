semantic_model:
  name: datafusion_test_model
  grainsets:
    - name: orders
      dimensions:
        - name: region
          data_type: string
          type:
            categorical:
      measures:
        - name: revenue
          data_type: float64
          agg: sum
      datasets:
        - name: orders_data
          extras:
            column_mapping:
              region: region
              revenue: amount
            storage:
              format: parquet
              paths:
                - orders_data
