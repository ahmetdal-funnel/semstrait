semantic_model:
  name: constraint_test
  grainsets:
    - name: sales
      dimensions:
        - name: date
          data_type: date
          type:
            temporal:
              grains:
                - day
        - name: region
          data_type: string
          type:
            categorical:
      measures:
        - name: revenue
          data_type: float64
          agg: sum
          constraints:
            dimensions:
              one_of:
                - date
      datasets:
        - name: sales_data
          extras:
            column_mapping:
              date: sale_date
              region: region_name
              revenue: amount
            storage:
              format: parquet
              paths:
                - warehouse.sales
