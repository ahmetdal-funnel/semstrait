semantic_model:
  name: constraint_test
  kinds:
    - name: sales
      type:
        grainset:
      dimensions:
        - name: date
          data_type: date
          type:
            temporal:
              grains:
                - day
        - name: region
          data_type: string
          type:
            categorical:
      measures:
        - name: revenue
          data_type: float64
          expr: "SUM(amount)"
          constraints:
            dimensions:
              one_of:
                - date
      datasets:
        - name: sales_data
          extras:
            column_mapping:
              date: sale_date
              region: region_name
              revenue: amount
            storage:
              path: warehouse.sales
