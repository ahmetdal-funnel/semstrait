semantic_model:
  name: multi_measure_test
  grainsets:
    - name: transactions
      dimensions:
        - name: date
          data_type: date
          type:
            temporal:
              grains:
                - day
                - month
      measures:
        - name: revenue
          data_type: float64
          agg: sum
        - name: transaction_count
          data_type: int64
          agg: count
        - name: avg_amount
          data_type: float64
          agg: avg
      datasets:
        - name: txn_daily
          extras:
            column_mapping:
              date: txn_date
              revenue: amount
              transaction_count: id
              avg_amount: amount
            storage:
              format: parquet
              paths:
                - warehouse.transactions_daily
