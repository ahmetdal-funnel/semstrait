syntax = "proto3";

package semstrait.v1;

// Semstrait semantic query service.
service SemstraitService {
  // Explain a query: returns plan text, SQL, and Substrait JSON.
  rpc Explain(QueryRequest) returns (ExplainResponse);

  // Validate a query request against the loaded manifest.
  rpc Validate(QueryRequest) returns (ValidateResponse);

  // Execute a query and return result rows as JSON.
  rpc Query(QueryRequest) returns (QueryResponse);

  // Health check.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message QueryRequest {
  // Semantic model source (inline YAML/JSON).
  optional string model = 1;
  // Entity to query: a kind name or a dataset name.
  string from = 2;
  // Semantic names to select (system classifies into dimensions/measures/metrics).
  // Use ["*"] to select all columns.
  repeated string select = 3;
  // Named filters from the manifest.
  repeated string filters = 4;
  // Inline filter expressions (stub — not implemented in v1).
  repeated RawFilter raw_filters = 5;
  optional string grain = 6;
  optional uint64 limit = 7;
  repeated OrderBy order_by = 8;
  map<string, string> session = 9;
  // Engine selection (e.g. "datafusion", "duckdb", "trino", "spark").
  optional string engine = 10;
}

// Inline filter expression (stub — not implemented in v1).
message RawFilter {
  string field = 1;
  string operator = 2;
  string value_json = 3; // JSON-encoded filter value
}

message OrderBy {
  string field = 1;
  string direction = 2; // "asc" or "desc"
}

message ExplainResponse {
  string plan_text = 1;
  optional string sql = 2;
  optional string substrait_json = 3;
}

message ValidateResponse {
  bool valid = 1;
  repeated string errors = 2;
  repeated string warnings = 3;
}

message QueryResponse {
  // Result rows encoded as JSON strings (one per row).
  repeated string rows_json = 1;
  uint64 rows_returned = 2;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}
