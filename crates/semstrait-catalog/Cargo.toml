[package]
name = "semstrait-catalog"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
semstrait-core = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true }

# Feature-gated deps
reqwest = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
glob = { version = "0.3", optional = true }

[features]
default = []
local = ["glob"]
iceberg = ["reqwest", "serde_json"]
unity = ["reqwest", "serde_json"]
aws = ["iceberg", "dep:aws-config", "dep:aws-credential-types", "dep:aws-sdk-secretsmanager"]
