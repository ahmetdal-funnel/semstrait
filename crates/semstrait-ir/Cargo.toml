[package]
name = "semstrait-ir"
version = "0.0.1"
edition = "2021"
rust-version = "1.79"
license = "Apache-2.0"

[dependencies]
semstrait-common = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Substrait wire form per `35 §12.2`. `substrait::proto::Plan` is a
# structural payload (engine-agnostic), not engine-identity. Permitted
# per `35 §15.5`.
substrait = { workspace = true }
prost = { workspace = true }
