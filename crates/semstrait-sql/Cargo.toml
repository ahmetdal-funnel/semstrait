[package]
name = "semstrait-sql"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SQL dialect emission from LogicalPlan IR"

[features]
default = []
polyglot = [
    "dep:polyglot-sql",
    "polyglot-sql/dialect-duckdb",
    "polyglot-sql/dialect-trino",
    "polyglot-sql/dialect-presto",
    "polyglot-sql/dialect-spark",
    "polyglot-sql/dialect-snowflake",
    "polyglot-sql/dialect-databricks",
    "polyglot-sql/dialect-postgresql",
    "polyglot-sql/dialect-datafusion",
    "polyglot-sql/transpile",
]

[dependencies]
semstrait-core = { workspace = true }
semstrait-ir = { workspace = true }
thiserror = { workspace = true }
polyglot-sql = { workspace = true, optional = true }
