<svg width="100%" viewBox="0 0 740 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ResolvedQueryRequest -->
  <g>
    <rect x="190" y="10" width="240" height="36" rx="6" stroke-width="0.5" style="fill:rgb(68, 68, 65);stroke:rgb(180, 178, 169);stroke-width:0.5px"/>
    <text x="310" y="28" text-anchor="middle" dominant-baseline="central" style="fill:rgb(211, 209, 199);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">ResolvedQueryRequest</text>
  </g>
  <line x1="310" y1="46" x2="310" y2="64" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

  <!-- Step 0 — domain filter -->
  <g>
    <rect x="120" y="64" width="380" height="44" rx="6" stroke-width="0.5" style="fill:rgb(99, 56, 6);stroke:rgb(239, 159, 39);stroke-width:0.5px"/>
    <text x="310" y="82" text-anchor="middle" dominant-baseline="central" style="fill:rgb(250, 199, 117);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">Step 0 — domain filter</text>
    <text x="310" y="98" text-anchor="middle" dominant-baseline="central" style="fill:rgb(239, 159, 39);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">narrow candidate kinds/datasets by domain hint (pre-step)</text>
  </g>
  <line x1="310" y1="108" x2="310" y2="126" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

  <!-- Step 1 — ConstraintEvaluator -->
  <g>
    <rect x="120" y="126" width="380" height="44" rx="6" stroke-width="0.5" style="fill:rgb(121, 31, 31);stroke:rgb(240, 149, 149);stroke-width:0.5px"/>
    <text x="310" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(247, 193, 193);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">Step 1 — ConstraintEvaluator.check()</text>
    <text x="310" y="160" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 149, 149);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">validate dimensional + aggregation constraints — REJECT if violated</text>
  </g>

  <!-- Left annotation: constraints YAML field -->
  <rect x="12" y="120" width="100" height="54" rx="4" style="fill:rgb(50, 50, 48);stroke:rgb(156, 154, 146);stroke-width:0.5px;stroke-dasharray:3 2"/>
  <text x="62" y="136" text-anchor="middle" dominant-baseline="central" style="fill:rgb(194, 192, 182);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:11px;font-weight:400">constraints</text>
  <text x="62" y="150" text-anchor="middle" dominant-baseline="central" style="fill:rgb(194, 192, 182);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:11px;font-weight:400">YAML field</text>
  <text x="62" y="164" text-anchor="middle" dominant-baseline="central" style="fill:rgb(194, 192, 182);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:11px;font-weight:400">(not 'requires')</text>
  <line x1="112" y1="148" x2="120" y2="148" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1px;opacity:0.5"/>

  <!-- Right annotation: PlannerError -->
  <rect x="510" y="124" width="160" height="44" rx="4" style="fill:rgb(50, 50, 48);stroke:rgb(156, 154, 146);stroke-width:0.5px;stroke-dasharray:3 2"/>
  <text x="590" y="140" text-anchor="middle" dominant-baseline="central" style="fill:rgb(194, 192, 182);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:11px;font-weight:400">PlannerError::</text>
  <text x="590" y="158" text-anchor="middle" dominant-baseline="central" style="fill:rgb(194, 192, 182);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:11px;font-weight:400">ConstraintViolation</text>
  <line x1="500" y1="148" x2="510" y2="148" marker-start="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1px;opacity:0.5"/>

  <line x1="310" y1="170" x2="310" y2="188" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

  <!-- Step 2 — kind dispatch -->
  <g>
    <rect x="120" y="188" width="380" height="44" rx="6" stroke-width="0.5" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165);stroke-width:0.5px"/>
    <text x="310" y="206" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">Step 2 — kind dispatch → KindPlanner</text>
    <text x="310" y="222" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">GrainsetPlanner | UnionsetPlanner | JoinsetPlanner</text>
  </g>
  <line x1="310" y1="232" x2="310" y2="250" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

  <!-- Step 3 — AdditivityResolver -->
  <g>
    <rect x="120" y="250" width="380" height="44" rx="6" stroke-width="0.5" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165);stroke-width:0.5px"/>
    <text x="310" y="268" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">Step 3 — AdditivityResolver</text>
    <text x="310" y="284" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">full: no-op · semi: sub-query injection · non: source reroute</text>
  </g>
  <line x1="310" y1="294" x2="310" y2="312" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

  <!-- Steps 4–7 — filter layer stacking -->
  <g>
    <rect x="120" y="312" width="380" height="100" rx="6" stroke-width="0.5" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236);stroke-width:0.5px"/>
    <text x="310" y="334" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206, 203, 246);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">Steps 4–7 — filter layer stacking</text>
    <text x="310" y="356" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">4. dataset filter → base WHERE (always-on predicate)</text>
    <text x="310" y="374" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">5. measure filter → CASE WHEN (multi) or WHERE (single)</text>
    <text x="310" y="392" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">6. metric filter → outer WHERE on computation scope</text>
    <text x="310" y="408" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">7. user filter → request-level WHERE</text>
  </g>
  <line x1="310" y1="412" x2="310" y2="430" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

  <!-- Step 8 — Optimizer -->
  <g>
    <rect x="120" y="430" width="380" height="44" rx="6" stroke-width="0.5" style="fill:rgb(68, 68, 65);stroke:rgb(180, 178, 169);stroke-width:0.5px"/>
    <text x="310" y="448" text-anchor="middle" dominant-baseline="central" style="fill:rgb(211, 209, 199);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">Step 8 — Optimizer.apply() (internal)</text>
    <text x="310" y="464" text-anchor="middle" dominant-baseline="central" style="fill:rgb(180, 178, 169);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">0 passes in v1 · configurable at SemanticPlanner construction</text>
  </g>
  <line x1="310" y1="474" x2="310" y2="492" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

  <!-- LogicalPlan (output) -->
  <g>
    <rect x="190" y="492" width="240" height="36" rx="6" stroke-width="0.5" style="fill:rgb(12, 68, 124);stroke:rgb(133, 183, 235);stroke-width:0.5px"/>
    <text x="310" y="510" text-anchor="middle" dominant-baseline="central" style="fill:rgb(181, 212, 244);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">LogicalPlan (output)</text>
  </g>
</svg>