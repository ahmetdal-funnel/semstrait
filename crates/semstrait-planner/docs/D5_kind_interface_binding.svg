    <rect x="20" y="180" width="280" height="120" rx="8" stroke-width="0.5" style="fill:rgb(113, 43, 19);stroke:rgb(240, 153, 123);stroke-width:0.5px"/>
    <text x="40" y="203" dominant-baseline="central" style="fill:rgb(245, 196, 179);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">Binding (physical implementation)</text>
    <text x="40" y="225" dominant-baseline="central" style="fill:rgb(240, 153, 123);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">datasets: Vec&lt;CompiledKindDataset&gt;</text>
    <text x="40" y="243" dominant-baseline="central" style="fill:rgb(240, 153, 123);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">  name · column_mapping · extras</text>
    <text x="40" y="261" dominant-baseline="central" style="fill:rgb(240, 153, 123);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">relationships: Vec&lt;CompiledRelationship&gt;</text>
    <text x="40" y="279" dominant-baseline="central" style="fill:rgb(240, 153, 123);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">  joinset only — BFS graph for join tree</text>
  </g>

  <!-- Row 2 Right: KindPlanner dispatch -->
  <g>
    <rect x="380" y="180" width="280" height="120" rx="8" stroke-width="0.5" style="fill:rgb(99, 56, 6);stroke:rgb(239, 159, 39);stroke-width:0.5px"/>
    <text x="400" y="203" dominant-baseline="central" style="fill:rgb(250, 199, 117);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">KindPlanner dispatch</text>
    <text x="400" y="225" dominant-baseline="central" style="fill:rgb(239, 159, 39);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">GrainsetPlanner.resolve()</text>
    <text x="400" y="241" dominant-baseline="central" style="fill:rgb(239, 159, 39);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">  ScanNode + routing logic</text>
    <text x="400" y="261" dominant-baseline="central" style="fill:rgb(239, 159, 39);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">UnionsetPlanner.resolve()</text>
    <text x="400" y="277" dominant-baseline="central" style="fill:rgb(239, 159, 39);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">  ScanNode(s) + UnionNode</text>
    <text x="400" y="293" dominant-baseline="central" style="fill:rgb(239, 159, 39);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">JoinsetPlanner.resolve()</text>
  </g>

  <!-- Horizontal arrow: Binding → KindPlanner (binding) -->
  <line x1="300" y1="240" x2="380" y2="240" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>
  <text x="340" y="231" text-anchor="middle" style="fill:rgb(194, 192, 182);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">binding</text>

  <!-- Vertical arrows Row 2 → PlanFragment -->
  <line x1="160" y1="300" x2="160" y2="340" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px;opacity:0.6"/>
  <line x1="520" y1="300" x2="520" y2="340" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px;opacity:0.6"/>

  <!-- PlanFragment (output) -->
  <g>
    <rect x="100" y="340" width="480" height="74" rx="8" stroke-width="0.5" style="fill:rgb(12, 68, 124);stroke:rgb(133, 183, 235);stroke-width:0.5px"/>
    <text x="340" y="358" text-anchor="middle" dominant-baseline="central" style="fill:rgb(181, 212, 244);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">PlanFragment</text>
    <text x="340" y="378" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 183, 235);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">root: PlanNode · output_schema · pending_filters</text>
    <text x="340" y="396" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 183, 235);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">returned to SemanticPlanner for filter injection</text>
  </g>
</svg>