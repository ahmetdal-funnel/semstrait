      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Row 1 Left: Interface (what users query) -->
  <g>
    <rect x="20" y="10" width="280" height="130" rx="8" stroke-width="0.5" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165);stroke-width:0.5px"/>
    <text x="40" y="33" dominant-baseline="central" style="fill:rgb(159, 225, 203);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">Interface (what users query)</text>
    <text x="40" y="55" dominant-baseline="central" style="fill:rgb(93, 202, 165);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">dimensions: IndexMap&lt;name, Dim&gt;</text>
    <text x="40" y="73" dominant-baseline="central" style="fill:rgb(93, 202, 165);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">measures:   IndexMap&lt;name, Meas&gt;</text>
    <text x="40" y="91" dominant-baseline="central" style="fill:rgb(93, 202, 165);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">metrics:    IndexMap&lt;name, Metric&gt;</text>
    <text x="40" y="109" dominant-baseline="central" style="fill:rgb(93, 202, 165);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">keys:       Option&lt;CompiledKeys&gt;</text>
    <text x="40" y="127" dominant-baseline="central" style="fill:rgb(93, 202, 165);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">constraints checked at step 0</text>
  </g>

  <!-- Row 1 Right: Resolution strategy (KindType) -->
  <g>
    <rect x="380" y="10" width="280" height="130" rx="8" stroke-width="0.5" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236);stroke-width:0.5px"/>
    <text x="400" y="33" dominant-baseline="central" style="fill:rgb(206, 203, 246);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:14px;font-weight:500">Resolution strategy (KindType)</text>
    <text x="400" y="58" dominant-baseline="central" style="fill:rgb(175, 169, 236);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">Grainset</text>
    <text x="400" y="76" dominant-baseline="central" style="fill:rgb(175, 169, 236);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">  route to cheapest covering dataset</text>
    <text x="400" y="96" dominant-baseline="central" style="fill:rgb(175, 169, 236);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">Unionset</text>
    <text x="400" y="114" dominant-baseline="central" style="fill:rgb(175, 169, 236);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">  UNION ALL + branch pruning</text>
    <text x="400" y="132" dominant-baseline="central" style="fill:rgb(175, 169, 236);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:11px;font-weight:400">Joinset { associativity } → BFS join tree</text>
  </g>

  <!-- Horizontal arrow: Interface → Strategy (kind_type) -->
  <line x1="300" y1="75" x2="380" y2="75" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>
  <text x="340" y="66" text-anchor="middle" style="fill:rgb(194, 192, 182);stroke:none;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, sans-serif;font-size:12px;font-weight:400">kind_type</text>

  <!-- Vertical arrows Row 1 → Row 2 -->
  <line x1="160" y1="140" x2="160" y2="180" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>
  <line x1="520" y1="140" x2="520" y2="180" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

  <!-- Row 2 Left: Binding (physical implementation) -->
