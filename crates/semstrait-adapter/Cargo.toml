[package]
name = "semstrait-adapter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Engine adapter layer for semstrait — per-engine profiles and artifact adaptation"

[dependencies]
semstrait-core = { workspace = true }
semstrait-ir = { workspace = true }
semstrait-sql = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
datafusion = []
duckdb = []
trino = []
spark = []
polyglot = ["semstrait-sql/polyglot"]
