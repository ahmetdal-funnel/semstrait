[package]
name = "semstrait-connectors"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Compute connector traits and feature-gated engine implementations"

[dependencies]
semstrait-adapter = { workspace = true }
semstrait-ir = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

# Feature-gated engine deps
datafusion-engine = { package = "datafusion", version = "52", default-features = false, features = ["sql", "parquet"], optional = true }
duckdb-engine = { package = "duckdb", version = ">=1.3.0, <1.4.0", default-features = false, features = ["bundled"], optional = true }
arrow = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tracing = { workspace = true }
uuid = { workspace = true, optional = true }
semstrait-manifest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
default = []
duckdb = ["duckdb-engine", "arrow", "tokio", "semstrait-adapter/duckdb"]
datafusion = ["datafusion-engine", "tokio", "semstrait-adapter/datafusion", "semstrait-manifest"]
trino = ["reqwest", "serde", "tokio", "semstrait-adapter/trino"]
spark = ["uuid", "semstrait-adapter/spark"]
polyglot = ["semstrait-adapter/polyglot"]
