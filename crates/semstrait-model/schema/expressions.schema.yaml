# Expression Block Schema (ExprBlock)
#
# Machine-readable JSON Schema for all declarative expression variants.
# Each expression is a single-key YAML map: { key: value }.
#
# ExprSource = string | ExprBlock
#   - string: inline DSL (e.g., "cost / clicks", "amount")
#   - map: declarative ExprBlock (one of the variants below)
#
# This schema covers 60 ExprBlock variants organized into 10 categories.

$schema: "https://json-schema.org/draft/2020-12/schema"
title: ExprBlock
description: >
  Declarative expression block for semantic model YAML.
  Each expression is a single-key map. The key selects the variant,
  the value provides the arguments.

$defs:
  # ── Meta types ─────────────────────────────────────────────────────

  ExprSource:
    description: "Expression source: inline string or declarative block"
    oneOf:
      - type: string
        description: "Inline DSL string (e.g., 'cost / clicks')"
      - $ref: "#/$defs/ExprBlock"

  ExprBlock:
    description: "Single-key map selecting one of 60 expression variants"
    type: object
    minProperties: 1
    maxProperties: 1
    oneOf:
      # ── Leaf nodes ───────────────────────────────────────────────
      # Bare string = column ref, bare number/bool/null = literal (via deserializer sugar)
      - properties: { lit: { $ref: "#/$defs/LiteralValue" } }
        required: [lit]
        additionalProperties: false

      # ── Arithmetic (BinaryOp) ────────────────────────────────────
      - properties: { add: { $ref: "#/$defs/TwoArgs" } }
        required: [add]
        additionalProperties: false
      - properties: { subtract: { $ref: "#/$defs/TwoArgs" } }
        required: [subtract]
        additionalProperties: false
      - properties: { multiply: { $ref: "#/$defs/TwoArgs" } }
        required: [multiply]
        additionalProperties: false
      - properties: { divide: { $ref: "#/$defs/TwoArgs" } }
        required: [divide]
        additionalProperties: false
      - properties: { safe_divide: { $ref: "#/$defs/TwoArgs" } }
        required: [safe_divide]
        additionalProperties: false

      # ── Comparison (BinaryOp) ────────────────────────────────────
      - properties: { eq: { $ref: "#/$defs/TwoArgs" } }
        required: [eq]
        additionalProperties: false
      - properties: { not_eq: { $ref: "#/$defs/TwoArgs" } }
        required: [not_eq]
        additionalProperties: false
      - properties: { lt: { $ref: "#/$defs/TwoArgs" } }
        required: [lt]
        additionalProperties: false
      - properties: { gt: { $ref: "#/$defs/TwoArgs" } }
        required: [gt]
        additionalProperties: false
      - properties: { lte: { $ref: "#/$defs/TwoArgs" } }
        required: [lte]
        additionalProperties: false
      - properties: { gte: { $ref: "#/$defs/TwoArgs" } }
        required: [gte]
        additionalProperties: false

      # ── Logical ──────────────────────────────────────────────────
      - properties: { and: { $ref: "#/$defs/TwoArgs" } }
        required: [and]
        additionalProperties: false
      - properties: { or: { $ref: "#/$defs/TwoArgs" } }
        required: [or]
        additionalProperties: false
      - properties: { not: { $ref: "#/$defs/ExprBlock" } }
        required: [not]
        additionalProperties: false
      - properties: { negate: { $ref: "#/$defs/ExprBlock" } }
        required: [negate]
        additionalProperties: false

      # ── Conditional ──────────────────────────────────────────────
      - properties: { case: { $ref: "#/$defs/CaseBlock" } }
        required: [case]
        additionalProperties: false
      - properties: { coalesce: { type: array, items: { $ref: "#/$defs/ExprBlock" } } }
        required: [coalesce]
        additionalProperties: false
      - properties: { nullif: { $ref: "#/$defs/NullIfBlock" } }
        required: [nullif]
        additionalProperties: false
      - properties: { if: { $ref: "#/$defs/ThreeArgs" } }
        required: [if]
        additionalProperties: false
      - properties: { greatest: { type: array, items: { $ref: "#/$defs/ExprBlock" } } }
        required: [greatest]
        additionalProperties: false
      - properties: { least: { type: array, items: { $ref: "#/$defs/ExprBlock" } } }
        required: [least]
        additionalProperties: false

      # ── Predicates ───────────────────────────────────────────────
      - properties: { in: { $ref: "#/$defs/InListBlock" } }
        required: [in]
        additionalProperties: false
      - properties: { not_in: { $ref: "#/$defs/InListBlock" } }
        required: [not_in]
        additionalProperties: false
      - properties: { between: { $ref: "#/$defs/BetweenBlock" } }
        required: [between]
        additionalProperties: false
      - properties: { like: { $ref: "#/$defs/PatternBlock" } }
        required: [like]
        additionalProperties: false
      - properties: { ilike: { $ref: "#/$defs/PatternBlock" } }
        required: [ilike]
        additionalProperties: false
      - properties: { is_null: { $ref: "#/$defs/ExprBlock" } }
        required: [is_null]
        additionalProperties: false
      - properties: { is_not_null: { $ref: "#/$defs/ExprBlock" } }
        required: [is_not_null]
        additionalProperties: false

      # ── Pattern matching ─────────────────────────────────────────
      - properties: { regexp_match: { $ref: "#/$defs/RegexpMatchBlock" } }
        required: [regexp_match]
        additionalProperties: false
      - properties: { regexp_extract: { $ref: "#/$defs/RegexpExtractBlock" } }
        required: [regexp_extract]
        additionalProperties: false

      # ── String functions ─────────────────────────────────────────
      - properties: { upper: { $ref: "#/$defs/ExprBlock" } }
        required: [upper]
        additionalProperties: false
      - properties: { lower: { $ref: "#/$defs/ExprBlock" } }
        required: [lower]
        additionalProperties: false
      - properties: { trim: { $ref: "#/$defs/ExprBlock" } }
        required: [trim]
        additionalProperties: false
      - properties: { ltrim: { $ref: "#/$defs/ExprBlock" } }
        required: [ltrim]
        additionalProperties: false
      - properties: { rtrim: { $ref: "#/$defs/ExprBlock" } }
        required: [rtrim]
        additionalProperties: false
      - properties: { length: { $ref: "#/$defs/ExprBlock" } }
        required: [length]
        additionalProperties: false
      - properties: { concat: { type: array, items: { $ref: "#/$defs/ExprBlock" } } }
        required: [concat]
        additionalProperties: false
      - properties: { replace: { $ref: "#/$defs/ReplaceBlock" } }
        required: [replace]
        additionalProperties: false
      - properties: { substr: { $ref: "#/$defs/SubstringBlock" } }
        required: [substr]
        additionalProperties: false
      - properties: { left: { $ref: "#/$defs/LeftRightBlock" } }
        required: [left]
        additionalProperties: false
      - properties: { right: { $ref: "#/$defs/LeftRightBlock" } }
        required: [right]
        additionalProperties: false
      - properties: { lpad: { $ref: "#/$defs/PadBlock" } }
        required: [lpad]
        additionalProperties: false
      - properties: { rpad: { $ref: "#/$defs/PadBlock" } }
        required: [rpad]
        additionalProperties: false

      # ── Math functions ───────────────────────────────────────────
      - properties: { abs: { $ref: "#/$defs/ExprBlock" } }
        required: [abs]
        additionalProperties: false
      - properties: { ceil: { $ref: "#/$defs/ExprBlock" } }
        required: [ceil]
        additionalProperties: false
      - properties: { floor: { $ref: "#/$defs/ExprBlock" } }
        required: [floor]
        additionalProperties: false
      - properties: { round: { $ref: "#/$defs/RoundBlock" } }
        required: [round]
        additionalProperties: false
      - properties: { power: { $ref: "#/$defs/PowerBlock" } }
        required: [power]
        additionalProperties: false
      - properties: { sqrt: { $ref: "#/$defs/ExprBlock" } }
        required: [sqrt]
        additionalProperties: false
      - properties: { mod: { $ref: "#/$defs/TwoArgs" } }
        required: [mod]
        additionalProperties: false

      # ── Date functions ───────────────────────────────────────────
      - properties: { date_trunc: { $ref: "#/$defs/DateTruncBlock" } }
        required: [date_trunc]
        additionalProperties: false
      - properties: { current_date: { type: object, properties: {}, additionalProperties: false } }
        required: [current_date]
        additionalProperties: false
      - properties: { current_timestamp: { type: object, properties: {}, additionalProperties: false } }
        required: [current_timestamp]
        additionalProperties: false
      - properties: { date_add: { $ref: "#/$defs/DateAddBlock" } }
        required: [date_add]
        additionalProperties: false
      - properties: { date_diff: { $ref: "#/$defs/DateDiffBlock" } }
        required: [date_diff]
        additionalProperties: false
      - properties: { extract: { $ref: "#/$defs/ExtractBlock" } }
        required: [extract]
        additionalProperties: false

      # ── Type conversion ──────────────────────────────────────────
      - properties: { cast: { $ref: "#/$defs/CastBlock" } }
        required: [cast]
        additionalProperties: false

      # ── Guard (conditional aggregation sugar) ────────────────────
      - properties: { guard: { $ref: "#/$defs/GuardBlock" } }
        required: [guard]
        additionalProperties: false

  # ── Shared argument types ──────────────────────────────────────────

  LiteralValue:
    description: "Literal value: integer, float, string, boolean, or null"
    oneOf:
      - type: integer
      - type: number
      - type: string
      - type: boolean
      - type: "null"

  TwoArgs:
    description: "Two-argument expression (binary ops)"
    oneOf:
      - type: array
        items: { $ref: "#/$defs/ExprBlock" }
        minItems: 2
        maxItems: 2
        description: "Array form: [left, right]"
      - type: object
        properties:
          left: { $ref: "#/$defs/ExprBlock" }
          right: { $ref: "#/$defs/ExprBlock" }
        required: [left, right]
        additionalProperties: false
        description: "Map form: {left: ..., right: ...}"

  ThreeArgs:
    description: "Three-argument expression (IF: [condition, then, else])"
    type: array
    items: { $ref: "#/$defs/ExprBlock" }
    minItems: 3
    maxItems: 3

  # ── Conditional blocks ─────────────────────────────────────────────

  CaseBlock:
    type: object
    properties:
      when:
        type: array
        items: { $ref: "#/$defs/WhenBlock" }
        minItems: 1
      else: { $ref: "#/$defs/ExprBlock" }
    required: [when]
    additionalProperties: false

  WhenBlock:
    type: object
    properties:
      condition: { $ref: "#/$defs/ExprBlock" }
      then: { $ref: "#/$defs/ExprBlock" }
    required: [condition, then]
    additionalProperties: false

  NullIfBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      null_expr: { $ref: "#/$defs/ExprBlock" }
    required: [expr, null_expr]
    additionalProperties: false

  # ── Predicate blocks ───────────────────────────────────────────────

  InListBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      list:
        type: array
        items: { $ref: "#/$defs/ExprBlock" }
        minItems: 1
    required: [expr, list]
    additionalProperties: false

  BetweenBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      low: { $ref: "#/$defs/ExprBlock" }
      high: { $ref: "#/$defs/ExprBlock" }
    required: [expr, low, high]
    additionalProperties: false

  PatternBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      pattern: { $ref: "#/$defs/ExprBlock" }
    required: [expr, pattern]
    additionalProperties: false

  # ── Pattern matching blocks ────────────────────────────────────────

  RegexpMatchBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      pattern: { $ref: "#/$defs/ExprBlock" }
      full_match:
        type: boolean
        default: false
    required: [expr, pattern]
    additionalProperties: false

  RegexpExtractBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      pattern: { $ref: "#/$defs/ExprBlock" }
      group:
        type: integer
        minimum: 0
        default: 0
    required: [expr, pattern]
    additionalProperties: false

  # ── String function blocks ─────────────────────────────────────────

  ReplaceBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      old: { $ref: "#/$defs/ExprBlock" }
      new: { $ref: "#/$defs/ExprBlock" }
    required: [expr, old, new]
    additionalProperties: false

  SubstringBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      start: { type: integer }
      length: { type: integer }
    required: [expr, start]
    additionalProperties: false

  LeftRightBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      length: { type: integer }
    required: [expr, length]
    additionalProperties: false

  PadBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      length: { type: integer }
      fill:
        type: string
        default: " "
    required: [expr, length]
    additionalProperties: false

  # ── Math function blocks ───────────────────────────────────────────

  RoundBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      scale:
        type: integer
        default: 0
    required: [expr]
    additionalProperties: false

  PowerBlock:
    type: object
    properties:
      base: { $ref: "#/$defs/ExprBlock" }
      exponent: { $ref: "#/$defs/ExprBlock" }
    required: [base, exponent]
    additionalProperties: false

  # ── Date function blocks ───────────────────────────────────────────

  DateTruncBlock:
    type: object
    properties:
      grain:
        type: string
        enum: [minute, hour, day, week, month, quarter, year]
      expr: { $ref: "#/$defs/ExprBlock" }
    required: [grain, expr]
    additionalProperties: false

  DateAddBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      days: { type: integer }
    required: [expr, days]
    additionalProperties: false

  DateDiffBlock:
    type: object
    properties:
      start: { $ref: "#/$defs/ExprBlock" }
      end: { $ref: "#/$defs/ExprBlock" }
    required: [start, end]
    additionalProperties: false

  ExtractBlock:
    type: object
    properties:
      part:
        type: string
        description: "Date/time part to extract (e.g., year, month, day, hour)"
      expr: { $ref: "#/$defs/ExprBlock" }
    required: [part, expr]
    additionalProperties: false

  # ── Type conversion block ──────────────────────────────────────────

  CastBlock:
    type: object
    properties:
      expr: { $ref: "#/$defs/ExprBlock" }
      to:
        type: string
        description: "Target SQL type (e.g., VARCHAR, DECIMAL(10,2), INTEGER)"
    required: [expr, to]
    additionalProperties: false

  # ── Guard block ────────────────────────────────────────────────────

  GuardBlock:
    description: >
      Conditional aggregation sugar: CASE WHEN condition THEN expr ELSE NULL END.
      Used on measure filters to wrap the measure expression.
    type: object
    properties:
      condition: { $ref: "#/$defs/ExprBlock" }
      expr: { $ref: "#/$defs/ExprBlock" }
    required: [condition, expr]
    additionalProperties: false

# Root schema entry point
$ref: "#/$defs/ExprSource"
