# yaml-language-server: $schema=https://json-schema.org/draft-07/schema#
# =============================================================================
# Semstrait Semantic Model — JSON Schema v1.7 (YAML encoding)
# =============================================================================
#
# Canonical machine-validatable schema for semstrait YAML model files.
# For human-readable annotated reference, see reference.yaml.
#
# Changelog v1.2 vs v1.1:
#   - Fixed: Expr fields are type: string (was incorrectly type: object)
#   - Fixed: Kind.filters added (was missing)
#   - Fixed: data_type required on DimensionDef, MeasureDef, MetricDef
#   - Fixed: KindType.unionset supports union_mode property
#   - Added: SemanticModel.namespace field
#   - Added: x-since, x-examples, x-category annotations
#   - Separated MeasureFilter from DatasetFilter (different shapes)
#
# Changelog v1.3 vs v1.2:
#   - Added: KindExtras definition — kind-level default extras for all datasets
#     (column_mapping, temporal, partition_defs, catalog)
#   - Added: Kind.extras property pointing to KindExtras
#   - Changed: KindDatasetInline.extras.column_mapping is now optional;
#     may be inherited from kind.extras.column_mapping
#   - Changed: StorageConfig now accepts table (catalog ref) as alternative to path (file/object store)
#
# Changelog v1.4 vs v1.3:
#   - Added: MeasureDef.agg — declarative aggregation function (sum, avg, count, etc.)
#   - Added: MetricDef.agg — optional two-stage aggregation for metrics
#   - Changed: MeasureDef.expr is now optional when agg is specified
#   - Added: AggregationType definition
#   - Added: DimensionType.metadata variant with path.token and partition.level
#
# Changelog v1.5 vs v1.4:
#   - Added: SemanticModel.catalog — top-level catalog connection configuration
#   - Added: CatalogConnectionConfig definition (type, url, warehouse, prefix, auth)
#   - Added: CatalogAuthConfig definition with tagged union (none, bearer, oauth2, polaris)
#   - Supports env var substitution via ${VAR} in YAML values (resolved at parse time)
#
# Changelog v1.6 vs v1.5:
#   - Added: ColumnMappingValue.Literal variant — { lit: "value" } for constant injection
#   - Added: ColumnMappingValue.Anchored variant — { anchor: column, ... } for composed expressions
#   - Added: LiteralValue definition (string-only for now, extensible)
#
# Changelog v1.7 vs v1.6:
#   - Added: DimensionDef.expr — computed dimension expression (ExprSource: string or ExprBlock)
#   - Added: ExprSource definition (oneOf: string | ExprBlock object)
#   - Added: ExprBlock definition — 60-key declarative expression blocks
#   - Added: Supporting types: TwoArgs, CaseBlock, WhenBlock, InListBlock, etc.
# =============================================================================

$schema: https://json-schema.org/draft-07/schema#
$id: https://semstrait.io/schemas/semantic-model/v1.7.yaml
title: SemanticModel
description: >
  Semstrait semantic model definition. Defines datasets, kinds (grainset,
  unionset, joinset), dimensions, measures, metrics, and relationships.

type: object
required: [semantic_model]
additionalProperties: false
properties:
  semantic_model:
    $ref: "#/definitions/SemanticModel"

# =============================================================================
# Definitions
# =============================================================================
definitions:
  # ---------------------------------------------------------------------------
  # Root model
  # ---------------------------------------------------------------------------
  SemanticModel:
    type: object
    required: [name]
    additionalProperties: false
    x-category: root
    x-since: v1.0
    properties:
      name:
        type: string
        minLength: 1
        description: Unique model identifier.
        x-examples: [ecommerce_model, marketing_analytics]
      description:
        type: string
        description: Human-readable model description.
      ai_context:
        type: string
        description: Free-form context injected into AI query parsing prompts.
      labels:
        type: array
        items: { type: string }
        description: Arbitrary labels for tooling and governance.
        x-since: v1.1
      namespace:
        type: string
        description: Catalog namespace for glob dataset expansion (defaults to "default").
        x-since: v1.2
        x-examples: [default, production, staging]
      catalog:
        $ref: "#/definitions/CatalogConnectionConfig"
        description: >
          Top-level catalog connection configuration. Defines how to connect to
          the catalog provider (e.g. Iceberg REST) including authentication.
          Values may use ${ENV_VAR} syntax for secrets.
        x-since: v1.5
      datasets:
        type: array
        items: { $ref: "#/definitions/Dataset" }
      grainsets:
        type: array
        items: { $ref: "#/definitions/Grainset" }
        description: Grainset kinds - datasets at different grains.
      unionsets:
        type: array
        items: { $ref: "#/definitions/Unionset" }
        description: Unionset kinds - datasets combined via UNION.
      joinsets:
        type: array
        items: { $ref: "#/definitions/Joinset" }
        description: Joinset kinds - datasets joined together.
      relationships:
        type: array
        items: { $ref: "#/definitions/Relationship" }
      dimensions:
        type: array
        items: { $ref: "#/definitions/DimensionDef" }
        description: Reusable dimension definitions, referenced via ref syntax.
      measures:
        type: array
        items: { $ref: "#/definitions/MeasureDef" }
        description: Reusable measure definitions, referenced via ref syntax.
      metrics:
        type: array
        items: { $ref: "#/definitions/MetricDef" }
        description: Reusable metric definitions, referenced via ref syntax.

  # ---------------------------------------------------------------------------
  # Dataset
  # ---------------------------------------------------------------------------
  Dataset:
    type: object
    required: [name]
    additionalProperties: false
    x-category: entity
    x-since: v1.0
    description: >
      A queryable dataset backed by a physical table or view.
      Contains dimensions, measures, and metrics.
    properties:
      name:
        type: string
        minLength: 1
      description:
        type: string
      tags:
        $ref: "#/definitions/Tags"
      ai_context:
        $ref: "#/definitions/AiContext"
      keys:
        $ref: "#/definitions/Keys"
      dimensions:
        type: array
        items: { $ref: "#/definitions/DimensionEntry" }
      measures:
        type: array
        items: { $ref: "#/definitions/MeasureEntry" }
      metrics:
        type: array
        items: { $ref: "#/definitions/MetricEntry" }
      filters:
        type: array
        items: { $ref: "#/definitions/DatasetFilter" }
        description: Base WHERE predicates applied to every query on this dataset.
      extras:
        $ref: "#/definitions/DatasetExtras"

  # ---------------------------------------------------------------------------
  # Grainset
  # ---------------------------------------------------------------------------
  Grainset:
    type: object
    required: [name, datasets]
    additionalProperties: false
    x-category: entity
    x-since: v1.0
    description: >
      Datasets representing the same entity at different grains.
      Planner picks the optimal dataset(s) to answer the query.
    properties:
      name:
        type: string
        minLength: 1
      description:
        type: string
      ai_context:
        $ref: "#/definitions/AiContext"
      keys:
        $ref: "#/definitions/Keys"
      dimensions:
        type: array
        items: { $ref: "#/definitions/DimensionEntry" }
      measures:
        type: array
        items: { $ref: "#/definitions/MeasureEntry" }
      metrics:
        type: array
        items: { $ref: "#/definitions/MetricEntry" }
      datasets:
        type: array
        minItems: 1
        items: { $ref: "#/definitions/KindDatasetEntry" }
      filters:
        type: array
        items: { $ref: "#/definitions/MeasureFilter" }
        description: Grainset-level filters applied to all queries.
        x-since: v1.1
      extras:
        $ref: "#/definitions/KindExtras"
        description: Grainset-level default extras applied to all datasets.
        x-since: v1.3
      unionsets:
        type: array
        items: { $ref: "#/definitions/Unionset" }
        description: Nested unionset kinds (flattened to top-level during parse).
        x-since: v1.4
      joinsets:
        type: array
        items: { $ref: "#/definitions/Joinset" }
        description: Nested joinset kinds (flattened to top-level during parse).
        x-since: v1.4

  # ---------------------------------------------------------------------------
  # Unionset
  # ---------------------------------------------------------------------------
  Unionset:
    type: object
    required: [name, datasets]
    additionalProperties: false
    x-category: entity
    x-since: v1.0
    description: >
      Datasets combined via UNION ALL/DISTINCT. Missing columns are NULL-filled.
    properties:
      name:
        type: string
        minLength: 1
      description:
        type: string
      mode:
        type: string
        enum: [all, distinct]
        default: all
        description: UNION ALL (default) or UNION DISTINCT.
        x-since: v1.2
      ai_context:
        $ref: "#/definitions/AiContext"
      keys:
        $ref: "#/definitions/Keys"
      dimensions:
        type: array
        items: { $ref: "#/definitions/DimensionEntry" }
      measures:
        type: array
        items: { $ref: "#/definitions/MeasureEntry" }
      metrics:
        type: array
        items: { $ref: "#/definitions/MetricEntry" }
      datasets:
        type: array
        minItems: 1
        items: { $ref: "#/definitions/KindDatasetEntry" }
      filters:
        type: array
        items: { $ref: "#/definitions/MeasureFilter" }
        description: Unionset-level filters applied to all queries.
        x-since: v1.1
      extras:
        $ref: "#/definitions/KindExtras"
        description: Unionset-level default extras applied to all datasets.
        x-since: v1.3
      grainsets:
        type: array
        items: { $ref: "#/definitions/Grainset" }
        description: Nested grainset kinds (flattened to top-level during parse).
        x-since: v1.4
      unionsets:
        type: array
        items: { $ref: "#/definitions/Unionset" }
        description: Nested unionset kinds (valid but emits COMP_W010 warning).
        x-since: v1.4
      joinsets:
        type: array
        items: { $ref: "#/definitions/Joinset" }
        description: Nested joinset kinds (flattened to top-level during parse).
        x-since: v1.4

  # ---------------------------------------------------------------------------
  # Joinset
  # ---------------------------------------------------------------------------
  Joinset:
    type: object
    required: [name, datasets]
    additionalProperties: false
    x-category: entity
    x-since: v1.0
    description: >
      Datasets joined together. Unused datasets are pruned from the join tree.
    properties:
      name:
        type: string
        minLength: 1
      description:
        type: string
      associativity:
        type: string
        enum: [left, right, full]
        default: left
        description: Default join type for all edges unless overridden per-relationship.
      ai_context:
        $ref: "#/definitions/AiContext"
      keys:
        $ref: "#/definitions/Keys"
      dimensions:
        type: array
        items: { $ref: "#/definitions/DimensionEntry" }
      measures:
        type: array
        items: { $ref: "#/definitions/MeasureEntry" }
      metrics:
        type: array
        items: { $ref: "#/definitions/MetricEntry" }
      datasets:
        type: array
        minItems: 1
        items: { $ref: "#/definitions/KindDatasetEntry" }
      relationships:
        type: array
        items: { $ref: "#/definitions/KindRelationship" }
        description: Join paths between kind-internal datasets (REQUIRED for joinset).
      filters:
        type: array
        items: { $ref: "#/definitions/MeasureFilter" }
        description: Joinset-level filters applied to all queries.
        x-since: v1.1
      extras:
        $ref: "#/definitions/KindExtras"
        description: Joinset-level default extras applied to all datasets.
        x-since: v1.3
      grainsets:
        type: array
        items: { $ref: "#/definitions/Grainset" }
        description: Nested grainset kinds (flattened to top-level during parse).
        x-since: v1.4
      unionsets:
        type: array
        items: { $ref: "#/definitions/Unionset" }
        description: Nested unionset kinds (flattened to top-level during parse).
        x-since: v1.4

  # ---------------------------------------------------------------------------
  # Kind Dataset Entry
  # ---------------------------------------------------------------------------
  KindDatasetEntry:
    oneOf:
      - $ref: "#/definitions/KindDatasetInline"
      - $ref: "#/definitions/RefEntry"

  KindDatasetInline:
    type: object
    required: [name, extras]
    additionalProperties: false
    x-category: binding
    properties:
      name:
        type: string
        minLength: 1
        description: >
          Dataset name (semantic entity — always a concrete name).
          Glob patterns belong at the storage level (StorageConfig.paths/tables),
          not on dataset names. Legacy: "orders_*" glob on name is supported
          for catalog-driven expansion but prefer explicit names.
        x-examples: [orders_daily, orders_archive]
      description:
        type: string
      ai_context:
        $ref: "#/definitions/AiContext"
      extras:
        type: object
        additionalProperties: false
        description: >
          Per-dataset extras. column_mapping is optional when a kind-level
          column_mapping is defined in kind.extras.
        properties:
          column_mapping:
            $ref: "#/definitions/ColumnMapping"
          temporal:
            $ref: "#/definitions/TemporalConfig"
          storage:
            $ref: "#/definitions/StorageConfig"
          catalog:
            $ref: "#/definitions/CatalogConfig"

  ColumnMapping:
    type: object
    description: >
      Maps kind-level semantic names to physical column names.
      Keys are semantic names; values are strings or structured objects.
    additionalProperties:
      $ref: "#/definitions/ColumnMappingValue"

  ColumnMappingValue:
    oneOf:
      - type: string
        minLength: 1
        description: Simple mapping to a physical column name.
      - type: object
        required: [column]
        additionalProperties: false
        description: Structured mapping with optional grain override.
        properties:
          column:
            type: string
            minLength: 1
            description: Physical column name.
          grain:
            $ref: "#/definitions/TemporalGrain"
      - type: object
        required: [lit]
        additionalProperties: false
        description: Literal constant value injection.
        properties:
          lit:
            type: string
            description: The literal string value to inject.
      - type: object
        additionalProperties:
          type: string
        description: >
          Anchored sub-name mapping for composed expressions.
          Keys are anchor names used in expr; values are physical column names.
          Reserved anchor names: 'column', 'literal'.

  # ---------------------------------------------------------------------------
  # Dimensions
  # ---------------------------------------------------------------------------
  DimensionEntry:
    oneOf:
      - $ref: "#/definitions/DimensionDef"
      - $ref: "#/definitions/RefEntry"

  DimensionDef:
    type: object
    required: [name]
    additionalProperties: false
    x-category: interface
    x-since: v1.0
    properties:
      name:
        type: string
        minLength: 1
      description:
        type: string
      data_type:
        $ref: "#/definitions/DataType"
      expr:
        $ref: "#/definitions/ExprSource"
        description: >
          Computed dimension expression. When present, this dimension is derived
          from an expression over other columns rather than being a direct physical
          column. Computed dimensions are excluded from column_mapping completeness
          checks and emitted as post-aggregation ProjectNode expressions.
          Accepts inline string ("UPPER(region)") or declarative ExprBlock.
        x-since: v1.7
        x-examples:
          - "UPPER(region)"
          - "CASE WHEN region IN ('US', 'EU') THEN 'Tier 1' ELSE 'Tier 2' END"
      ai_context:
        $ref: "#/definitions/AiContext"
      type:
        $ref: "#/definitions/DimensionType"
        description: >
          Dimension type. Defaults to categorical (no enum constraint) when omitted.

  DimensionType:
    type: object
    additionalProperties: false
    minProperties: 1
    maxProperties: 1
    description: >
      Discriminated union: exactly one of temporal, categorical, binary, geo, bucketed, or metadata.
    properties:
      temporal:
        type: object
        required: [grains]
        additionalProperties: false
        properties:
          grains:
            type: array
            items: { $ref: "#/definitions/TemporalGrain" }
            minItems: 1
            uniqueItems: true
      categorical:
        type: ["object", "null"]
        additionalProperties: false
        properties:
          enum:
            type: array
            items: { type: string }
            description: Optional allow-list of valid values.
      binary:
        type: object
        required: [type]
        additionalProperties: false
        properties:
          type:
            type: string
            enum: [boolean, bit, string]
      geo:
        type: object
        required: [lat, lon]
        additionalProperties: false
        properties:
          lat:
            type: string
            description: Physical column name for latitude.
          lon:
            type: string
            description: Physical column name for longitude.
      bucketed:
        type: object
        required: [column, buckets]
        additionalProperties: false
        properties:
          column:
            type: string
            description: Source numeric physical column.
          buckets:
            type: array
            minItems: 1
            items:
              type: object
              required: [name, start, end]
              additionalProperties: false
              properties:
                name: { type: string }
                start: { type: number }
                end: { type: number }
      metadata:
        type: object
        additionalProperties: false
        x-since: v1.4
        description: >
          Metadata dimension — extracts values from source metadata rather than
          physical columns. Must specify at least one of path or partition.
        properties:
          path:
            type: object
            required: [token]
            additionalProperties: false
            description: >
              Extract a raw segment from the source path (file or table).
              Tokenizer splits on '/'. Position is 0-indexed.
            properties:
              token:
                type: integer
                minimum: 0
                description: 0-indexed path segment position.
            x-examples:
              - { token: 2 }
              - { token: 5 }
          partition:
            type: object
            required: [level]
            additionalProperties: false
            description: >
              Extract the VALUE from a Hive-style key=value partition.
              Level is 1-indexed.
            properties:
              level:
                type: integer
                minimum: 1
                description: 1-indexed partition level.
            x-examples:
              - { level: 1 }
              - { level: 2 }

  # ---------------------------------------------------------------------------
  # Measures
  # ---------------------------------------------------------------------------
  MeasureEntry:
    oneOf:
      - $ref: "#/definitions/MeasureDef"
      - $ref: "#/definitions/RefEntry"

  MeasureDef:
    type: object
    required: [name]
    additionalProperties: false
    x-category: interface
    x-since: v1.0
    description: >
      A quantitative aggregation definition. Either 'agg' (declarative) or
      'expr' (legacy with embedded aggregation) must be specified.
      When 'agg' is set, 'expr' is optional and must be horizontal-only
      (no aggregation functions). When 'agg' is absent, 'expr' is required
      and must contain the aggregation function (e.g. "SUM(amount)").
    properties:
      name:
        type: string
        minLength: 1
        x-examples: [revenue, order_count, avg_price]
      description:
        type: string
      data_type:
        $ref: "#/definitions/DataType"
      ai_context:
        $ref: "#/definitions/AiContext"
      agg:
        $ref: "#/definitions/AggregationType"
        description: >
          Declarative aggregation function. When specified, expr (if any)
          is treated as a horizontal transformation applied before aggregation.
          If no expr is provided, the column is resolved from column_mapping
          by the measure's name.
        x-since: v1.4
        x-examples: [sum, avg, count, count_distinct, min, max]
      expr:
        type: string
        minLength: 1
        description: >
          DSL expression. When 'agg' is specified, this is horizontal-only
          (no aggregation functions allowed). When 'agg' is absent (legacy),
          must contain the aggregation: SUM, AVG, COUNT, COUNT_DISTINCT,
          MIN, MAX. Raw SQL strings are rejected.
        x-examples:
          - "SUM(amount)"
          - "amount + price"
          - "amount"
      additivity:
        $ref: "#/definitions/Additivity"
      constraints:
        $ref: "#/definitions/Constraints"
      filters:
        type: array
        items: { $ref: "#/definitions/MeasureFilter" }
        description: >
          Per-measure predicates. Applied via conditional aggregation
          (CASE WHEN filter THEN expr ELSE NULL END) when multiple measures
          share a dataset.

  # ---------------------------------------------------------------------------
  # Metrics
  # ---------------------------------------------------------------------------
  MetricEntry:
    oneOf:
      - $ref: "#/definitions/MetricDef"
      - $ref: "#/definitions/RefEntry"

  MetricDef:
    type: object
    required: [name, expr]
    additionalProperties: false
    x-category: interface
    x-since: v1.0
    description: >
      A derived computation referencing measures or other metrics.
      Chaining depth limit: 3 levels in v1 (metric -> metric -> measure).
      When 'agg' is specified, creates a two-stage aggregation plan.
    properties:
      name:
        type: string
        minLength: 1
        x-examples: [avg_order_value, profit_margin, conversion_rate]
      description:
        type: string
      data_type:
        $ref: "#/definitions/DataType"
      ai_context:
        $ref: "#/definitions/AiContext"
      agg:
        $ref: "#/definitions/AggregationType"
        description: >
          Optional two-stage aggregation. Inner grain = all request dimensions,
          outer grain = remaining dimensions after this metric's agg consumes
          inner groups. Metrics can only reference existing semantic elements
          (measures, dimensions, keys).
        x-since: v1.4
      expr:
        type: string
        minLength: 1
        description: >
          DSL expression referencing measure names or other metric names.
        x-examples:
          - "revenue / order_count"
          - "profit / revenue"
          - "(revenue - cost) / revenue"
      additivity:
        $ref: "#/definitions/Additivity"
      constraints:
        $ref: "#/definitions/Constraints"
      filters:
        type: array
        items: { $ref: "#/definitions/MeasureFilter" }

  # ---------------------------------------------------------------------------
  # Aggregation
  # ---------------------------------------------------------------------------
  AggregationType:
    type: string
    enum: [sum, avg, count, count_distinct, min, max]
    x-category: interface
    x-since: v1.4
    description: >
      Declarative aggregation function for measures and metrics.
      Replaces embedding aggregation in expr strings.

  # ---------------------------------------------------------------------------
  # Filters
  # ---------------------------------------------------------------------------
  DatasetFilter:
    type: object
    required: [name, expr]
    additionalProperties: false
    x-category: predicate
    description: >
      Dataset-level base WHERE predicate. Applied before measure/user filters.
    properties:
      name:
        type: string
        minLength: 1
      expr:
        type: string
        minLength: 1
        description: DSL filter expression.
        x-examples:
          - "status != 'cancelled'"
          - "is_deleted = false"

  MeasureFilter:
    type: object
    required: [name, expr]
    additionalProperties: false
    x-category: predicate
    description: >
      Measure/metric/kind-level filter predicate.
    properties:
      name:
        type: string
        minLength: 1
      expr:
        $ref: "#/definitions/ExprSource"
        description: >
          DSL filter expression. Accepts inline string or declarative ExprBlock.
        x-examples:
          - "status != 'cancelled'"
          - "amount > 0"

  # ---------------------------------------------------------------------------
  # Additivity
  # ---------------------------------------------------------------------------
  Additivity:
    type: object
    required: [type]
    additionalProperties: false
    x-category: property
    description: >
      Informs the planner how to handle re-aggregation across grains.
    properties:
      type:
        type: object
        additionalProperties: false
        minProperties: 1
        maxProperties: 1
        properties:
          full:
            type: ["object", "null"]
            additionalProperties: false
            description: Fully additive. SUM of SUMs is correct.
          semi:
            type: object
            required: [non_additive_dimensions]
            additionalProperties: false
            description: >
              Blocked on specific dimensions. Planner injects a
              pre-resolution sub-query to collapse the non-additive
              dimension before aggregation.
            properties:
              non_additive_dimensions:
                type: array
                items: { type: string }
                minItems: 1
              resolution_strategy:
                type: string
                enum: [latest, earliest, max, min]
                default: latest
          non:
            type: ["object", "null"]
            additionalProperties: false
            description: >
              Never re-aggregatable. Dataset must be at exact source grain.

  # ---------------------------------------------------------------------------
  # Constraints
  # ---------------------------------------------------------------------------
  Constraints:
    type: object
    additionalProperties: false
    x-category: property
    description: >
      Evaluated BEFORE additivity. Violation rejects the query.
    properties:
      dimensions:
        type: object
        additionalProperties: false
        properties:
          one_of:
            type: array
            items: { type: string }
            description: At least one must be in GROUP BY or WHERE.
          none_of:
            type: array
            items: { type: string }
            description: None may be in the query scope.
          all:
            type: array
            items: { type: string }
            description: All must be in GROUP BY or WHERE.
      aggregations:
        type: object
        additionalProperties: false
        properties:
          allowed:
            type: array
            items: { type: string }
            description: Only these aggregation functions are valid.
          prohibited:
            type: array
            items: { type: string }
            description: These aggregation functions are never valid.

  # ---------------------------------------------------------------------------
  # Relationships
  # ---------------------------------------------------------------------------
  Relationship:
    type: object
    required: [name, from, to, type, columns, cardinality]
    additionalProperties: false
    x-category: binding
    x-since: v1.0
    description: >
      Join path between datasets and/or kinds. Structurally identical at all
      scopes (top-level and kind-level). Scope determines namespace:
      top-level = cross-entity joins, kind-level = intra-kind joins (joinset).
    properties:
      name:
        type: string
        minLength: 1
      from:
        type: string
        description: Source dataset or kind name.
      to:
        type: string
        description: Target dataset or kind name.
      type:
        $ref: "#/definitions/JoinType"
      columns:
        type: array
        minItems: 1
        items:
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from: { type: string }
            to: { type: string }
      cardinality:
        $ref: "#/definitions/Cardinality"

  # KindRelationship is structurally identical to Relationship.
  # Scope determines semantics: top-level = cross-entity, kind-level = intra-kind.
  KindRelationship:
    $ref: "#/definitions/Relationship"

  # ---------------------------------------------------------------------------
  # Keys
  # ---------------------------------------------------------------------------
  Keys:
    type: object
    additionalProperties: false
    x-category: property
    properties:
      primary:
        type: array
        items: { type: string }
        minItems: 1
      unique:
        type: array
        items:
          type: object
          required: [columns]
          additionalProperties: false
          properties:
            columns:
              type: array
              items: { type: string }
              minItems: 1
      foreign:
        type: array
        items:
          type: object
          required: [columns, reference, cardinality]
          additionalProperties: false
          properties:
            columns:
              type: array
              items: { type: string }
              minItems: 1
            reference:
              type: string
            cardinality:
              $ref: "#/definitions/Cardinality"

  # ---------------------------------------------------------------------------
  # Extras (storage, temporal, catalog)
  # ---------------------------------------------------------------------------
  KindExtras:
    type: object
    additionalProperties: false
    x-category: binding
    x-since: v1.3
    description: >
      Kind-level default extras applied to all datasets in this kind.
      Per-dataset extras override these defaults field by field.
      Structurally equivalent to DatasetExtras — scope disambiguates semantics.
    properties:
      column_mapping:
        $ref: "#/definitions/ColumnMapping"
      temporal:
        $ref: "#/definitions/TemporalConfig"
      partition_defs:
        type: array
        items: { $ref: "#/definitions/PartitionDef" }
      catalog:
        $ref: "#/definitions/CatalogConfig"

  DatasetExtras:
    type: object
    additionalProperties: false
    x-category: binding
    description: >
      Standalone dataset extras. Structurally equivalent to KindExtras —
      scope disambiguates semantics.
    properties:
      catalog:
        $ref: "#/definitions/CatalogConfig"
      temporal:
        $ref: "#/definitions/TemporalConfig"
      storage:
        $ref: "#/definitions/StorageConfig"

  CatalogConfig:
    type: object
    required: [type]
    additionalProperties: false
    properties:
      type:
        type: string
        description: Catalog provider type (per-dataset type hint).
        x-examples: [iceberg, polaris, hive, glue]

  CatalogConnectionConfig:
    type: object
    required: [type, url]
    additionalProperties: false
    x-category: binding
    x-since: v1.5
    description: >
      Top-level catalog connection configuration. Defines how to connect to
      the catalog provider for glob expansion and schema snapshots.
      Values may use ${ENV_VAR} syntax for sensitive fields.
    properties:
      type:
        type: string
        minLength: 1
        description: Catalog provider type.
        x-examples: [iceberg_rest]
      url:
        type: string
        minLength: 1
        description: Catalog endpoint URL.
        x-examples: [https://polaris.example.com/api/catalog]
      warehouse:
        type: string
        description: Catalog warehouse identifier.
        x-examples: [my_warehouse]
      prefix:
        type: string
        description: Optional path prefix for multi-tenant catalogs.
      auth:
        $ref: "#/definitions/CatalogAuthConfig"

  CatalogAuthConfig:
    x-category: binding
    x-since: v1.5
    description: >
      Authentication configuration for catalog connections. Tagged union
      discriminated by the 'method' field.
    oneOf:
      - $ref: "#/definitions/CatalogAuthNone"
      - $ref: "#/definitions/CatalogAuthBearer"
      - $ref: "#/definitions/CatalogAuthOauth2"
      - $ref: "#/definitions/CatalogAuthPolaris"

  CatalogAuthNone:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method:
        type: string
        enum: [none]

  CatalogAuthBearer:
    type: object
    required: [method, token]
    additionalProperties: false
    properties:
      method:
        type: string
        enum: [bearer]
      token:
        type: string
        minLength: 1
        description: Bearer token. Use ${ENV_VAR} for secrets.
        x-examples: ["${CATALOG_TOKEN}"]

  CatalogAuthOauth2:
    type: object
    required: [method, token_url, client_id, client_secret]
    additionalProperties: false
    properties:
      method:
        type: string
        enum: [oauth2]
      token_url:
        type: string
        minLength: 1
        description: OAuth2 token endpoint URL.
      client_id:
        type: string
        minLength: 1
        description: OAuth2 client ID. Use ${ENV_VAR} for secrets.
      client_secret:
        type: string
        minLength: 1
        description: OAuth2 client secret. Use ${ENV_VAR} for secrets.
      scope:
        type: string
        description: OAuth2 scope.
        x-examples: ["PRINCIPAL_ROLE:ALL"]

  CatalogAuthPolaris:
    type: object
    required: [method, secret_arn]
    additionalProperties: false
    description: >
      Polaris authentication via AWS Secrets Manager. Fetches client_id/client_secret
      from the secret, performs OAuth2 against the Polaris token endpoint.
      Uses AWS default credential chain (SSO, IAM roles, env vars) unless
      explicit aws_access_key_id/aws_secret_access_key are provided.
    properties:
      method:
        type: string
        enum: [polaris]
      secret_arn:
        type: string
        minLength: 1
        description: AWS Secrets Manager ARN containing Polaris credentials.
        x-examples: ["arn:aws:secretsmanager:eu-west-1:123456:secret/polaris-creds"]
      region:
        type: string
        description: AWS region for Secrets Manager.
        x-examples: [eu-west-1, us-east-1]
      realm:
        type: string
        description: Polaris realm (injected as Polaris-Realm header).
        x-examples: [POLARIS]
      scope:
        type: string
        description: OAuth2 scope for Polaris token request.
        x-examples: ["PRINCIPAL_ROLE:ALL"]
      aws_access_key_id:
        type: string
        description: >
          Explicit AWS access key ID for Secrets Manager access.
          If omitted, uses the default AWS credential chain. Use ${ENV_VAR}.
      aws_secret_access_key:
        type: string
        description: >
          Explicit AWS secret access key for Secrets Manager access.
          If omitted, uses the default AWS credential chain. Use ${ENV_VAR}.

  TemporalConfig:
    type: object
    required: [type]
    additionalProperties: false
    description: >
      Temporal historization pattern. Orthogonal to grain resolution
      (which lives on dimension.temporal.grains). Both can coexist.
      grain and dimension fields enable auto-propagation and auto-derivation.
    properties:
      grain:
        type: string
        enum: [minute, hour, day, week, month, quarter, year]
        description: >
          Data-level temporal cadence. When set, auto-propagates to
          column_mapping grain if the physical column matches occurred_at/snapshotted_at.
      dimension:
        type: string
        description: >
          Links this temporal config to a semantic dimension name.
          Used to set KindInterface.temporal_dim and enable grain auto-propagation.
      type:
        type: object
        additionalProperties: false
        minProperties: 1
        maxProperties: 1
        properties:
          events:
            type: object
            required: [occurred_at]
            additionalProperties: false
            description: >
              Independent occurrences (transactions, clicks). Fully additive,
              standard GROUP BY. No window functions needed.
            properties:
              occurred_at:
                type: string
                description: Physical column name for event timestamp.
          timeseries:
            type: object
            required: [occurred_at]
            additionalProperties: false
            description: >
              Periodic measurements at regular intervals. Semi-additive,
              may need LAST_VALUE/window dedup before cross-time aggregation.
            properties:
              occurred_at:
                type: string
                description: Physical column name for event timestamp.
          snapshot:
            type: object
            required: [snapshotted_at]
            additionalProperties: false
            description: >
              Periodic loads identified by a snapshot column.
              Planner injects: col = (SELECT MAX(col) FROM same_table).
            properties:
              snapshotted_at:
                type: string
                description: Physical column name for snapshot timestamp.
          scd:
            $ref: "#/definitions/ScdConfig"

  ScdConfig:
    type: object
    additionalProperties: false
    minProperties: 1
    maxProperties: 1
    description: Slowly Changing Dimension strategy.
    properties:
      type_1:
        type: ["object", "null"]
        additionalProperties: false
        description: Always overwrite. No temporal filter needed.
      type_2:
        type: object
        required: [valid_from, valid_to]
        additionalProperties: false
        description: >
          Versioned rows. Planner injects: valid_to IS NULL.
        properties:
          valid_from: { type: string }
          valid_to: { type: string }
      type_3:
        type: ["object", "null"]
        additionalProperties: false
        description: Current + previous value in same row.
      type_4:
        type: ["object", "null"]
        additionalProperties: false
        description: History in a separate table.
      type_5:
        type: object
        required: [valid_from, valid_to]
        additionalProperties: false
        description: Type 1 + Type 4 hybrid.
        properties:
          valid_from: { type: string }
          valid_to: { type: string }
      type_6:
        type: object
        required: [valid_from, valid_to]
        additionalProperties: false
        description: Type 1 + Type 2 + Type 3 hybrid.
        properties:
          valid_from: { type: string }
          valid_to: { type: string }

  StorageConfig:
    type: object
    additionalProperties: false
    description: >
      Physical storage location. Paths and tables are mutually exclusive — cannot mix
      file and catalog sources in the same dataset. Multiple sources imply UNION ALL semantics.
    properties:
      format:
        type: string
        enum: [iceberg, parquet, csv]
        description: >
          Data format. Required for paths (parquet/csv/iceberg), omitted for tables
          (catalog determines format).
      paths:
        type: array
        items: { type: string, minLength: 1 }
        description: File/object store paths (local://, s3://). May contain glob patterns.
        x-examples: [["s3://bucket/orders_*.parquet", "local://data/events.csv"]]
      tables:
        type: array
        items: { type: string, minLength: 1 }
        description: Catalog table references (namespace.table). May contain wildcards.
        x-examples: [["tiktok.campaign_data", "tiktok.adgroup_*"]]
      partition_def:
        $ref: "#/definitions/PartitionDef"

  PartitionDef:
    type: object
    required: [type]
    additionalProperties: false
    properties:
      type:
        type: object
        additionalProperties: false
        minProperties: 1
        maxProperties: 1
        properties:
          range:
            type: object
            required: [column, start, end]
            additionalProperties: false
            properties:
              column: { type: string }
              start: { type: string }
              end: { type: string }
          list:
            type: object
            required: [column, values]
            additionalProperties: false
            properties:
              column: { type: string }
              values:
                type: array
                items: { type: string }
                minItems: 1

  # ---------------------------------------------------------------------------
  # AI Context
  # ---------------------------------------------------------------------------
  AiContext:
    type: object
    additionalProperties: false
    x-category: metadata
    x-since: v1.1
    description: >
      AI-facing metadata for query understanding, disambiguation,
      and semantic search. All fields optional.
    properties:
      synonyms:
        type: array
        items: { type: string }
        description: Alternative names users may use to refer to this entity.
        x-examples: [["order date", "purchase date", "transaction date"]]
      query_patterns:
        type: array
        items: { type: string }
        description: Example natural-language queries for few-shot AI resolution.
        x-examples: [["What was our total revenue?", "How much did we sell?"]]
      value_examples:
        type: array
        items: { type: string }
        description: Representative sample values (format/cardinality hints).
        x-examples: [["2024-01-15", "electronics", "1234.56"]]
      semantic_tags:
        type: array
        items: { type: string }
        description: Free-form labels for embedding-based retrieval.
        x-examples: [["kpi", "financial", "outcome"]]
      aggregation_intent:
        type: string
        enum: [sum, avg, count, count_distinct, max, min]
        description: >
          Typical aggregation when a user asks for this measure.
          Descriptive only; planner uses the expr field.
        x-since: v1.2
      unit:
        type: string
        description: Unit or currency of the measure/dimension.
        x-examples: [USD, seconds, users]
        x-since: v1.2
      not:
        type: array
        items: { type: string }
        description: What this field is NOT (prevents AI misresolution).
        x-examples: [["refunds", "returns"]]
        x-since: v1.2
      entity:
        type: string
        description: The business entity this field describes.
        x-examples: [order, customer, campaign]
        x-since: v1.2
      importance:
        type: string
        enum: [high, medium, low]
        default: medium
        description: How likely this field is to be requested.
        x-since: v1.2
      description:
        type: string
        description: Business-facing description (for dataset/kind-level ai_context).
        x-since: v1.2
      authoritative_for:
        type: array
        items: { type: string }
        description: What this entity is the source of truth for.
        x-since: v1.2
      not_for:
        type: array
        items: { type: string }
        description: What this entity should NOT be used for.
        x-since: v1.2

  # ---------------------------------------------------------------------------
  # Expression DSL (ExprSource + ExprBlock)
  # ---------------------------------------------------------------------------
  ExprSource:
    description: >
      Expression source in YAML. Either an inline DSL string or a declarative
      ExprBlock map. Serde-discriminated by value type: string → inline parser,
      object → ExprBlock deserialization.
    x-category: interface
    x-since: v1.7
    oneOf:
      - type: string
        minLength: 1
        description: >
          Inline DSL string expression. Parsed by the expression parser.
          References semantic names, resolved at compile time via column_mapping.
        x-examples:
          - "UPPER(region)"
          - "cost / clicks"
          - "CASE WHEN region IN ('US', 'EU') THEN 'Tier 1' ELSE 'Tier 2' END"
      - $ref: "#/definitions/ExprBlock"

  ExprBlock:
    type: object
    additionalProperties: false
    minProperties: 1
    maxProperties: 1
    x-category: interface
    x-since: v1.7
    description: >
      Declarative expression block — single-key YAML map where the key
      determines the expression type. Maps 1:1 to Expr variants in
      semstrait-core. 60 keys across leaf, arithmetic, comparison, logical,
      conditional, predicates, pattern matching, string, math, date,
      type conversion, and guard categories.
      Known limitation (DL-049): works in top-level datasets but not inside
      grainsets/unionsets/joinsets due to serde_yaml nested untagged enum.
    properties:
      # ── Leaf nodes ──
      # Bare string = column ref, bare number/bool/null = literal (via deserializer sugar)
      lit:
        $ref: "#/definitions/ExprLiteralValue"
      # ── Arithmetic (BinaryOp) ──
      add:
        $ref: "#/definitions/TwoArgs"
      subtract:
        $ref: "#/definitions/TwoArgs"
      multiply:
        $ref: "#/definitions/TwoArgs"
      divide:
        $ref: "#/definitions/TwoArgs"
      safe_divide:
        $ref: "#/definitions/TwoArgs"
        description: Division with null-guard (CASE WHEN right = 0 THEN NULL ELSE left / right END).
      # ── Comparison (BinaryOp) ──
      eq:
        $ref: "#/definitions/TwoArgs"
      not_eq:
        $ref: "#/definitions/TwoArgs"
      lt:
        $ref: "#/definitions/TwoArgs"
      gt:
        $ref: "#/definitions/TwoArgs"
      lte:
        $ref: "#/definitions/TwoArgs"
      gte:
        $ref: "#/definitions/TwoArgs"
      # ── Logical ──
      and:
        $ref: "#/definitions/TwoArgs"
      or:
        $ref: "#/definitions/TwoArgs"
      not:
        $ref: "#/definitions/ExprBlock"
        description: Logical NOT.
      negate:
        $ref: "#/definitions/ExprBlock"
        description: Arithmetic negation (-expr).
      # ── Conditional ──
      case:
        $ref: "#/definitions/CaseBlock"
      coalesce:
        type: array
        items: { $ref: "#/definitions/ExprBlock" }
        minItems: 2
        description: COALESCE(expr1, expr2, ...).
      nullif:
        $ref: "#/definitions/NullIfBlock"
      if:
        type: array
        items: { $ref: "#/definitions/ExprBlock" }
        minItems: 3
        maxItems: 3
        description: Desugars to CASE WHEN condition THEN then ELSE else END.
      greatest:
        type: array
        items: { $ref: "#/definitions/ExprBlock" }
        minItems: 2
        description: GREATEST(expr1, expr2, ...).
      least:
        type: array
        items: { $ref: "#/definitions/ExprBlock" }
        minItems: 2
        description: LEAST(expr1, expr2, ...).
      # ── Predicates ──
      in:
        $ref: "#/definitions/InListBlock"
      not_in:
        $ref: "#/definitions/InListBlock"
        description: NOT IN predicate.
      between:
        $ref: "#/definitions/BetweenBlock"
      like:
        $ref: "#/definitions/PatternBlock"
      ilike:
        $ref: "#/definitions/PatternBlock"
        description: Case-insensitive LIKE.
      is_null:
        $ref: "#/definitions/ExprBlock"
        description: IS NULL predicate.
      is_not_null:
        $ref: "#/definitions/ExprBlock"
        description: IS NOT NULL predicate.
      # ── Pattern matching ──
      regexp_match:
        $ref: "#/definitions/RegexpMatchBlock"
      regexp_extract:
        $ref: "#/definitions/RegexpExtractBlock"
      # ── String functions ──
      upper:
        $ref: "#/definitions/ExprBlock"
      lower:
        $ref: "#/definitions/ExprBlock"
      trim:
        $ref: "#/definitions/ExprBlock"
      ltrim:
        $ref: "#/definitions/ExprBlock"
      rtrim:
        $ref: "#/definitions/ExprBlock"
      length:
        $ref: "#/definitions/ExprBlock"
      concat:
        type: array
        items: { $ref: "#/definitions/ExprBlock" }
        minItems: 2
        description: CONCAT(expr1, expr2, ...).
      replace:
        $ref: "#/definitions/ReplaceBlock"
      substr:
        $ref: "#/definitions/SubstringBlock"
      left:
        $ref: "#/definitions/LeftRightBlock"
      right:
        $ref: "#/definitions/LeftRightBlock"
      lpad:
        $ref: "#/definitions/PadBlock"
      rpad:
        $ref: "#/definitions/PadBlock"
      # ── Math functions ──
      abs:
        $ref: "#/definitions/ExprBlock"
      ceil:
        $ref: "#/definitions/ExprBlock"
      floor:
        $ref: "#/definitions/ExprBlock"
      round:
        $ref: "#/definitions/RoundBlock"
      power:
        $ref: "#/definitions/PowerBlock"
      sqrt:
        $ref: "#/definitions/ExprBlock"
      mod:
        $ref: "#/definitions/TwoArgs"
      # ── Date functions ──
      date_trunc:
        $ref: "#/definitions/DateTruncBlock"
      current_date:
        type: object
        additionalProperties: false
        description: Nullary — CURRENT_DATE.
      current_timestamp:
        type: object
        additionalProperties: false
        description: Nullary — CURRENT_TIMESTAMP.
      date_add:
        $ref: "#/definitions/DateAddBlock"
      date_diff:
        $ref: "#/definitions/DateDiffBlock"
      extract:
        $ref: "#/definitions/ExtractBlock"
      # ── Type conversion ──
      cast:
        $ref: "#/definitions/CastBlock"
      # ── Guard (sugar) ──
      guard:
        $ref: "#/definitions/GuardBlock"

  # ── ExprBlock supporting types ──

  ExprLiteralValue:
    description: Literal value — string, integer, float, boolean, or null.
    oneOf:
      - type: string
      - type: integer
      - type: number
      - type: boolean
      - type: "null"

  TwoArgs:
    description: >
      Two-argument expression. Array form [left, right] or map form {left:, right:}.
    oneOf:
      - type: array
        items: { $ref: "#/definitions/ExprBlock" }
        minItems: 2
        maxItems: 2
      - type: object
        required: [left, right]
        additionalProperties: false
        properties:
          left: { $ref: "#/definitions/ExprBlock" }
          right: { $ref: "#/definitions/ExprBlock" }

  CaseBlock:
    type: object
    required: [when]
    additionalProperties: false
    description: CASE WHEN ... THEN ... ELSE ... END.
    properties:
      when:
        type: array
        items: { $ref: "#/definitions/WhenBlock" }
        minItems: 1
      else:
        $ref: "#/definitions/ExprBlock"

  WhenBlock:
    type: object
    required: [condition, then]
    additionalProperties: false
    properties:
      condition: { $ref: "#/definitions/ExprBlock" }
      then: { $ref: "#/definitions/ExprBlock" }

  NullIfBlock:
    type: object
    required: [expr, null_expr]
    additionalProperties: false
    description: NULLIF(expr, null_expr).
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      null_expr: { $ref: "#/definitions/ExprBlock" }

  InListBlock:
    type: object
    required: [expr, list]
    additionalProperties: false
    description: IN / NOT IN predicate.
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      list:
        type: array
        items: { $ref: "#/definitions/ExprBlock" }
        minItems: 1

  BetweenBlock:
    type: object
    required: [expr, low, high]
    additionalProperties: false
    description: BETWEEN low AND high.
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      low: { $ref: "#/definitions/ExprBlock" }
      high: { $ref: "#/definitions/ExprBlock" }

  PatternBlock:
    type: object
    required: [expr, pattern]
    additionalProperties: false
    description: LIKE / ILIKE pattern matching.
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      pattern: { $ref: "#/definitions/ExprBlock" }

  RegexpMatchBlock:
    type: object
    required: [expr, pattern]
    additionalProperties: false
    description: Regular expression match (REGEXP_LIKE / ~ dialect-specific).
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      pattern: { $ref: "#/definitions/ExprBlock" }
      full_match:
        type: boolean
        default: false
        description: Whether the pattern must match the entire string.

  RegexpExtractBlock:
    type: object
    required: [expr, pattern]
    additionalProperties: false
    description: REGEXP_EXTRACT(expr, pattern, group).
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      pattern: { $ref: "#/definitions/ExprBlock" }
      group:
        type: integer
        minimum: 0
        default: 0
        description: Capture group index (0 = full match).

  ReplaceBlock:
    type: object
    required: [expr, old, new]
    additionalProperties: false
    description: REPLACE(expr, old, new).
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      old: { $ref: "#/definitions/ExprBlock" }
      new: { $ref: "#/definitions/ExprBlock" }

  SubstringBlock:
    type: object
    required: [expr, start]
    additionalProperties: false
    description: SUBSTRING(expr, start[, length]).
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      start:
        type: integer
      length:
        type: integer
        description: Optional length. If omitted, returns rest of string.

  LeftRightBlock:
    type: object
    required: [expr, length]
    additionalProperties: false
    description: LEFT(expr, length) or RIGHT(expr, length).
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      length:
        type: integer

  PadBlock:
    type: object
    required: [expr, length]
    additionalProperties: false
    description: LPAD/RPAD(expr, length, fill).
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      length:
        type: integer
      fill:
        type: string
        default: " "
        description: Pad character (default space).

  RoundBlock:
    type: object
    required: [expr]
    additionalProperties: false
    description: ROUND(expr, scale).
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      scale:
        type: integer
        default: 0
        description: Number of decimal places.

  PowerBlock:
    type: object
    required: [base, exponent]
    additionalProperties: false
    description: POWER(base, exponent).
    properties:
      base: { $ref: "#/definitions/ExprBlock" }
      exponent: { $ref: "#/definitions/ExprBlock" }

  DateTruncBlock:
    type: object
    required: [grain, expr]
    additionalProperties: false
    description: DATE_TRUNC('grain', expr).
    properties:
      grain:
        type: string
        enum: [minute, hour, day, week, month, quarter, year]
      expr: { $ref: "#/definitions/ExprBlock" }

  DateAddBlock:
    type: object
    required: [expr, days]
    additionalProperties: false
    description: DATE_ADD(expr, days).
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      days:
        type: integer

  DateDiffBlock:
    type: object
    required: [start, end]
    additionalProperties: false
    description: DATEDIFF(end, start).
    properties:
      start: { $ref: "#/definitions/ExprBlock" }
      end: { $ref: "#/definitions/ExprBlock" }

  ExtractBlock:
    type: object
    required: [part, expr]
    additionalProperties: false
    description: EXTRACT(part FROM expr).
    properties:
      part:
        type: string
        description: Date/time part to extract (year, month, day, etc.).
      expr: { $ref: "#/definitions/ExprBlock" }

  CastBlock:
    type: object
    required: [expr, to]
    additionalProperties: false
    description: CAST(expr AS to).
    properties:
      expr: { $ref: "#/definitions/ExprBlock" }
      to:
        type: string
        description: Target type name.

  GuardBlock:
    type: object
    required: [condition, expr]
    additionalProperties: false
    description: >
      Guard (sugar) — resolves to CASE WHEN condition THEN expr ELSE NULL END.
      Used for conditional measure/metric activation.
    properties:
      condition: { $ref: "#/definitions/ExprBlock" }
      expr: { $ref: "#/definitions/ExprBlock" }

