# yaml-language-server: $schema=https://json-schema.org/draft-07/schema#
# =============================================================================
# Semstrait Semantic Model — JSON Schema v1.6 (YAML encoding)
# =============================================================================
#
# Canonical machine-validatable schema for semstrait YAML model files.
# For human-readable annotated reference, see reference.yaml.
#
# Changelog v1.2 vs v1.1:
#   - Fixed: Expr fields are type: string (was incorrectly type: object)
#   - Fixed: Kind.filters added (was missing)
#   - Fixed: data_type required on DimensionDef, MeasureDef, MetricDef
#   - Fixed: KindType.unionset supports union_mode property
#   - Added: SemanticModel.namespace field
#   - Added: x-since, x-examples, x-category annotations
#   - Separated MeasureFilter from DatasetFilter (different shapes)
#
# Changelog v1.3 vs v1.2:
#   - Added: KindExtras definition — kind-level default extras for all datasets
#     (column_mapping, temporal, partition_defs, catalog)
#   - Added: Kind.extras property pointing to KindExtras
#   - Changed: KindDatasetInline.extras.column_mapping is now optional;
#     may be inherited from kind.extras.column_mapping
#   - Changed: StorageConfig now accepts table (catalog ref) as alternative to path (file/object store)
#
# Changelog v1.4 vs v1.3:
#   - Added: MeasureDef.agg — declarative aggregation function (sum, avg, count, etc.)
#   - Added: MetricDef.agg — optional two-stage aggregation for metrics
#   - Changed: MeasureDef.expr is now optional when agg is specified
#   - Added: AggregationType definition
#   - Added: DimensionType.metadata variant with path.token and partition.level
#
# Changelog v1.5 vs v1.4:
#   - Added: SemanticModel.catalog — top-level catalog connection configuration
#   - Added: CatalogConnectionConfig definition (type, url, warehouse, prefix, auth)
#   - Added: CatalogAuthConfig definition with tagged union (none, bearer, oauth2, polaris)
#   - Supports env var substitution via ${VAR} in YAML values (resolved at parse time)
#
# Changelog v1.6 vs v1.5:
#   - Added: ColumnMappingValue.Literal variant — { literal: "value" } for constant injection
#   - Added: ColumnMappingValue.Anchored variant — { anchor: column, ... } for composed expressions
#   - Added: LiteralValue definition (string-only for now, extensible)
# =============================================================================

$schema: https://json-schema.org/draft-07/schema#
$id: https://semstrait.io/schemas/semantic-model/v1.6.yaml
title: SemanticModel
description: >
  Semstrait semantic model definition. Defines datasets, kinds (grainset,
  unionset, joinset), dimensions, measures, metrics, and relationships.

type: object
required: [semantic_model]
additionalProperties: false
properties:
  semantic_model:
    $ref: "#/definitions/SemanticModel"

# =============================================================================
# Definitions
# =============================================================================
definitions:
  # ---------------------------------------------------------------------------
  # Root model
  # ---------------------------------------------------------------------------
  SemanticModel:
    type: object
    required: [name]
    additionalProperties: false
    x-category: root
    x-since: v1.0
    properties:
      name:
        type: string
        minLength: 1
        description: Unique model identifier.
        x-examples: [ecommerce_model, marketing_analytics]
      description:
        type: string
        description: Human-readable model description.
      ai_context:
        type: string
        description: Free-form context injected into AI query parsing prompts.
      labels:
        type: array
        items: { type: string }
        description: Arbitrary labels for tooling and governance.
        x-since: v1.1
      namespace:
        type: string
        description: Catalog namespace for glob dataset expansion (defaults to "default").
        x-since: v1.2
        x-examples: [default, production, staging]
      catalog:
        $ref: "#/definitions/CatalogConnectionConfig"
        description: >
          Top-level catalog connection configuration. Defines how to connect to
          the catalog provider (e.g. Iceberg REST) including authentication.
          Values may use ${ENV_VAR} syntax for secrets.
        x-since: v1.5
      datasets:
        type: array
        items: { $ref: "#/definitions/Dataset" }
      kinds:
        type: array
        items: { $ref: "#/definitions/Kind" }
      relationships:
        type: array
        items: { $ref: "#/definitions/Relationship" }
      dimensions:
        type: array
        items: { $ref: "#/definitions/DimensionDef" }
        description: Reusable dimension definitions, referenced via ref syntax.
      measures:
        type: array
        items: { $ref: "#/definitions/MeasureDef" }
        description: Reusable measure definitions, referenced via ref syntax.
      metrics:
        type: array
        items: { $ref: "#/definitions/MetricDef" }
        description: Reusable metric definitions, referenced via ref syntax.

  # ---------------------------------------------------------------------------
  # Dataset
  # ---------------------------------------------------------------------------
  Dataset:
    type: object
    required: [name]
    additionalProperties: false
    x-category: entity
    x-since: v1.0
    description: >
      A queryable dataset backed by a physical table or view.
      Contains dimensions, measures, and metrics.
    properties:
      name:
        type: string
        minLength: 1
      description:
        type: string
      tags:
        $ref: "#/definitions/Tags"
      domain:
        $ref: "#/definitions/Domain"
      ai_context:
        $ref: "#/definitions/AiContext"
      keys:
        $ref: "#/definitions/Keys"
      dimensions:
        type: array
        items: { $ref: "#/definitions/DimensionEntry" }
      measures:
        type: array
        items: { $ref: "#/definitions/MeasureEntry" }
      metrics:
        type: array
        items: { $ref: "#/definitions/MetricEntry" }
      filters:
        type: array
        items: { $ref: "#/definitions/DatasetFilter" }
        description: Base WHERE predicates applied to every query on this dataset.
      extras:
        $ref: "#/definitions/DatasetExtras"

  # ---------------------------------------------------------------------------
  # Kind
  # ---------------------------------------------------------------------------
  Kind:
    type: object
    required: [name, type, datasets]
    additionalProperties: false
    x-category: entity
    x-since: v1.0
    description: >
      A semantic abstraction over one or more datasets. Kinds define a
      queryable interface (dimensions, measures, metrics) and bind to
      physical datasets via column_mapping.
    properties:
      name:
        type: string
        minLength: 1
      description:
        type: string
      domain:
        $ref: "#/definitions/Domain"
      ai_context:
        $ref: "#/definitions/AiContext"
      type:
        $ref: "#/definitions/KindType"
      keys:
        $ref: "#/definitions/Keys"
      dimensions:
        type: array
        items: { $ref: "#/definitions/DimensionEntry" }
      measures:
        type: array
        items: { $ref: "#/definitions/MeasureEntry" }
      metrics:
        type: array
        items: { $ref: "#/definitions/MetricEntry" }
      datasets:
        type: array
        minItems: 1
        items: { $ref: "#/definitions/KindDatasetEntry" }
      relationships:
        type: array
        items: { $ref: "#/definitions/KindRelationship" }
        description: Join paths between kind-internal datasets (required for joinset).
      filters:
        type: array
        items: { $ref: "#/definitions/MeasureFilter" }
        description: Kind-level filters applied to all queries against this kind.
        x-since: v1.1
      extras:
        $ref: "#/definitions/KindExtras"
        description: Kind-level default extras (column_mapping, temporal, catalog, partition_defs) applied to all datasets; overridden per dataset.
        x-since: v1.3

  KindType:
    type: object
    additionalProperties: false
    minProperties: 1
    maxProperties: 1
    description: >
      Discriminated union: exactly one of grainset, unionset, or joinset.
    properties:
      grainset:
        type: ["object", "null"]
        additionalProperties: false
        description: >
          Datasets representing the same entity at different grains.
          Planner picks the optimal dataset(s) to answer the query.
      unionset:
        type: ["object", "null"]
        additionalProperties: false
        description: >
          Datasets combined via UNION ALL/DISTINCT. Missing columns are NULL-filled.
        properties:
          union_mode:
            type: string
            enum: [all, distinct]
            default: all
            description: UNION ALL (default) or UNION DISTINCT.
            x-since: v1.2
      joinset:
        type: object
        additionalProperties: false
        description: >
          Datasets joined together. Unused datasets are pruned from the join tree.
        properties:
          associativity:
            type: string
            enum: [left, right, full]
            default: left
            description: Default join type for all edges unless overridden per-relationship.

  # ---------------------------------------------------------------------------
  # Kind Dataset Entry
  # ---------------------------------------------------------------------------
  KindDatasetEntry:
    oneOf:
      - $ref: "#/definitions/KindDatasetInline"
      - $ref: "#/definitions/RefEntry"

  KindDatasetInline:
    type: object
    required: [name, extras]
    additionalProperties: false
    x-category: binding
    properties:
      name:
        type: string
        minLength: 1
        description: >
          Dataset name (semantic entity — always a concrete name).
          Glob patterns belong at the storage level (StorageConfig.paths/tables),
          not on dataset names. Legacy: "orders_*" glob on name is supported
          for catalog-driven expansion but prefer explicit names.
        x-examples: [orders_daily, orders_archive]
      description:
        type: string
      ai_context:
        $ref: "#/definitions/AiContext"
      extras:
        type: object
        additionalProperties: false
        description: >
          Per-dataset extras. column_mapping is optional when a kind-level
          column_mapping is defined in kind.extras.
        properties:
          column_mapping:
            $ref: "#/definitions/ColumnMapping"
          temporal:
            $ref: "#/definitions/TemporalConfig"
          storage:
            $ref: "#/definitions/StorageConfig"
          catalog:
            $ref: "#/definitions/CatalogConfig"

  ColumnMapping:
    type: object
    description: >
      Maps kind-level semantic names to physical column names.
      Keys are semantic names; values are strings or structured objects.
    additionalProperties:
      $ref: "#/definitions/ColumnMappingValue"

  ColumnMappingValue:
    oneOf:
      - type: string
        minLength: 1
        description: Simple mapping to a physical column name.
      - type: object
        required: [column]
        additionalProperties: false
        description: Structured mapping with optional grain override.
        properties:
          column:
            type: string
            minLength: 1
            description: Physical column name.
          grain:
            $ref: "#/definitions/TemporalGrain"
      - type: object
        required: [literal]
        additionalProperties: false
        description: Literal constant value injection.
        properties:
          literal:
            type: string
            description: The literal string value to inject.
      - type: object
        additionalProperties:
          type: string
        description: >
          Anchored sub-name mapping for composed expressions.
          Keys are anchor names used in expr; values are physical column names.
          Reserved anchor names: 'column', 'literal'.

  # ---------------------------------------------------------------------------
  # Dimensions
  # ---------------------------------------------------------------------------
  DimensionEntry:
    oneOf:
      - $ref: "#/definitions/DimensionDef"
      - $ref: "#/definitions/RefEntry"

  DimensionDef:
    type: object
    required: [name, data_type]
    additionalProperties: false
    x-category: interface
    x-since: v1.0
    properties:
      name:
        type: string
        minLength: 1
      description:
        type: string
      data_type:
        $ref: "#/definitions/DataType"
      ai_context:
        $ref: "#/definitions/AiContext"
      type:
        $ref: "#/definitions/DimensionType"
        description: >
          Dimension type. Defaults to categorical (no enum constraint) when omitted.

  DimensionType:
    type: object
    additionalProperties: false
    minProperties: 1
    maxProperties: 1
    description: >
      Discriminated union: exactly one of temporal, categorical, binary, geo, bucketed, or metadata.
    properties:
      temporal:
        type: object
        required: [grains]
        additionalProperties: false
        properties:
          grains:
            type: array
            items: { $ref: "#/definitions/TemporalGrain" }
            minItems: 1
            uniqueItems: true
      categorical:
        type: ["object", "null"]
        additionalProperties: false
        properties:
          enum:
            type: array
            items: { type: string }
            description: Optional allow-list of valid values.
      binary:
        type: object
        required: [type]
        additionalProperties: false
        properties:
          type:
            type: string
            enum: [boolean, bit, string]
      geo:
        type: object
        required: [lat, lon]
        additionalProperties: false
        properties:
          lat:
            type: string
            description: Physical column name for latitude.
          lon:
            type: string
            description: Physical column name for longitude.
      bucketed:
        type: object
        required: [column, buckets]
        additionalProperties: false
        properties:
          column:
            type: string
            description: Source numeric physical column.
          buckets:
            type: array
            minItems: 1
            items:
              type: object
              required: [name, start, end]
              additionalProperties: false
              properties:
                name: { type: string }
                start: { type: number }
                end: { type: number }
      metadata:
        type: object
        additionalProperties: false
        x-since: v1.4
        description: >
          Metadata dimension — extracts values from source metadata rather than
          physical columns. Must specify at least one of path or partition.
        properties:
          path:
            type: object
            required: [token]
            additionalProperties: false
            description: >
              Extract a raw segment from the source path (file or table).
              Tokenizer splits on '/'. Position is 0-indexed.
            properties:
              token:
                type: integer
                minimum: 0
                description: 0-indexed path segment position.
            x-examples:
              - { token: 2 }
              - { token: 5 }
          partition:
            type: object
            required: [level]
            additionalProperties: false
            description: >
              Extract the VALUE from a Hive-style key=value partition.
              Level is 1-indexed.
            properties:
              level:
                type: integer
                minimum: 1
                description: 1-indexed partition level.
            x-examples:
              - { level: 1 }
              - { level: 2 }

  # ---------------------------------------------------------------------------
  # Measures
  # ---------------------------------------------------------------------------
  MeasureEntry:
    oneOf:
      - $ref: "#/definitions/MeasureDef"
      - $ref: "#/definitions/RefEntry"

  MeasureDef:
    type: object
    required: [name, data_type]
    additionalProperties: false
    x-category: interface
    x-since: v1.0
    description: >
      A quantitative aggregation definition. Either 'agg' (declarative) or
      'expr' (legacy with embedded aggregation) must be specified.
      When 'agg' is set, 'expr' is optional and must be horizontal-only
      (no aggregation functions). When 'agg' is absent, 'expr' is required
      and must contain the aggregation function (e.g. "SUM(amount)").
    properties:
      name:
        type: string
        minLength: 1
        x-examples: [revenue, order_count, avg_price]
      description:
        type: string
      data_type:
        $ref: "#/definitions/DataType"
      ai_context:
        $ref: "#/definitions/AiContext"
      agg:
        $ref: "#/definitions/AggregationType"
        description: >
          Declarative aggregation function. When specified, expr (if any)
          is treated as a horizontal transformation applied before aggregation.
          If no expr is provided, the column is resolved from column_mapping
          by the measure's name.
        x-since: v1.4
        x-examples: [sum, avg, count, count_distinct, min, max]
      expr:
        type: string
        minLength: 1
        description: >
          DSL expression. When 'agg' is specified, this is horizontal-only
          (no aggregation functions allowed). When 'agg' is absent (legacy),
          must contain the aggregation: SUM, AVG, COUNT, COUNT_DISTINCT,
          MIN, MAX. Raw SQL strings are rejected.
        x-examples:
          - "SUM(amount)"
          - "amount + price"
          - "amount"
      additivity:
        $ref: "#/definitions/Additivity"
      constraints:
        $ref: "#/definitions/Constraints"
      filters:
        type: array
        items: { $ref: "#/definitions/MeasureFilter" }
        description: >
          Per-measure predicates. Applied via conditional aggregation
          (CASE WHEN filter THEN expr ELSE NULL END) when multiple measures
          share a dataset.

  # ---------------------------------------------------------------------------
  # Metrics
  # ---------------------------------------------------------------------------
  MetricEntry:
    oneOf:
      - $ref: "#/definitions/MetricDef"
      - $ref: "#/definitions/RefEntry"

  MetricDef:
    type: object
    required: [name, data_type, expr]
    additionalProperties: false
    x-category: interface
    x-since: v1.0
    description: >
      A derived computation referencing measures or other metrics.
      Chaining depth limit: 3 levels in v1 (metric -> metric -> measure).
      When 'agg' is specified, creates a two-stage aggregation plan.
    properties:
      name:
        type: string
        minLength: 1
        x-examples: [avg_order_value, profit_margin, conversion_rate]
      description:
        type: string
      data_type:
        $ref: "#/definitions/DataType"
      ai_context:
        $ref: "#/definitions/AiContext"
      agg:
        $ref: "#/definitions/AggregationType"
        description: >
          Optional two-stage aggregation. Inner grain = all request dimensions,
          outer grain = remaining dimensions after this metric's agg consumes
          inner groups. Metrics can only reference existing semantic elements
          (measures, dimensions, keys).
        x-since: v1.4
      expr:
        type: string
        minLength: 1
        description: >
          DSL expression referencing measure names or other metric names.
        x-examples:
          - "revenue / order_count"
          - "profit / revenue"
          - "(revenue - cost) / revenue"
      additivity:
        $ref: "#/definitions/Additivity"
      constraints:
        $ref: "#/definitions/Constraints"
      filters:
        type: array
        items: { $ref: "#/definitions/MeasureFilter" }

  # ---------------------------------------------------------------------------
  # Aggregation
  # ---------------------------------------------------------------------------
  AggregationType:
    type: string
    enum: [sum, avg, count, count_distinct, min, max]
    x-category: interface
    x-since: v1.4
    description: >
      Declarative aggregation function for measures and metrics.
      Replaces embedding aggregation in expr strings.

  # ---------------------------------------------------------------------------
  # Filters
  # ---------------------------------------------------------------------------
  DatasetFilter:
    type: object
    required: [name, expr]
    additionalProperties: false
    x-category: predicate
    description: >
      Dataset-level base WHERE predicate. Applied before measure/user filters.
    properties:
      name:
        type: string
        minLength: 1
      expr:
        type: string
        minLength: 1
        description: DSL filter expression.
        x-examples:
          - "status != 'cancelled'"
          - "is_deleted = false"

  MeasureFilter:
    type: object
    required: [name, expr]
    additionalProperties: false
    x-category: predicate
    description: >
      Measure/metric/kind-level filter predicate.
    properties:
      name:
        type: string
        minLength: 1
      expr:
        type: string
        minLength: 1
        description: DSL filter expression.
        x-examples:
          - "status != 'cancelled'"
          - "amount > 0"

  # ---------------------------------------------------------------------------
  # Additivity
  # ---------------------------------------------------------------------------
  Additivity:
    type: object
    required: [type]
    additionalProperties: false
    x-category: property
    description: >
      Informs the planner how to handle re-aggregation across grains.
    properties:
      type:
        type: object
        additionalProperties: false
        minProperties: 1
        maxProperties: 1
        properties:
          full:
            type: ["object", "null"]
            additionalProperties: false
            description: Fully additive. SUM of SUMs is correct.
          semi:
            type: object
            required: [non_additive_dimensions]
            additionalProperties: false
            description: >
              Blocked on specific dimensions. Planner injects a
              pre-resolution sub-query to collapse the non-additive
              dimension before aggregation.
            properties:
              non_additive_dimensions:
                type: array
                items: { type: string }
                minItems: 1
              resolution_strategy:
                type: string
                enum: [latest, earliest, max, min]
                default: latest
          non:
            type: ["object", "null"]
            additionalProperties: false
            description: >
              Never re-aggregatable. Dataset must be at exact source grain.

  # ---------------------------------------------------------------------------
  # Constraints
  # ---------------------------------------------------------------------------
  Constraints:
    type: object
    additionalProperties: false
    x-category: property
    description: >
      Evaluated BEFORE additivity. Violation rejects the query.
    properties:
      dimensions:
        type: object
        additionalProperties: false
        properties:
          one_of:
            type: array
            items: { type: string }
            description: At least one must be in GROUP BY or WHERE.
          none_of:
            type: array
            items: { type: string }
            description: None may be in the query scope.
          all:
            type: array
            items: { type: string }
            description: All must be in GROUP BY or WHERE.
      aggregations:
        type: object
        additionalProperties: false
        properties:
          allowed:
            type: array
            items: { type: string }
            description: Only these aggregation functions are valid.
          prohibited:
            type: array
            items: { type: string }
            description: These aggregation functions are never valid.

  # ---------------------------------------------------------------------------
  # Relationships
  # ---------------------------------------------------------------------------
  Relationship:
    type: object
    required: [name, from, to, type, columns, cardinality]
    additionalProperties: false
    x-category: binding
    x-since: v1.0
    description: >
      Join path between datasets and/or kinds. Structurally identical at all
      scopes (top-level and kind-level). Scope determines namespace:
      top-level = cross-entity joins, kind-level = intra-kind joins (joinset).
    properties:
      name:
        type: string
        minLength: 1
      from:
        type: string
        description: Source dataset or kind name.
      to:
        type: string
        description: Target dataset or kind name.
      type:
        $ref: "#/definitions/JoinType"
      columns:
        type: array
        minItems: 1
        items:
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from: { type: string }
            to: { type: string }
      cardinality:
        $ref: "#/definitions/Cardinality"

  # KindRelationship is structurally identical to Relationship.
  # Scope determines semantics: top-level = cross-entity, kind-level = intra-kind.
  KindRelationship:
    $ref: "#/definitions/Relationship"

  # ---------------------------------------------------------------------------
  # Keys
  # ---------------------------------------------------------------------------
  Keys:
    type: object
    additionalProperties: false
    x-category: property
    properties:
      primary:
        type: array
        items: { type: string }
        minItems: 1
      unique:
        type: array
        items:
          type: object
          required: [columns]
          additionalProperties: false
          properties:
            columns:
              type: array
              items: { type: string }
              minItems: 1
      foreign:
        type: array
        items:
          type: object
          required: [columns, reference, cardinality]
          additionalProperties: false
          properties:
            columns:
              type: array
              items: { type: string }
              minItems: 1
            reference:
              type: string
            cardinality:
              $ref: "#/definitions/Cardinality"

  # ---------------------------------------------------------------------------
  # Extras (storage, temporal, catalog)
  # ---------------------------------------------------------------------------
  KindExtras:
    type: object
    additionalProperties: false
    x-category: binding
    x-since: v1.3
    description: >
      Kind-level default extras applied to all datasets in this kind.
      Per-dataset extras override these defaults field by field.
      Structurally equivalent to DatasetExtras — scope disambiguates semantics.
    properties:
      column_mapping:
        $ref: "#/definitions/ColumnMapping"
      temporal:
        $ref: "#/definitions/TemporalConfig"
      partition_defs:
        type: array
        items: { $ref: "#/definitions/PartitionDef" }
      catalog:
        $ref: "#/definitions/CatalogConfig"

  DatasetExtras:
    type: object
    additionalProperties: false
    x-category: binding
    description: >
      Standalone dataset extras. Structurally equivalent to KindExtras —
      scope disambiguates semantics.
    properties:
      catalog:
        $ref: "#/definitions/CatalogConfig"
      temporal:
        $ref: "#/definitions/TemporalConfig"
      storage:
        $ref: "#/definitions/StorageConfig"

  CatalogConfig:
    type: object
    required: [type]
    additionalProperties: false
    properties:
      type:
        type: string
        description: Catalog provider type (per-dataset type hint).
        x-examples: [iceberg, polaris, hive, glue]

  CatalogConnectionConfig:
    type: object
    required: [type, url]
    additionalProperties: false
    x-category: binding
    x-since: v1.5
    description: >
      Top-level catalog connection configuration. Defines how to connect to
      the catalog provider for glob expansion and schema snapshots.
      Values may use ${ENV_VAR} syntax for sensitive fields.
    properties:
      type:
        type: string
        minLength: 1
        description: Catalog provider type.
        x-examples: [iceberg_rest]
      url:
        type: string
        minLength: 1
        description: Catalog endpoint URL.
        x-examples: [https://polaris.example.com/api/catalog]
      warehouse:
        type: string
        description: Catalog warehouse identifier.
        x-examples: [my_warehouse]
      prefix:
        type: string
        description: Optional path prefix for multi-tenant catalogs.
      auth:
        $ref: "#/definitions/CatalogAuthConfig"

  CatalogAuthConfig:
    x-category: binding
    x-since: v1.5
    description: >
      Authentication configuration for catalog connections. Tagged union
      discriminated by the 'method' field.
    oneOf:
      - $ref: "#/definitions/CatalogAuthNone"
      - $ref: "#/definitions/CatalogAuthBearer"
      - $ref: "#/definitions/CatalogAuthOauth2"
      - $ref: "#/definitions/CatalogAuthPolaris"

  CatalogAuthNone:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method:
        type: string
        enum: [none]

  CatalogAuthBearer:
    type: object
    required: [method, token]
    additionalProperties: false
    properties:
      method:
        type: string
        enum: [bearer]
      token:
        type: string
        minLength: 1
        description: Bearer token. Use ${ENV_VAR} for secrets.
        x-examples: ["${CATALOG_TOKEN}"]

  CatalogAuthOauth2:
    type: object
    required: [method, token_url, client_id, client_secret]
    additionalProperties: false
    properties:
      method:
        type: string
        enum: [oauth2]
      token_url:
        type: string
        minLength: 1
        description: OAuth2 token endpoint URL.
      client_id:
        type: string
        minLength: 1
        description: OAuth2 client ID. Use ${ENV_VAR} for secrets.
      client_secret:
        type: string
        minLength: 1
        description: OAuth2 client secret. Use ${ENV_VAR} for secrets.
      scope:
        type: string
        description: OAuth2 scope.
        x-examples: ["PRINCIPAL_ROLE:ALL"]

  CatalogAuthPolaris:
    type: object
    required: [method, secret_arn]
    additionalProperties: false
    description: >
      Polaris authentication via AWS Secrets Manager. Fetches client_id/client_secret
      from the secret, performs OAuth2 against the Polaris token endpoint.
      Uses AWS default credential chain (SSO, IAM roles, env vars) unless
      explicit aws_access_key_id/aws_secret_access_key are provided.
    properties:
      method:
        type: string
        enum: [polaris]
      secret_arn:
        type: string
        minLength: 1
        description: AWS Secrets Manager ARN containing Polaris credentials.
        x-examples: ["arn:aws:secretsmanager:eu-west-1:123456:secret/polaris-creds"]
      region:
        type: string
        description: AWS region for Secrets Manager.
        x-examples: [eu-west-1, us-east-1]
      realm:
        type: string
        description: Polaris realm (injected as Polaris-Realm header).
        x-examples: [POLARIS]
      scope:
        type: string
        description: OAuth2 scope for Polaris token request.
        x-examples: ["PRINCIPAL_ROLE:ALL"]
      aws_access_key_id:
        type: string
        description: >
          Explicit AWS access key ID for Secrets Manager access.
          If omitted, uses the default AWS credential chain. Use ${ENV_VAR}.
      aws_secret_access_key:
        type: string
        description: >
          Explicit AWS secret access key for Secrets Manager access.
          If omitted, uses the default AWS credential chain. Use ${ENV_VAR}.

  TemporalConfig:
    type: object
    required: [type]
    additionalProperties: false
    description: >
      Temporal historization pattern. Orthogonal to grain resolution
      (which lives on dimension.temporal.grains). Both can coexist.
    properties:
      type:
        type: object
        additionalProperties: false
        minProperties: 1
        maxProperties: 1
        properties:
          timeseries:
            type: object
            required: [occurred_at]
            additionalProperties: false
            description: Event data with an event timestamp column.
            properties:
              occurred_at:
                type: string
                description: Physical column name for event timestamp.
          snapshot:
            type: object
            required: [snapshotted_at]
            additionalProperties: false
            description: >
              Periodic loads identified by a snapshot column.
              Planner injects: col = (SELECT MAX(col) FROM same_table).
            properties:
              snapshotted_at:
                type: string
                description: Physical column name for snapshot timestamp.
          scd:
            $ref: "#/definitions/ScdConfig"

  ScdConfig:
    type: object
    additionalProperties: false
    minProperties: 1
    maxProperties: 1
    description: Slowly Changing Dimension strategy.
    properties:
      type_1:
        type: ["object", "null"]
        additionalProperties: false
        description: Always overwrite. No temporal filter needed.
      type_2:
        type: object
        required: [valid_from, valid_to]
        additionalProperties: false
        description: >
          Versioned rows. Planner injects: valid_to IS NULL.
        properties:
          valid_from: { type: string }
          valid_to: { type: string }
      type_3:
        type: ["object", "null"]
        additionalProperties: false
        description: Current + previous value in same row.
      type_4:
        type: ["object", "null"]
        additionalProperties: false
        description: History in a separate table.
      type_5:
        type: object
        required: [valid_from, valid_to]
        additionalProperties: false
        description: Type 1 + Type 4 hybrid.
        properties:
          valid_from: { type: string }
          valid_to: { type: string }
      type_6:
        type: object
        required: [valid_from, valid_to]
        additionalProperties: false
        description: Type 1 + Type 2 + Type 3 hybrid.
        properties:
          valid_from: { type: string }
          valid_to: { type: string }

  StorageConfig:
    type: object
    additionalProperties: false
    description: >
      Physical storage location. Supports singular (path/table) or plural (paths/tables)
      references. Paths and tables are mutually exclusive — cannot mix file and catalog
      sources in the same dataset. Multiple sources imply UNION ALL semantics.
    properties:
      path:
        type: string
        minLength: 1
        description: Single file or object store path (backward compat).
        x-examples: [warehouse.orders, lakehouse.marketing.events]
      table:
        type: string
        minLength: 1
        description: Single catalog table reference (backward compat).
        x-examples: [schema_name.orders_monthly, main.public.events]
      paths:
        type: array
        items: { type: string, minLength: 1 }
        description: Multiple file/object store paths. May contain glob patterns.
        x-examples: [["s3://bucket/orders_*.parquet", "s3://bucket/archive/orders_*.parquet"]]
        x-since: v1.3
      tables:
        type: array
        items: { type: string, minLength: 1 }
        description: Multiple catalog table references. May contain wildcards.
        x-examples: [["catalog.schema.orders_*"]]
        x-since: v1.3
      partition_def:
        $ref: "#/definitions/PartitionDef"

  PartitionDef:
    type: object
    required: [type]
    additionalProperties: false
    properties:
      type:
        type: object
        additionalProperties: false
        minProperties: 1
        maxProperties: 1
        properties:
          range:
            type: object
            required: [column, start, end]
            additionalProperties: false
            properties:
              column: { type: string }
              start: { type: string }
              end: { type: string }
          list:
            type: object
            required: [column, values]
            additionalProperties: false
            properties:
              column: { type: string }
              values:
                type: array
                items: { type: string }
                minItems: 1

  # ---------------------------------------------------------------------------
  # AI Context
  # ---------------------------------------------------------------------------
  AiContext:
    type: object
    additionalProperties: false
    x-category: metadata
    x-since: v1.1
    description: >
      AI-facing metadata for query understanding, disambiguation,
      and semantic search. All fields optional.
    properties:
      synonyms:
        type: array
        items: { type: string }
        description: Alternative names users may use to refer to this entity.
        x-examples: [["order date", "purchase date", "transaction date"]]
      query_patterns:
        type: array
        items: { type: string }
        description: Example natural-language queries for few-shot AI resolution.
        x-examples: [["What was our total revenue?", "How much did we sell?"]]
      value_examples:
        type: array
        items: { type: string }
        description: Representative sample values (format/cardinality hints).
        x-examples: [["2024-01-15", "electronics", "1234.56"]]
      semantic_tags:
        type: array
        items: { type: string }
        description: Free-form labels for embedding-based retrieval.
        x-examples: [["kpi", "financial", "outcome"]]
      aggregation_intent:
        type: string
        enum: [sum, avg, count, count_distinct, max, min]
        description: >
          Typical aggregation when a user asks for this measure.
          Descriptive only; planner uses the expr field.
        x-since: v1.2
      unit:
        type: string
        description: Unit or currency of the measure/dimension.
        x-examples: [USD, seconds, users]
        x-since: v1.2
      not:
        type: array
        items: { type: string }
        description: What this field is NOT (prevents AI misresolution).
        x-examples: [["refunds", "returns"]]
        x-since: v1.2
      entity:
        type: string
        description: The business entity this field describes.
        x-examples: [order, customer, campaign]
        x-since: v1.2
      importance:
        type: string
        enum: [high, medium, low]
        default: medium
        description: How likely this field is to be requested.
        x-since: v1.2
      description:
        type: string
        description: Business-facing description (for dataset/kind-level ai_context).
        x-since: v1.2
      authoritative_for:
        type: array
        items: { type: string }
        description: What this entity is the source of truth for.
        x-since: v1.2
      not_for:
        type: array
        items: { type: string }
        description: What this entity should NOT be used for.
        x-since: v1.2

  # ---------------------------------------------------------------------------
  # Shared enums and references
  # ---------------------------------------------------------------------------
  Tags:
    type: object
    additionalProperties: false
    x-category: metadata
    description: Flat tag object for tooling and governance.
    properties:
      source_type:
        type: string
        x-examples: [fact, dimension, staging, bigquery, snowflake]
      visibility:
        type: string
        enum: [public, private]

  RefEntry:
    type: object
    required: [ref]
    additionalProperties: false
    description: Reference to a top-level reusable definition.
    properties:
      ref:
        type: string
        minLength: 1

  DataType:
    type: string
    description: >
      YAML-facing data type name. Parsed by semstrait-model into typed enum.
    x-examples:
      [
        i8,
        i16,
        i32,
        i64,
        f32,
        f64,
        bool,
        string,
        date,
        timestamp,
        "decimal(18, 2)",
      ]

  Domain:
    description: >
      Semantic data domain. Dot-delimited hierarchy for AI routing
      and planner branch pruning. Scalar or array.
    oneOf:
      - type: string
        minLength: 1
      - type: array
        items: { type: string, minLength: 1 }
        minItems: 1
    x-examples:
      - financial.transactions
      - [marketing.paid_social.facebook_ads, marketing.paid_social.google_ads]

  TemporalGrain:
    type: string
    enum: [minute, hour, day, week, month, quarter, year]

  JoinType:
    type: string
    enum: [inner, left, right, full]

  Cardinality:
    type: string
    enum: [one_to_one, one_to_many, many_to_one, many_to_many]
