  # ===========================================================================
  # JOINSETS
  # ===========================================================================
  # Datasets joined together to construct one entity.
  # Join pruning: datasets not needed for the query are not joined.
  #
  # RESOLUTION ALGORITHM:
  #   Step 1  CONSTRAINTS CHECK
  #   Step 2  IDENTIFY NEEDED DATASETS — via column_mapping lookup per requested field
  #   Step 3  ANCHOR — always included; inferred as in-degree=0 node in relationship graph
  #   Step 4  BUILD JOIN TREE — BFS from anchor; include all intermediate datasets on path
  #   Step 5  PRUNE — exclude unreachable datasets from join tree
  #   Step 6  TEMPORAL FILTERS — inject SCD/snapshot predicates per joined dataset
  #   Step 7  GENERATE SQL — SELECT, GROUP BY, aggregations, all filter layers
  joinsets: # optional, array
    - name: string # required, unique within semantic_model
      description: string # optional
      associativity: left | right | full # default join type for all edges unless overridden
      ai_context: # optional
        synonyms:
          - string
        query_patterns:
          - string
        value_examples:
          - string
        semantic_tags:
