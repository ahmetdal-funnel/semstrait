        - ref: string

      datasets: # required, array, at least one entry
        - name: string
          description: string
          ai_context:
            synonyms:
              - string
          extras:
            storage:
                format: string
                paths:
                  - string
                tables:
                  - string
            catalog:
              type: string
            column_mapping:
            temporal:
        - ref: string

      extras:
            column_mapping:
            temporal:
              type:
                timeseries:
                  occurred_at: string
                snapshot:
                  snapshotted_at: string
                scd:
                  type_1:
                  type_2:
                    valid_from: string
                    valid_to: string
                  type_3:
                  type_4:
                  type_5:
                    valid_from: string
                    valid_to: string
