      # NESTED KINDS (v1.4)
      # -----------------------------------------------------------------------
      # Joinset can contain nested grainsets and unionsets (NOT joinsets).
      # Each nested kind is flattened to a top-level entry during parse.
      # Max nesting depth: 2 levels.
      # See NESTING MATRIX above for all valid combinations.
      grainsets: # optional, array of nested grainset definitions or refs
        - name: string
          # ... (same structure as top-level grainset)
        - ref: string

      unionsets: # optional, array of nested unionset definitions or refs
        - name: string
          # ... (same structure as top-level unionset)
        - ref: string

      relationships: # REQUIRED for joinset
        - name: string
          from: string
          to: string
          type: inner | left | right | full # overrides joinset.associativity for this edge
          columns:
            - from: string
              to: string
          cardinality: one_to_one | one_to_many | many_to_one | many_to_many

  # ===========================================================================
  # TOP-LEVEL RELATIONSHIPS
  # ===========================================================================
  # Joins between top-level datasets and/or kinds.
  # Planner uses these when a query spans multiple top-level entities.
  # Kind-internal joins use kind.relationships[], NOT this block.
  #
  # Complementary with keys.foreign:
  #   keys.foreign = semantic role
  #   relationships = physical join path (takes precedence)
  relationships: # optional, array
    - name: string # required, unique within semantic_model
      from: string # dataset or kind name
      to: string # dataset or kind name
      type: inner | left | right | full # required
      columns: # required, at least one pair
        - from: string # semantic column name on `from` side
          to: string # semantic column name on `to` side
      cardinality: one_to_one | one_to_many | many_to_one | many_to_many # required
      # NOTE: junction (many-to-many bridge table) is deferred to v2.

  # ===========================================================================
  # TOP-LEVEL REUSABLE DEFINITIONS
  # ===========================================================================
  # Define once; reference via `ref: name` in any dimensions[]/measures[]/metrics[].
  # No local overrides at the ref site — for variations, define a separate inline entry.
  # These definitions CANNOT themselves contain `ref:` entries (no transitive refs).

  dimensions: # optional, array; same structure as dataset.dimensions
    - name: string
      description: string
      data_type: string
      expr: string | ExprBlock # optional; computed dimension expression
      ai_context:
        synonyms:
