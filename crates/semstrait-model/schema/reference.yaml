  measures: # optional, array; same structure as dataset.measures
    - name: string
      description: string
      data_type: string
      ai_context:
        synonyms:
          - string
      agg: sum | avg | count | count_distinct | min | max # optional
      expr: dsl
      additivity:
        type:
          full:
          semi:
            non_additive_dimensions:
              - string
            resolution_strategy: latest | earliest | max | min
          non:
      constraints:
        dimensions:
          one_of:
            - string
          none_of:
            - string
          all:
            - string
        aggregations:
          allowed:
            - string
          prohibited:
            - string
      filters:
        - name: string
          expr: dsl

  metrics: # optional, array; same structure as dataset.metrics
    - name: string
      description: string
      data_type: string
      ai_context:
        synonyms:
          - string
      expr: dsl
      additivity:
        type:
          full:
          semi:
            non_additive_dimensions:
              - string
            resolution_strategy: latest | earliest | max | min
          non:
      constraints:
        dimensions:
          one_of:
            - string
          none_of:
            - string
          all:
            - string
        aggregations:
          allowed:
            - string
          prohibited:
            - string
      filters:
        - name: string
          expr: dsl

# =============================================================================
# EXPRESSION DSL REFERENCE
# =============================================================================
#
# Expressions in semstrait YAML use ExprSource — either:
#   (a) Inline string:     expr: "UPPER(region)"
#   (b) Declarative block: expr: { upper: { column: region } }
#
# Declarative blocks (ExprBlock) use single-key YAML maps. Each key maps 1:1
# to an Expr variant in semstrait-core. All 60 keys are listed below.
#
# Known limitation (DL-049): Declarative blocks work in top-level datasets but
# NOT inside grainsets/unionsets/joinsets (serde_yaml 0.9 nested untagged enum).
# Use inline strings for kind-level computed dimensions.
#
# Authoritative source: crates/semstrait-model/src/expr_block.rs
# =============================================================================

# ---------------------------------------------------------------------------
# LEAF NODES
# ---------------------------------------------------------------------------
#
# column: <name>
#   Explicit column reference (resolved to physical via column_mapping).
#   Example:
#     expr: { column: amount }
#
# lit: <value>
#   Explicit literal value. String, integer, float, boolean, or null.
#   Examples:
#     expr: {lit: 42}
#     expr: {lit: "active"}
#     expr: {lit: true}
#     expr: {lit: 3.14}

# ---------------------------------------------------------------------------
# ARITHMETIC (BinaryOp)
# ---------------------------------------------------------------------------
#
# All accept TwoArgs: array form [left, right] or map form {left:, right:}
#
# add: [left, right]           →  left + right
# subtract: [left, right]      →  left - right
# multiply: [left, right]      →  left * right
# divide: [left, right]        →  left / right
# safe_divide: [left, right]   →  CASE WHEN right = 0 THEN NULL ELSE left / right END
#
# Examples:
#   expr:
#     add: [price, tax]
#   expr:
#     safe_divide:
#       left: revenue
#       right: clicks

# ---------------------------------------------------------------------------
# COMPARISON (BinaryOp)
# ---------------------------------------------------------------------------
#
# All accept TwoArgs.
#
# eq: [left, right]       →  left = right
# not_eq: [left, right]   →  left != right
# lt: [left, right]       →  left < right
# gt: [left, right]       →  left > right
# lte: [left, right]      →  left <= right
# gte: [left, right]      →  left >= right
#
# Example:
#   expr:
#     eq: [status, {lit: "active"}]

# ---------------------------------------------------------------------------
# LOGICAL
# ---------------------------------------------------------------------------
#
# and: [left, right]     →  left AND right    (TwoArgs)
# or: [left, right]      →  left OR right     (TwoArgs)
# not: <expr>            →  NOT expr           (single ExprBlock)
# negate: <expr>         →  -expr              (single ExprBlock)
#
# Examples:
#   expr:
#     and:
#       - {gt: [amount, 0]}
#       - {eq: [status, {lit: "active"}]}
#   expr:
#     not: {is_null: name}

# ---------------------------------------------------------------------------
# CONDITIONAL
# ---------------------------------------------------------------------------
#
# case:
#   when:                              →  CASE WHEN ... THEN ... ELSE ... END
#     - condition: <expr>
#       then: <expr>
#   else: <expr>                       # optional
#
# coalesce: [<expr>, ...]             →  COALESCE(expr1, expr2, ...)
#
# nullif: [col, null_value]             →  NULLIF(col, null_value)
# nullif:
#   col: <expr>
#   null_expr: <expr>
#
# if: [condition, then, else]         →  desugars to CASE WHEN condition THEN then ELSE else END
#
# greatest: [<expr>, ...]            →  GREATEST(expr1, expr2, ...)
# least: [<expr>, ...]               →  LEAST(expr1, expr2, ...)
#
# Examples:
#   expr:
#     case:
#       when:
#         - condition: {in: [region, {lit: "US"}, {lit: "EU"}]}
#           then: {lit: "Tier 1"}
#         - condition: {eq: [region, {lit: "APAC"}]}
#           then: {lit: "Tier 2"}
#       else: {lit: "Tier 3"}
#
#   expr:
#     coalesce: [preferred_name, legal_name, {lit: "Unknown"}]
#
#   expr:
#     if: [{eq: [x, 0]}, {lit: "zero"}, {lit: "nonzero"}]

# ---------------------------------------------------------------------------
# PREDICATES
# ---------------------------------------------------------------------------
#
# in: [col, val1, val2, ...]            →  col IN (val1, val2, ...)
# in:
#   col: <expr>
#   list: [<expr>, ...]
#
# not_in: [col, val1, val2, ...]       →  col NOT IN (val1, val2, ...)
# not_in:
#   col: <expr>
#   list: [<expr>, ...]
#
# between: [col, low, high]            →  col BETWEEN low AND high
# between:
#   col: <expr>
#   low: <expr>
#   high: <expr>
#
# like: [col, pattern]                 →  col LIKE pattern
# like:
#   col: <expr>
#   pattern: <expr>
#
# ilike: [col, pattern]                →  col ILIKE pattern (case-insensitive)
# ilike:
#   col: <expr>
#   pattern: <expr>
#
# is_null: <expr>                     →  expr IS NULL
# is_not_null: <expr>                 →  expr IS NOT NULL
#
# Examples:
#   expr:
#     in: [country, {lit: "US"}, {lit: "GB"}, {lit: "DE"}]
#
#   expr:
#     between: [age, 18, 65]
#
#   expr:
#     ilike: [campaign, {lit: "uk_%"}]

# ---------------------------------------------------------------------------
# PATTERN MATCHING
# ---------------------------------------------------------------------------
#
# regexp_match: [col, pattern]          →  REGEXP_LIKE / ~ (dialect-specific)
# regexp_match:
#   col: <expr>
#   pattern: <expr>
#   full_match: bool                   # optional, default: false
#
# regexp_extract: [col, pattern, group?]  →  REGEXP_EXTRACT(col, pattern, group)
# regexp_extract:
#   col: <expr>
#   pattern: <expr>
#   group: int                         # optional, default: 0 (full match)
#
# Examples:
#   expr:
#     regexp_match: [email, {lit: "@example\\.com$"}]
#
#   expr:
#     regexp_extract: [campaign, {lit: "^([A-Z]{2})_"}, 1]

# ---------------------------------------------------------------------------
# STRING FUNCTIONS
# ---------------------------------------------------------------------------
#
# Single-argument (accept one ExprBlock):
#   upper: <expr>           →  UPPER(expr)
#   lower: <expr>           →  LOWER(expr)
#   trim: <expr>            →  TRIM(expr)
#   ltrim: <expr>           →  LTRIM(expr)
#   rtrim: <expr>           →  RTRIM(expr)
#   length: <expr>          →  LENGTH(expr)
#
# Multi-argument:
#   concat: [<expr>, ...]   →  CONCAT(expr1, expr2, ...)
#
#   replace:
#     col: <expr>           →  REPLACE(col, old, new)
#     old: <expr>
#     new: <expr>
#
#   substr:
#     col: <expr>           →  SUBSTRING(col, start[, length])
#     start: int
#     length: int           # optional
#
#   left:
#     col: <expr>           →  LEFT(col, length)
#     length: int
#
#   right:
#     col: <expr>           →  RIGHT(col, length)
#     length: int
#
#   lpad:
#     col: <expr>           →  LPAD(col, length, fill)
#     length: int
#     fill: string          # optional, default: " "
#
#   rpad:
#     col: <expr>           →  RPAD(col, length, fill)
#     length: int
#     fill: string          # optional, default: " "
#
# Examples:
#   expr: {upper: region}
#   expr:
#     concat: [first_name, {lit: " "}, last_name]
#   expr:
#     replace:
#       col: phone
#       old: {lit: "-"}
#       new: {lit: ""}
#   expr:
#     substr:
#       col: code
#       start: 1
#       length: 3

# ---------------------------------------------------------------------------
# MATH FUNCTIONS
# ---------------------------------------------------------------------------
#
# Single-argument:
#   abs: <expr>             →  ABS(expr)
#   ceil: <expr>            →  CEIL(expr)
#   floor: <expr>           →  FLOOR(expr)
#   sqrt: <expr>            →  SQRT(expr)
#
# Multi-argument:
#   round:
#     col: <expr>           →  ROUND(col, scale)
#     scale: int            # optional, default: 0
#
#   power:
#     base: <expr>          →  POWER(base, exponent)
#     exponent: <expr>
#
#   mod: [left, right]      →  MOD(left, right)   (TwoArgs)
#
# Examples:
#   expr:
#     round:
#       col: price
#       scale: 2
#   expr:
#     power:
#       base: value
#       exponent: {lit: 2}

# ---------------------------------------------------------------------------
# DATE FUNCTIONS
# ---------------------------------------------------------------------------
#
# date_trunc:
#   grain: string           →  DATE_TRUNC('grain', col)
#   col: <expr>
#   Valid grains: minute, hour, day, week, month, quarter, year
#
# current_date: {}          →  CURRENT_DATE (nullary, empty block)
# current_timestamp: {}     →  CURRENT_TIMESTAMP (nullary, empty block)
#
# date_add:
#   col: <expr>             →  DATE_ADD(col, days)
#   days: int
#
# date_diff:
#   start: <expr>           →  DATEDIFF(end, start)
#   end: <expr>
#
# extract:
#   part: string            →  EXTRACT(part FROM col)
#   col: <expr>
#   Valid parts: year, quarter, month, week, day, hour, minute, second, dow, doy
#
# Examples:
#   expr:
#     date_trunc:
#       grain: month
#       col: order_date
#   expr:
#     extract:
#       part: year
#       col: created_at
#   expr:
#     date_diff:
#       start: start_date
#       end: end_date

# ---------------------------------------------------------------------------
# TYPE CONVERSION
# ---------------------------------------------------------------------------
#
# cast:
#   col: <expr>             →  CAST(col AS to)
#   to: string              # target type name
#
# Example:
#   expr:
#     cast:
#       col: amount
#       to: string

# ---------------------------------------------------------------------------
# GUARD (sugar)
# ---------------------------------------------------------------------------
#
# guard:
#   condition: <expr>       →  resolved to CASE WHEN condition THEN col ELSE NULL END
#   col: <expr>
#
# Conditional measure/metric activation. Resolved during planning.
#
# Example:
#   expr:
#     guard:
#       condition: {eq: [category, {lit: "electronics"}]}
#       col: amount

# ---------------------------------------------------------------------------
# FUNCTION REGISTRY (28 ANSI SQL functions, validated at compile time)
# ---------------------------------------------------------------------------
#
# String (13):  UPPER, LOWER, TRIM, LTRIM, RTRIM, LENGTH, CONCAT,
#               REPLACE, SUBSTRING, LEFT, RIGHT, LPAD, RPAD
# Math (7):     ABS, CEIL, FLOOR, ROUND, POWER, SQRT, MOD
# Date (5):     CURRENT_DATE, CURRENT_TIMESTAMP, DATE_ADD, DATEDIFF, EXTRACT
# Conditional (3): GREATEST, LEAST, CAST
#
# Arity-checked during manifest compilation. Unknown functions pass
# validation with a warning (extensibility for engine-specific functions).
