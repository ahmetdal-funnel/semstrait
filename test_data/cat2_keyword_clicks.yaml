# Category 2: Google Ads Keyword Click Attribution — Standalone Dataset (v2)
# Single dataset with multi-path storage (6 accounts, identical schema)
#
# API-verified against Google Ads API v20:
#   click_id = gclid (Google Click Identifier) — globally unique per click
#   keyword = criteria.keyword.text from KeywordView
#   campaign = campaign.name, campaignID = campaign.id
#   campaign_start_date = campaign.start_date (YYYY-MM-DD)
#   campaign_end_date = campaign.end_date (YYYY-MM-DD, default 2037-12-30)
#   accountId = customer.id (10-digit, no dashes)
#
# No measures — click-level attribution rows, not aggregates.
# Primary key: click_id (gclid) is globally unique.
# Metadata dimension: funnel_account_id from path token 2.

semantic_model:
  name: alpinestars_keyword_clicks

  dimensions:
    - name: date
      description: "Reporting date"
      data_type: date
      type:
        temporal:
          grains: [day, week, month, quarter, year]

    - name: campaign_name
      description: "Campaign name"
      data_type: string
      ai_context:
        synonyms: [campaign, ad campaign]

  datasets:
    - name: adwords_keyword_clicks
      description: "Google Ads keyword-level click attribution — maps gclid to keywords and campaigns across 6 accounts"
      ai_context: "Use for keyword-level attribution. Contains click_id (gclid) for cross-system join to GA4 or Shopify. No cost or impression data — click-level rows only."
      keys:
        primary: [click_id]
      extras:
        storage:
          paths:
            - "fs1henp3k8p1hqo/adwords/2bfdf5a9-97f2-4fe0-aeba-b6bcde2f9692/"
            - "fs1henp3k8p1hqo/adwords/566e88d4-15c2-480e-9c00-a5251610ef23/"
            - "fs1henp3k8p1hqo/adwords/728b558f-ccd5-4615-a345-de5949793f2b/"
            - "fs1henp3k8p1hqo/adwords/8f68ac10-7677-4816-93e3-033ddec451e6/"
            - "fs1henp3k8p1hqo/adwords/e1c1188a-8be9-4aa1-bc41-91671e3a7c5a/"
            - "fs1henp3k8p1hqo/adwords/e5461b63-cc97-4ad3-8bd3-d25174c3a2b3/"
        column_mapping:
          date: date
          click_id: adwords-click_id
          keyword: adwords-keyword
          campaign_name: adwords-campaign
          campaign_id: adwords-campaignID
          campaign_start_date: adwords-campaign_start_date
          campaign_end_date: adwords-campaign_end_date
          account_id: adwords-accountId
      dimensions:
        - ref: date

        - name: funnel_account_id
          description: "Funnel export account UUID extracted from storage path"
          data_type: string
          type:
            metadata:
              path:
                token: 2

        # campaign
        - name: campaign_id
          description: "Google Ads campaign identifier (campaign.id)"
          data_type: string
        - ref: campaign_name
        - name: campaign_start_date
          description: "Campaign start date (YYYY-MM-DD)"
          data_type: string
        - name: campaign_end_date
          description: "Campaign end date (YYYY-MM-DD, default 2037-12-30 if open-ended)"
          data_type: string

        # account
        - name: account_id
          description: "Google Ads customer ID (customer.id, 10-digit numeric)"
          data_type: string

        # keyword attribution
        - name: keyword
          description: "Search keyword text associated with the click (criteria.keyword.text from KeywordView)"
          data_type: string
          ai_context:
            synonyms: [search term, keyword text]
        - name: click_id
          description: "Google Click Identifier (gclid) — globally unique per click, used for cross-system attribution"
          data_type: string
          ai_context:
            synonyms: [gclid, google click id]
