# Category 4: Google Analytics 4 — Two Standalone Datasets (v2)
#
# API-verified against GA4 Data API v1 schema:
#
#   NAMING CORRECTIONS (vs v1 model):
#     defaultChannelGrouping → defaultChannelGroup (no "ing" suffix)
#     isConversionEvent → isKeyEvent (rebranded March 2024)
#     conversions (metric) → keyEvents (rebranded March 2024)
#     samplesReadRate → NOT a dimension/metric (response metadata only)
#
#   source, medium, campaignName = event-scoped (key events only)
#   sessionSource, sessionMedium, sessionCampaignName = session-scoped
#   firstUserCampaignName, firstUserSourceMedium = first-touch scoped
#
#   purchaseRevenue = purchase events only (excludes refunds)
#   totalRevenue = purchase + subscription + ad revenue - refunds
#   ecommercePurchases = count of purchase events (not items)
#   transactions = count of purchase events with transaction_id
#
# Two separate datasets (different grains, no unification):
#   4a: ga4_event_performance — event-level (by event_name)
#   4b: ga4_ecommerce_sessions — session-level (by transaction_id)

semantic_model:
  name: alpinestars_ga4

  dimensions:
    - name: date
      description: "Reporting date"
      data_type: date
      type:
        temporal:
          grains: [day, week, month, quarter, year]

    - name: currency
      description: "Currency of the reported monetary values"
      data_type: string

    - name: country
      description: "Country from which user activity originated"
      data_type: string

  datasets:
    # ── 4a: GA4 Event Performance ──────────────────────────────────────────
    - name: ga4_event_performance
      description: "Google Analytics 4 event-level data — key events, event values, and purchase revenue by source/medium/campaign"
      ai_context: "Use for GA4 event-level analytics — key events (conversions), event values, purchase revenue by source, medium, campaign, channel grouping, and country. Note: source/medium/campaignName are event-scoped (key events only). isKeyEvent was formerly isConversionEvent. keyEvents was formerly conversions."
      extras:
        storage:
          path: "fs1henp3k8p1hqo/googleanalytics/b3bb7862-2304-4948-8b79-0e841a93b44a/"
        column_mapping:
          date: date
          currency: currency
          country: "googleanalytics-ga4:country"
          campaign_name: "googleanalytics-ga4:campaignName"
          source: "googleanalytics-ga4:source"
          medium: "googleanalytics-ga4:medium"
          source_medium: "googleanalytics-ga4:sourceMedium"
          default_channel_group: "googleanalytics-ga4:defaultChannelGrouping"
          event_name: "googleanalytics-ga4:eventName"
          hostname: "googleanalytics-ga4:hostName"
          is_key_event: "googleanalytics-ga4:isConversionEvent"
          key_events: "googleanalytics-ga4:conversions"
          event_value: "googleanalytics-ga4:eventValue"
          purchase_revenue: "googleanalytics-ga4:purchaseRevenue"
      dimensions:
        - ref: date
        - ref: currency
        - ref: country

        - name: campaign_name
          description: "Marketing campaign name attributed to the key event (event-scoped, only populated for key events)"
          data_type: string
          ai_context:
            synonyms: [campaign, ad campaign]
        - name: source
          description: "Traffic source attributed to the key event (event-scoped, e.g. 'google', 'newsletter')"
          data_type: string
        - name: medium
          description: "Traffic medium attributed to the key event (event-scoped, e.g. 'organic', 'cpc', 'referral')"
          data_type: string
        - name: source_medium
          description: "Combined source/medium attributed to key event (format: 'source / medium')"
          data_type: string
        - name: default_channel_group
          description: "Default channel group based on source/medium (GA4 API: defaultChannelGroup — Direct, Organic Search, Paid Search, Paid Social, etc.)"
          data_type: string
          ai_context:
            synonyms: [channel grouping, channel]
        - name: event_name
          description: "GA4 event name (e.g. page_view, purchase, add_to_cart)"
          data_type: string
        - name: hostname
          description: "Website hostname including subdomain (e.g. www.example.com)"
          data_type: string
        - name: is_key_event
          description: "Whether the event is marked as a key event ('true'/'false') — GA4 API: isKeyEvent (renamed from isConversionEvent in March 2024)"
          data_type: string

      measures:
        - name: key_events
          description: "Count of key events (GA4 API: keyEvents — renamed from 'conversions' in March 2024)"
          data_type: decimal
          agg: sum
          ai_context:
            synonyms: [conversions, ga4 conversions, key events]
        - name: event_value
          description: "Sum of the 'value' parameter sent with events"
          data_type: decimal
          agg: sum
        - name: purchase_revenue
          description: "Revenue from completed purchases (excludes refunds, excludes ad/subscription revenue)"
          data_type: decimal
          agg: sum
          ai_context:
            synonyms: [ga4 revenue, analytics revenue]

    # ── 4b: GA4 Ecommerce Sessions ────────────────────────────────────────
    - name: ga4_ecommerce_sessions
      description: "Google Analytics 4 ecommerce and session data — transactions, revenue, new users, sessions by source/campaign with first-touch and session attribution"
      ai_context: "Use for GA4 ecommerce funnel — sessions, new users, add-to-carts, checkouts, purchases, transaction IDs, and revenue. Supports first-touch (firstUser) and session-touch attribution dimensions. totalRevenue includes purchase + subscription + ad revenue."
      extras:
        storage:
          path: "fs1henp3k8p1hqo/googleanalytics/d054ffc9-d2df-45a8-868c-e0f3e6a54d71/"
        column_mapping:
          date: date
          currency: currency
          country: "googleanalytics-ga4:country"
          first_user_campaign_name: "googleanalytics-ga4:firstUserCampaignName"
          first_user_source_medium: "googleanalytics-ga4:firstUserSourceMedium"
          session_campaign_name: "googleanalytics-ga4:sessionCampaignName"
          session_medium: "googleanalytics-ga4:sessionMedium"
          session_source: "googleanalytics-ga4:sessionSource"
          session_source_medium: "googleanalytics-ga4:sessionSourceMedium"
          transaction_id: "googleanalytics-ga4:transactionId"
          sessions: "googleanalytics-ga4:sessions"
          new_users: "googleanalytics-ga4:newUsers"
          add_to_carts: "googleanalytics-ga4:addToCarts"
          checkouts: "googleanalytics-ga4:checkouts"
          ecommerce_purchases: "googleanalytics-ga4:ecommercePurchases"
          transactions: "googleanalytics-ga4:transactions"
          purchase_revenue: "googleanalytics-ga4:purchaseRevenue"
          total_revenue: "googleanalytics-ga4:totalRevenue"
          refund_amount: "googleanalytics-ga4:refundAmount"
          shipping_amount: "googleanalytics-ga4:shippingAmount"
          tax_amount: "googleanalytics-ga4:taxAmount"
      dimensions:
        - ref: date
        - ref: currency
        - ref: country

        # first-touch attribution
        - name: first_user_campaign_name
          description: "Campaign that first acquired the user (GA4 API: firstUserCampaignName)"
          data_type: string
          ai_context:
            synonyms: [first touch campaign, first user campaign]
        - name: first_user_source_medium
          description: "Source/medium that first acquired the user (GA4 API: firstUserSourceMedium)"
          data_type: string

        # session-touch attribution
        - name: session_campaign_name
          description: "Campaign associated with the session (GA4 API: sessionCampaignName)"
          data_type: string
        - name: session_medium
          description: "Medium of the session (GA4 API: sessionMedium)"
          data_type: string
        - name: session_source
          description: "Source of the session (GA4 API: sessionSource)"
          data_type: string
        - name: session_source_medium
          description: "Combined source/medium of the session (GA4 API: sessionSourceMedium)"
          data_type: string

        # ecommerce
        - name: transaction_id
          description: "Ecommerce transaction identifier (sent with purchase event's transaction_id parameter)"
          data_type: string

      measures:
        - name: sessions
          description: "Number of sessions that began on the site or app"
          data_type: decimal
          agg: sum
          ai_context:
            synonyms: [visits, ga4 sessions]

        - name: new_users
          description: "Users who interacted for the first time (0 previous sessions)"
          data_type: decimal
          agg: sum

        - name: add_to_carts
          description: "Number of add_to_cart events"
          data_type: decimal
          agg: sum

        - name: checkouts
          description: "Number of begin_checkout events"
          data_type: decimal
          agg: sum

        - name: ecommerce_purchases
          description: "Number of purchase events (not items — counts purchase events)"
          data_type: decimal
          agg: sum
          ai_context:
            synonyms: [ga4 purchases, analytics purchases]

        - name: transactions
          description: "Number of purchase events with a transaction_id"
          data_type: decimal
          agg: sum

        - name: purchase_revenue
          description: "Revenue from completed purchases (excludes refunds, ad revenue, subscription revenue)"
          data_type: decimal
          agg: sum
          ai_context:
            synonyms: [ga4 revenue, analytics revenue]

        - name: total_revenue
          description: "Total revenue including purchase + subscription + ad revenue minus refunds"
          data_type: decimal
          agg: sum

        - name: refund_amount
          description: "Total refunded amount (from refund events)"
          data_type: decimal
          agg: sum

        - name: shipping_amount
          description: "Total shipping costs (requires 'shipping' parameter on purchase events)"
          data_type: decimal
          agg: sum

        - name: tax_amount
          description: "Total tax amount (requires 'tax' parameter on purchase events)"
          data_type: decimal
          agg: sum
