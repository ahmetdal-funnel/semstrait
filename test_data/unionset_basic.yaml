semantic_model:
  name: unionset_basic
  description: "Unionset combining two datasets with NULL-fill for missing columns"

  unionsets:
    - name: all_events
      dimensions:
        - name: event_date
          data_type: date
          type:
            temporal:
              grains:
                - day
        - name: event_type
          data_type: string
          type:
            categorical:
              enum:
                - click
                - purchase
                - signup
      measures:
        - name: event_count
          data_type: int64
          expr: "COUNT(event_id)"
        - name: revenue
          data_type: float64
          expr: "SUM(amount)"
      datasets:
        - name: click_events
          extras:
            column_mapping:
              event_date: clicked_at
              event_type: action
              event_count: click_id
            storage:
              path: warehouse.click_events
        - name: purchase_events
          extras:
            column_mapping:
              event_date: purchased_at
              event_type: action
              event_count: purchase_id
              revenue: amount
            storage:
              path: warehouse.purchase_events
