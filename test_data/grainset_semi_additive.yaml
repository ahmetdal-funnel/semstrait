semantic_model:
  name: grainset_semi_additive
  description: "Grainset with semi-additive measure"

  kinds:
    - name: account_balances
      type:
        grainset:
      dimensions:
        - name: account_date
          data_type: date
          type:
            temporal:
              grains:
                - day
        - name: account_id
          data_type: string
          type:
            categorical:
      measures:
        - name: balance
          data_type: float64
          expr: "SUM(balance_amount)"
          additivity:
            type:
              semi:
                non_additive_dimensions:
                  - account_date
                resolution_strategy: latest
        - name: transaction_count
          data_type: int64
          expr: "COUNT(txn_id)"
      datasets:
        - name: daily_balances
          extras:
            column_mapping:
              account_date: snap_date
              account_id: acct_id
              balance: balance_amount
              transaction_count: txn_id
            storage:
              path: warehouse.account_balances
