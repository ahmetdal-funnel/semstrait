# Same scenario as before but modeled with nested union_set instead of partition.
# Facebook Ads "partitions" (accounts 111, 222, 333) are three sibling grain sets
# under a shared parent; adwords is a single grain set.

semantic_models:
  - name: partitioned_ads
    namespace: "test-namespace-123"

    dimensions:
      - name: _dataset
        virtual: true
        label: Table Metadata
        attributes:
          - name: model
            type: string
          - name: namespace
            type: string
          - name: path
            type: string
          - name: dataset
            type: string

      - name: dates
        source:
          type: parquet
          path: /data/dates.parquet
        table: dates
        attributes:
          - name: date
            type: date
          - name: year
            type: i32

    union_set:
      - name: facebookads
        label: Facebook Ads
        dimensions:
          - name: dates
            join:
              left_key: date_id
              right_key: date_id
          - name: campaign
            attributes:
              - name: campaign_name
                column: campaign_name
                type: string
          - name: _dataset
        measures:
          - name: spend
            aggregation: sum
            expr: spend
            type: f64
          - name: clicks
            aggregation: sum
            expr: clicks
            type: i64
          - name: impressions
            aggregation: sum
            expr: impressions
            type: i64
        union_set:
          - grain_set:
              name: facebookads_111
              dimensions: []
              measures: []
              datasets:
                - name: fb-account-111
                  source:
                    type: parquet
                    path: /data/facebookads/account_111.parquet
                  dimensions:
                    dates: [date, year]
                    campaign: [campaign_name]
                    _dataset: [model, namespace, path, dataset]
                  measures: [spend, clicks, impressions]
          - grain_set:
              name: facebookads_222
              dimensions: []
              measures: []
              datasets:
                - name: fb-account-222
                  source:
                    type: parquet
                    path: /data/facebookads/account_222.parquet
                  dimensions:
                    dates: [date, year]
                    campaign: [campaign_name]
                    _dataset: [model, namespace, path, dataset]
                  measures: [spend, clicks, impressions]
          - grain_set:
              name: facebookads_333
              dimensions: []
              measures: []
              datasets:
                - name: fb-account-333
                  source:
                    type: parquet
                    path: /data/facebookads/account_333.parquet
                  dimensions:
                    dates: [date, year]
                    campaign: [campaign_name]
                    _dataset: [model, namespace, path, dataset]
                  measures: [spend, clicks, impressions]

      - grain_set:
          name: adwords
          dimensions:
            - name: dates
              join:
                left_key: date_id
                right_key: date_id
            - name: campaign
              attributes:
                - name: campaign_name
                  column: adwords_campaign
                  type: string
            - name: _dataset
          measures:
            - name: cost
              aggregation: sum
              expr: cost
              type: f64
            - name: clicks
              aggregation: sum
              expr: clicks
              type: i64
          datasets:
            - name: adwords-daily
              source:
                type: parquet
                path: /data/adwords/daily.parquet
              dimensions:
                dates: [date, year]
                campaign: [campaign_name]
                _dataset: [model, namespace, path, dataset]
              measures: [cost, clicks]

    metrics:
      - name: spend
        expr: spend
        type: f64
      - name: clicks
        expr: clicks
        type: i64
      - name: impressions
        expr: impressions
        type: i64
      - name: cost
        expr: cost
        type: f64
      - name: total_clicks
        type: i64
        expr:
          case:
            when:
              - condition:
                  eq: [_dataset.path, "facebookads.facebookads_111"]
                then: clicks
              - condition:
                  eq: [_dataset.path, "facebookads.facebookads_222"]
                then: clicks
              - condition:
                  eq: [_dataset.path, "facebookads.facebookads_333"]
                then: clicks
              - condition:
                  eq: [_dataset.path, "adwords"]
                then: clicks
            else: 0
