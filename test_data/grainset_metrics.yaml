semantic_model:
  name: grainset_metrics
  description: "Grainset with metrics"

  kinds:
    - name: daily_orders
      type:
        grainset:
      dimensions:
        - name: order_date
          data_type: date
          type:
            temporal:
              grains:
                - day
      measures:
        - name: revenue
          data_type: float64
          expr: "SUM(amount)"
        - name: order_count
          data_type: int64
          expr: "COUNT(order_id)"
      metrics:
        - name: avg_order_value
          data_type: float64
          expr: "revenue / order_count"
      datasets:
        - name: orders_daily
          extras:
            column_mapping:
              order_date: created_at
              revenue: amount
              order_count: order_id
            storage:
              path: warehouse.orders
