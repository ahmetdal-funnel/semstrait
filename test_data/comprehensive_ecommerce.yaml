# Comprehensive E-Commerce Analytics — Semantic Model Test Suite
#
# Single model exercising ALL semstrait features end-to-end:
#
#   Kind strategies:     Grainset, Unionset (all + distinct), Joinset (left, 3-way BFS)
#   Dimension types:     Temporal (multi-grain), Categorical (enum), Binary, Bucketed, Metadata (path + literal)
#   Aggregation:         SUM, COUNT, COUNT_DISTINCT, AVG, MIN, MAX — all declarative
#   Additivity:          Full (explicit + derived), Semi (latest), Non (derived from count_distinct/avg)
#   Measure features:    Filters, Constraints (one_of, none_of, all, allowed, prohibited)
#   Metric types:        Simple, Ratio (safe-divide), Derived, Nested (depth > 0)
#   Column mapping:      Simple, WithGrain, Literal, Auto
#   Physical binding:    Multi-source paths, NULL-fill in unions, partial coverage
#   Relationships:       2-hop join chain, 3-way joinset, cross-kind ad-hoc
#   Temporal configs:    Timeseries, Snapshot, SCD type 2
#   Kind-level filters:  Domain filtering
#   Dataset-level filters: Status-based pre-filters
#
# Query scenarios documented in test comments in e2e_pipeline_test.rs.

semantic_model:
  name: ecommerce_analytics
  description: "Comprehensive e-commerce analytics model for full feature coverage testing"
  labels:
    - test
    - e2e

  # ═══════════════════════════════════════════════════════════════════════════
  # Shared top-level definitions (ref: targets)
  # ═══════════════════════════════════════════════════════════════════════════

  dimensions:
    - name: order_date
      description: "Date the order was placed"
      data_type: date
      type:
        temporal:
          grains: [day, week, month, quarter, year]

    - name: region
      description: "Geographic region"
      data_type: string
      type:
        categorical:
          enum:
            - north_america
            - europe
            - asia_pacific

  measures:
    - name: revenue
      description: "Total revenue (cancelled orders excluded)"
      data_type: float64
      agg: sum
      filters:
        - name: exclude_cancelled
          expr: "status != 'cancelled'"
      additivity:
        full: {}
      constraints:
        dimensions:
          one_of:
            - order_date
            - region
        aggregations:
          prohibited:
            - AVG

    - name: order_count
      description: "Number of orders"
      data_type: int64
      agg: count

    - name: cost
      description: "Total cost of goods sold"
      data_type: float64
      agg: sum

  metrics:
    - name: avg_order_value
      description: "Average order value (ratio metric)"
      data_type: float64
      expr: "revenue / order_count"

  # ═══════════════════════════════════════════════════════════════════════════
  # Standalone datasets (used by kinds + ad-hoc joins)
  # ═══════════════════════════════════════════════════════════════════════════

  datasets:
    # ─── Orders daily: fine-grain fact table ────────────────────────────────
    - name: orders_daily
      description: "Daily order transactions"
      domain: commerce
      keys:
        primary:
          - order_id
        foreign:
          - columns: [customer_id]
            reference: customers
            cardinality: many_to_one
          - columns: [product_id]
            reference: products
            cardinality: many_to_one
      dimensions:
        - ref: order_date
        - ref: region
        - name: category
          description: "Product category"
          data_type: string
          type:
            categorical:
              enum:
                - electronics
                - clothing
                - food
                - home
        - name: is_premium
          description: "Whether this is a premium order"
          data_type: bool
          type:
            binary:
              type: boolean
        - name: price_bucket
          description: "Order value tier"
          data_type: string
          type:
            bucketed:
              column: amount
              buckets:
                - name: low
                  start: 0
                  end: 50
                - name: medium
                  start: 50
                  end: 200
                - name: high
                  start: 200
                  end: 100000
      measures:
        - ref: revenue
        - ref: order_count
        - ref: cost
        - name: unique_customers
          description: "Distinct customer count (non-additive)"
          data_type: int64
          agg: count_distinct
          constraints:
            dimensions:
              none_of:
                - user_id
        - name: min_order_amount
          description: "Smallest order amount"
          data_type: float64
          agg: min
        - name: max_order_amount
          description: "Largest order amount"
          data_type: float64
          agg: max
      metrics:
        - ref: avg_order_value
        - name: margin
          description: "Profit margin (derived metric, requires date + region)"
          data_type: float64
          expr: "revenue - cost"
          constraints:
            dimensions:
              all:
                - order_date
                - region
        - name: margin_pct
          description: "Margin as percentage (nested metric, depth > 0)"
          data_type: float64
          expr: "margin / revenue"
      filters:
        - name: active_orders
          expr: "status != 'deleted'"
      extras:
        temporal:
          type:
            timeseries:
              occurred_at: created_at
        storage:
          format: parquet
          paths:
            - s3://warehouse/orders/daily/

    # ─── Orders monthly: coarse-grain aggregate ─────────────────────────────
    - name: orders_monthly
      description: "Monthly order aggregates"
      domain: commerce
      dimensions:
        - ref: order_date
        - ref: region
      measures:
        - ref: revenue
        - ref: order_count
        - ref: cost
      extras:
        storage:
          format: parquet
          paths:
            - s3://warehouse/orders/monthly/

    # ─── Customers: SCD type 2 dimension table ──────────────────────────────
    - name: customers
      description: "Customer dimension with history tracking"
      domain: crm
      keys:
        primary:
          - customer_id
      dimensions:
        - name: customer_name
          data_type: string
          type:
            categorical:
        - name: customer_tier
          data_type: string
          type:
            categorical:
              enum:
                - bronze
                - silver
                - gold
                - platinum
        - name: signup_date
          data_type: date
          type:
            temporal:
              grains: [day, month, year]
        - name: customer_region
          data_type: string
          type:
            categorical:
      measures:
        - name: customer_count
          data_type: int64
          agg: count
      extras:
        temporal:
          type:
            scd:
              type_2:
                valid_from: effective_date
                valid_to: expiry_date
        storage:
          format: parquet
          paths:
            - s3://warehouse/customers/

    # ─── Products: dimension table ──────────────────────────────────────────
    - name: products
      description: "Product catalog"
      domain: catalog
      keys:
        primary:
          - product_id
      dimensions:
        - name: product_name
          data_type: string
          type:
            categorical:
        - name: product_category
          data_type: string
          type:
            categorical:
              enum:
                - electronics
                - clothing
                - food
                - home
        - name: brand
          data_type: string
          type:
            categorical:
      measures:
        - name: product_count
          data_type: int64
          agg: count
      extras:
        storage:
          format: parquet
          paths:
            - s3://warehouse/products/

    # ─── Inventory snapshots: semi-additive ─────────────────────────────────
    - name: inventory_snapshots
      description: "Daily inventory snapshots (balance is semi-additive)"
      domain: operations
      keys:
        primary:
          - snapshot_id
      dimensions:
        - name: snapshot_date
          data_type: date
          type:
            temporal:
              grains: [day, month]
        - name: warehouse_id
          data_type: string
          type:
            categorical:
        - name: sku
          data_type: string
          type:
            categorical:
      measures:
        - name: inventory_balance
          description: "Stock on hand (semi-additive: latest across snapshot_date)"
          data_type: int64
          agg: sum
          additivity:
            semi:
              non_additive_dimensions:
                - snapshot_date
              resolution_strategy: latest
        - name: units_received
          description: "Units received (fully additive)"
          data_type: int64
          agg: sum
        - name: units_shipped
          description: "Units shipped (fully additive)"
          data_type: int64
          agg: sum
      metrics:
        - name: turnover_rate
          description: "Units shipped / inventory balance"
          data_type: float64
          expr: "units_shipped / inventory_balance"
      extras:
        temporal:
          type:
            snapshot:
              snapshotted_at: snap_date
        storage:
          format: parquet
          paths:
            - s3://warehouse/inventory/snapshots/

    # ─── Web clicks: traffic event stream ───────────────────────────────────
    - name: web_clicks
      description: "Website click events"
      domain: traffic
      dimensions:
        - name: click_date
          data_type: date
          type:
            temporal:
              grains: [day, week, month]
        - name: page_type
          data_type: string
          type:
            categorical:
              enum:
                - home
                - product
                - checkout
                - search
        - name: source_path
          description: "Extracted from S3 path token 3 (e.g. s3://traffic/web/2024/01/)"
          data_type: string
          type:
            metadata:
              path:
                token: 3
      measures:
        - name: clicks
          data_type: int64
          agg: count
        - name: sessions
          data_type: int64
          agg: count_distinct
        - name: conversions
          data_type: int64
          agg: sum
        - name: click_revenue
          description: "Revenue attributed to clicks"
          data_type: float64
          agg: sum
      extras:
        storage:
          format: parquet
          paths:
            - s3://traffic/web/

    # ─── Mobile clicks: mobile app events ───────────────────────────────────
    - name: mobile_clicks
      description: "Mobile app click events"
      domain: traffic
      dimensions:
        - name: click_date
          data_type: date
          type:
            temporal:
              grains: [day, week, month]
        - name: page_type
          data_type: string
          type:
            categorical:
      measures:
        - name: clicks
          data_type: int64
          agg: count
        - name: sessions
          data_type: int64
          agg: count_distinct
        - name: conversions
          data_type: int64
          agg: sum
      extras:
        storage:
          format: parquet
          paths:
            - s3://traffic/mobile/

    # ─── Email events: email campaign events ────────────────────────────────
    - name: email_events
      description: "Email campaign click events"
      domain: traffic
      dimensions:
        - name: click_date
          data_type: date
          type:
            temporal:
              grains: [day, month]
      measures:
        - name: clicks
          data_type: int64
          agg: count
      extras:
        storage:
          format: parquet
          paths:
            - s3://traffic/email/

    # ─── Campaigns: marketing campaign dimension ────────────────────────────
    - name: campaigns
      description: "Marketing campaign definitions"
      domain: marketing
      keys:
        primary:
          - campaign_id
      dimensions:
        - name: campaign_name
          data_type: string
          type:
            categorical:
        - name: campaign_channel
          data_type: string
          type:
            categorical:
              enum:
                - search
                - social
                - email
                - display
        - name: campaign_status
          data_type: string
          type:
            categorical:
              enum:
                - active
                - paused
                - completed
      measures:
        - name: campaign_budget
          data_type: float64
          agg: sum
      extras:
        storage:
          format: parquet
          paths:
            - s3://warehouse/campaigns/

  # ═══════════════════════════════════════════════════════════════════════════
  # Kind definitions
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── GRAINSET: sales (grain-aware routing) ────────────────────────────────
  grainsets:
    - name: sales
      description: "Sales metrics with grain-aware routing across daily and monthly tables"
      domain: commerce
      dimensions:
        - ref: order_date
        - ref: region
        - name: category
          data_type: string
          type:
            categorical:
        - name: status
          description: "Order status (used by kind-level filter)"
          data_type: string
          type:
            categorical:
      measures:
        - ref: revenue
        - ref: order_count
        - ref: cost
      metrics:
        - ref: avg_order_value
        - name: profit
          description: "Revenue minus cost"
          data_type: float64
          expr: "revenue - cost"
        - name: roi
          description: "Return on investment (nested: references profit metric)"
          data_type: float64
          expr: "profit / cost"
      filters:
        - name: kind_active_filter
          expr: "status != 'deleted'"
      datasets:
        - name: orders_daily
          extras:
            column_mapping:
              order_date: created_at
              region: region_code
              category: product_category
              revenue: amount
              order_count: order_id
              cost: cogs_amount
              status: order_status
            storage:
              format: parquet
              paths:
                - s3://warehouse/orders/daily/
        - name: orders_monthly
          extras:
            column_mapping:
              order_date:
                column: month_start
                grain: month
              region: region_code
              revenue: total_revenue
              order_count: total_orders
              cost: total_cogs
              status: order_status
            storage:
              format: parquet
              paths:
                - s3://warehouse/orders/monthly/

    # ─── GRAINSET: inventory (semi-additive measures) ─────────────────────────
    - name: inventory
      description: "Inventory tracking with semi-additive balance measures"
      domain: operations
      dimensions:
        - name: snapshot_date
          data_type: date
          type:
            temporal:
              grains: [day, month]
        - name: warehouse_id
          data_type: string
          type:
            categorical:
        - name: sku
          data_type: string
          type:
            categorical:
      measures:
        - name: inventory_balance
          description: "Stock on hand (semi-additive: latest across snapshot_date)"
          data_type: int64
          agg: sum
          additivity:
            semi:
              non_additive_dimensions:
                - snapshot_date
              resolution_strategy: latest
        - name: units_received
          data_type: int64
          agg: sum
        - name: units_shipped
          data_type: int64
          agg: sum
      metrics:
        - name: turnover_rate
          description: "Shipping velocity relative to stock"
          data_type: float64
          expr: "units_shipped / inventory_balance"
      datasets:
        - name: inventory_snapshots
          extras:
            column_mapping:
              snapshot_date: snap_date
              warehouse_id: wh_id
              sku: product_sku
              inventory_balance: qty_on_hand
              units_received: qty_received
              units_shipped: qty_shipped
            storage:
              format: parquet
              paths:
                - s3://warehouse/inventory/snapshots/

  # ─── UNIONSET: all_traffic (NULL-fill + literal dims + metadata) ──────────
  unionsets:
    - name: all_traffic
      description: "All traffic events unified across web, mobile, and email channels"
      mode: all
      dimensions:
        - name: click_date
          data_type: date
          type:
            temporal:
              grains: [day, week, month]
        - name: platform
          description: "Traffic source platform (injected as literal per dataset)"
          data_type: string
          type:
            categorical:
              enum:
                - web
                - mobile
                - email
        - name: page_type
          data_type: string
          type:
            categorical:
        - name: source_path
          description: "Extracted from storage path (metadata dimension)"
          data_type: string
          type:
            metadata:
              path:
                token: 3
      measures:
        - name: clicks
          data_type: int64
          agg: count
        - name: sessions
          description: "Distinct sessions (non-additive, only web + mobile)"
          data_type: int64
          agg: count_distinct
        - name: conversions
          description: "Conversion events (only web + mobile)"
          data_type: int64
          agg: sum
        - name: click_revenue
          description: "Revenue from clicks (only web)"
          data_type: float64
          agg: sum
      metrics:
        - name: conversion_rate
          description: "Conversions per click (ratio metric)"
          data_type: float64
          expr: "conversions / clicks"
        - name: revenue_per_click
          description: "Revenue per click (ratio, only meaningful for web)"
          data_type: float64
          expr: "click_revenue / clicks"
      datasets:
        # Web: full coverage — clicks, sessions, conversions, click_revenue, page_type, source_path
        - name: web_clicks
          extras:
            column_mapping:
              click_date: event_date
              platform:
                lit: web
              page_type: page_category
              clicks: click_id
              sessions: session_id
              conversions: conversion_count
              click_revenue: attributed_revenue
            storage:
              format: parquet
              paths:
                - s3://traffic/web/
        # Mobile: partial — clicks, sessions, conversions, page_type (NO click_revenue, NO source_path)
        - name: mobile_clicks
          extras:
            column_mapping:
              click_date: event_date
              platform:
                lit: mobile
              page_type: screen_name
              clicks: tap_id
              sessions: session_id
              conversions: conversion_count
            storage:
              format: parquet
              paths:
                - s3://traffic/mobile/
        # Email: minimal — clicks only (NO sessions, conversions, click_revenue, page_type, source_path)
        - name: email_events
          extras:
            column_mapping:
              click_date: event_date
              platform:
                lit: email
              clicks: click_id
            storage:
              format: parquet
              paths:
                - s3://traffic/email/

  # ─── JOINSET: order_details (3-way BFS join) ─────────────────────────────
  joinsets:
    - name: order_details
      description: "Order details joining orders with customers and products (3-way join)"
      associativity: left
      dimensions:
        - ref: order_date
        - ref: region
        - name: customer_name
          data_type: string
          type:
            categorical:
        - name: customer_tier
          data_type: string
          type:
            categorical:
        - name: product_name
          data_type: string
          type:
            categorical:
        - name: product_category
          data_type: string
          type:
            categorical:
      measures:
        - ref: revenue
        - ref: order_count
        - name: customer_count
          data_type: int64
          agg: count
      metrics:
        - ref: avg_order_value
      datasets:
        - name: orders_daily
          extras:
            column_mapping:
              order_date: created_at
              region: region_code
              revenue: amount
              order_count: order_id
            storage:
              format: parquet
              paths:
                - s3://warehouse/orders/daily/
        - name: customers
          extras:
            column_mapping:
              customer_name: full_name
              customer_tier: tier
              customer_count: customer_id
            storage:
              format: parquet
              paths:
                - s3://warehouse/customers/
        - name: products
          extras:
            column_mapping:
              product_name: name
              product_category: category
            storage:
              format: parquet
              paths:
                - s3://warehouse/products/
      relationships:
        - name: orders_to_customers
          from: orders_daily
          to: customers
          type: left
          columns:
            - from: customer_id
              to: customer_id
          cardinality: many_to_one
        - name: orders_to_products
          from: orders_daily
          to: products
          type: left
          columns:
            - from: product_id
              to: product_id
          cardinality: many_to_one

    # ─── JOINSET: traffic_campaigns (campaign attribution via join) ──────────
    - name: traffic_campaigns
      description: "Web traffic with campaign attribution"
      associativity: left
      dimensions:
        - name: click_date
          data_type: date
          type:
            temporal:
              grains: [day, week, month]
        - name: campaign_name
          data_type: string
          type:
            categorical:
        - name: campaign_channel
          data_type: string
          type:
            categorical:
        - name: page_type
          data_type: string
          type:
            categorical:
      measures:
        - name: clicks
          data_type: int64
          agg: count
        - name: conversions
          data_type: int64
          agg: sum
        - name: campaign_budget
          data_type: float64
          agg: sum
      metrics:
        - name: cost_per_conversion
          description: "Campaign budget per conversion"
          data_type: float64
          expr: "campaign_budget / conversions"
      datasets:
        - name: web_clicks
          extras:
            column_mapping:
              click_date: event_date
              page_type: page_category
              clicks: click_id
              conversions: conversion_count
            storage:
              format: parquet
              paths:
                - s3://traffic/web/
        - name: campaigns
          extras:
            column_mapping:
              campaign_name: name
              campaign_channel: channel
              campaign_budget: budget_amount
            storage:
              format: parquet
              paths:
                - s3://warehouse/campaigns/
      relationships:
        - name: clicks_to_campaigns
          from: web_clicks
          to: campaigns
          type: left
          columns:
            - from: campaign_id
              to: campaign_id
          cardinality: many_to_one

  # ═══════════════════════════════════════════════════════════════════════════
  # Top-level relationships (ad-hoc join resolution)
  # ═══════════════════════════════════════════════════════════════════════════

  relationships:
    - name: orders_to_customers
      from: orders_daily
      to: customers
      type: left
      columns:
        - from: customer_id
          to: customer_id
      cardinality: many_to_one

    - name: orders_to_products
      from: orders_daily
      to: products
      type: left
      columns:
        - from: product_id
          to: product_id
      cardinality: many_to_one
