semantic_model:
  name: alpinestars
  description: "Full multi-channel performance model for Alpinestars — covering paid media, email, affiliate, analytics, customer support, ecommerce, and inventory data"
  ai_context: "Alpinestars unified data model covering Google Ads, Bing Ads, Facebook Ads, TikTok Ads, Impact affiliate, Klaviyo email, Google Analytics 4, Shopify ecommerce and inventory, Gorgias customer support, and Funnel measurement. Use for cross-channel performance, revenue attribution, customer support, and inventory analysis."
  labels:
    [
      alpinestars,
      paid-media,
      ecommerce,
      email,
      affiliate,
      analytics,
      support,
      inventory,
    ]

  # ─── Shared dimensions ────────────────────────────────────────────────────

  dimensions:
    - name: date
      description: "Reporting date"
      data_type: date
      type:
        temporal:
          grains: [day, week, month, quarter, year]

    - name: currency
      description: "Currency of the reported monetary values"
      data_type: string
      type:
        categorical:

    - name: country
      description: "Country dimension"
      data_type: string
      type:
        categorical:

    - name: campaign_id
      description: "Campaign identifier"
      data_type: string
      type:
        categorical:

    - name: campaign_name
      description: "Campaign name"
      data_type: string
      type:
        categorical:
      ai_context:
        synonyms: [campaign, ad campaign]

    - name: account_name
      description: "Ad account name"
      data_type: string
      type:
        categorical:
      ai_context:
        synonyms: [ad account, account]

    - name: account_id
      description: "Ad account identifier"
      data_type: string
      type:
        categorical:

    - name: ad_id
      description: "Ad creative identifier"
      data_type: string
      type:
        categorical:

    - name: ad_name
      description: "Ad creative name"
      data_type: string
      type:
        categorical:

    - name: channel
      description: "Marketing or support channel — context-dependent (ad channel, support channel, email channel)"
      data_type: string
      type:
        categorical:
      ai_context:
        synonyms: [ad channel, media channel, support channel, email channel]

    - name: product_id
      description: "Product identifier"
      data_type: string
      type:
        categorical:

    - name: product_title
      description: "Product title / name"
      data_type: string
      type:
        categorical:
      ai_context:
        synonyms: [product name, item name]

    - name: product_type
      description: "Product type / category"
      data_type: string
      type:
        categorical:
      ai_context:
        synonyms: [product category, item type]

    - name: product_tags
      description: "Tags applied to the product"
      data_type: string
      type:
        categorical:

    - name: variant_id
      description: "Product variant identifier"
      data_type: string
      type:
        categorical:

    - name: variant_title
      description: "Product variant title"
      data_type: string
      type:
        categorical:

    - name: sku
      description: "Product SKU (stock-keeping unit)"
      data_type: string
      type:
        categorical:

  # ─── Shared measures ──────────────────────────────────────────────────────

  measures:
    - name: impressions
      description: "Total number of ad impressions"
      data_type: decimal
      expr: "SUM(impressions)"

    - name: clicks
      description: "Total number of ad clicks"
      data_type: decimal
      expr: "SUM(clicks)"

    - name: cost
      description: "Total ad spend across all channels — maps to cost (Google Ads, Bing Ads) or spend (Facebook Ads)"
      data_type: decimal
      expr: "SUM(cost)"
      ai_context:
        synonyms:
          [ad cost, google cost, bing cost, facebook spend, fb spend, ad spend]

    - name: conversions
      description: "Total conversions attributed to ads"
      data_type: decimal
      expr: "SUM(conversions)"
      ai_context:
        synonyms: [conv, total conversions]

    - name: revenue
      description: "Total attributed revenue"
      data_type: decimal
      expr: "SUM(revenue)"
      ai_context:
        synonyms: [conversion value, attributed revenue]

    - name: spend
      description: "Total ad spend — Facebook, TikTok, and Funnel field name for ad expenditure"
      data_type: decimal
      expr: "SUM(spend)"
      ai_context:
        synonyms: [ad spend, facebook spend, tiktok spend]

    - name: view_through_conversions
      description: "Conversions where a user viewed (but did not click) an ad before converting"
      data_type: decimal
      expr: "SUM(view_through_conversions)"
      ai_context:
        synonyms: [view-through conv, vtc]

    - name: landing_page_views
      description: "Total landing page views driven by ads"
      data_type: decimal
      expr: "SUM(landing_page_views)"
      ai_context:
        synonyms: [lpv, landing views]

    - name: affiliate_actions
      description: "Total affiliate conversion actions"
      data_type: decimal
      expr: "SUM(actions)"
      ai_context:
        synonyms: [affiliate conversions, impact conversions, impact actions]

    - name: client_cost
      description: "Total client cost paid to affiliate network (fees + commissions)"
      data_type: decimal
      expr: "SUM(client_cost)"
      ai_context:
        synonyms: [affiliate client cost, impact client cost]

  # ─── Shared metrics ───────────────────────────────────────────────────────

  metrics:
    - name: ctr
      description: "Click-through rate — clicks divided by impressions"
      data_type: decimal
      expr: "clicks / impressions"
      ai_context:
        synonyms: [click through rate, click rate]

    - name: cpc
      description: "Cost per click — Google Ads and Bing Ads (uses cost field)"
      data_type: decimal
      expr: "cost / clicks"
      ai_context:
        synonyms: [google cpc, bing cpc, adwords cpc]

    - name: cpa
      description: "Cost per conversion — Google Ads and Bing Ads (uses cost field)"
      data_type: decimal
      expr: "cost / conversions"
      ai_context:
        synonyms:
          [
            google cpa,
            bing cpa,
            cost per acquisition (google),
            cost per acquisition (bing),
          ]

    - name: roas
      description: "Return on ad spend — Google Ads and Bing Ads (revenue divided by cost)"
      data_type: decimal
      expr: "revenue / cost"
      ai_context:
        synonyms: [return on ad spend, google roas, bing roas]

    - name: conversion_rate
      description: "Share of clicks that resulted in a conversion"
      data_type: decimal
      expr: "conversions / clicks"
      ai_context:
        synonyms: [cvr, conv rate]

    - name: cpc_on_spend
      description: "Cost per click — Facebook, TikTok, and Funnel platforms (uses spend field)"
      data_type: decimal
      expr: "spend / clicks"
      ai_context:
        synonyms:
          [
            facebook cpc,
            tiktok cpc,
            cost per click (facebook),
            cost per click (tiktok),
          ]

    - name: cpm_on_spend
      description: "Cost per thousand impressions — Facebook, TikTok, and Funnel platforms (uses spend field)"
      data_type: decimal
      expr: "(spend / impressions) * 1000"
      ai_context:
        synonyms: [cost per mille, cost per thousand, cpm]

    - name: cpa_on_spend
      description: "Cost per conversion — Facebook, TikTok, and Funnel platforms (uses spend field)"
      data_type: decimal
      expr: "spend / conversions"
      ai_context:
        synonyms:
          [
            facebook cpa,
            tiktok cpa,
            cost per acquisition (facebook),
            cost per acquisition (tiktok),
          ]

    - name: average_order_value
      description: "Average order value — total revenue divided by number of orders"
      data_type: decimal
      expr: "total_amount / orders"
      ai_context:
        synonyms: [aov, avg order value]

    - name: gross_margin
      description: "Gross margin — revenue minus cost of goods, divided by revenue"
      data_type: decimal
      expr: "(total_amount - total_cost) / total_amount"
      ai_context:
        synonyms: [margin, profit margin]

  # ─── Datasets (single-source, no kind needed) ────────────────────────────

  datasets:
    # ── Schema I — Facebook/Meta Ads Adset Performance ───────────────────────
    - name: facebook_adset_performance
      description: "Facebook/Meta Ads adset-level performance with full action and action value breakdowns"
      ai_context: "Use for Facebook/Meta Ads performance at the adset level — spend, impressions, clicks, conversions (purchases, checkouts, leads, add-to-cart), revenue. Includes campaign, adset, objective, optimization goal, attribution setting, and country."
      extras:
        storage:
          path: "fs1henp3k8p1hqo/facebookads/27f1d45a-97af-4fdd-b590-37c8ef7d1e27/"
      column_mapping:
        date: date
        currency: currency
        country: facebookads-country
        campaign_id: facebookads-campaign_id
        campaign_name: facebookads-campaign_name
        campaign_effective_status: facebookads-campaign_effective_status
        campaign_start_time: facebookads-campaign_start_time
        campaign_stop_time: facebookads-campaign_stop_time
        objective: facebookads-objective
        buying_type: facebookads-buying_type
        adset_id: facebookads-adset_id
        adset_name: facebookads-adset_name
        adset_effective_status: facebookads-adset_effective_status
        adset_start_time: facebookads-adset_start_time
        adset_end_time: facebookads-adset_end_time
        optimization_goal: facebookads-optimization_goal
        ad_account_id: facebookads-ad_account_id
        attribution_setting: facebookads-attribution_setting
        result_type: facebookads-result_type
        cost: facebookads-spend
        impressions: facebookads-impressions
        clicks: facebookads-clicks
        bid_amount: facebookads-bid_amount
        daily_budget: facebookads-daily_budget
        lifetime_budget: facebookads-lifetime_budget
        result_value: facebookads-result_value
        link_clicks: facebookads-actions.link_click
        landing_page_views: facebookads-actions.landing_page_view
        purchases: facebookads-actions.offsite_conversion.fb_pixel_purchase
        add_to_cart: facebookads-actions.offsite_conversion.fb_pixel_add_to_cart
        initiate_checkout: facebookads-actions.offsite_conversion.fb_pixel_initiate_checkout
        purchase_value: facebookads-action_values.offsite_conversion.fb_pixel_purchase
        outbound_clicks: "facebookads-outbound_clicks.outbound_click"
      dimensions:
        - ref: date
        - ref: currency
        - ref: country
        - ref: campaign_id
        - ref: campaign_name
        - name: campaign_effective_status
          description: "Effective status of the campaign"
          data_type: string
          type:
            categorical:
        - name: campaign_start_time
          description: "Campaign start timestamp"
          data_type: string
          type:
            categorical:
        - name: campaign_stop_time
          description: "Campaign stop timestamp"
          data_type: string
          type:
            categorical:
        - name: objective
          description: "Campaign objective (CONVERSIONS, REACH, TRAFFIC…)"
          data_type: string
          type:
            categorical:
        - name: buying_type
          description: "Ad buying type (AUCTION, RESERVED)"
          data_type: string
          type:
            categorical:
        - name: adset_id
          description: "Facebook adset identifier"
          data_type: string
          type:
            categorical:
        - name: adset_name
          description: "Facebook adset name"
          data_type: string
          type:
            categorical:
        - name: adset_effective_status
          description: "Effective status of the adset"
          data_type: string
          type:
            categorical:
        - name: adset_start_time
          description: "Adset start timestamp"
          data_type: string
          type:
            categorical:
        - name: adset_end_time
          description: "Adset end timestamp"
          data_type: string
          type:
            categorical:
        - name: optimization_goal
          description: "Adset optimization goal (OFFSITE_CONVERSIONS, LINK_CLICKS…)"
          data_type: string
          type:
            categorical:
        - name: ad_account_id
          description: "Facebook ad account identifier"
          data_type: string
          type:
            categorical:
        - name: attribution_setting
          description: "Attribution window setting"
          data_type: string
          type:
            categorical:
        - name: result_type
          description: "Result type corresponding to the campaign objective"
          data_type: string
          type:
            categorical:
      measures:
        - ref: cost
        - ref: impressions
        - ref: clicks
        - name: bid_amount
          description: "Bid amount for the adset"
          data_type: decimal
          expr: "SUM(bid_amount)"
        - name: daily_budget
          description: "Daily budget of the adset"
          data_type: decimal
          expr: "SUM(daily_budget)"
        - name: lifetime_budget
          description: "Lifetime budget of the adset"
          data_type: decimal
          expr: "SUM(lifetime_budget)"
        - name: result_value
          description: "Total result value (e.g. purchase value)"
          data_type: decimal
          expr: "SUM(result_value)"
        - name: link_clicks
          description: "Total link clicks"
          data_type: decimal
          expr: "SUM(link_clicks)"
        - ref: landing_page_views
        - name: add_to_cart
          description: "Total add-to-cart events from Facebook pixel"
          data_type: decimal
          expr: "SUM(add_to_cart)"
          ai_context:
            synonyms: [atc, cart additions]
        - name: purchases
          description: "Total purchases attributed to ads"
          data_type: decimal
          expr: "SUM(purchases)"
          ai_context:
            synonyms: [fb purchases, facebook purchases]
        - name: initiate_checkout
          description: "Total initiated checkout events"
          data_type: decimal
          expr: "SUM(initiate_checkout)"
        - name: purchase_value
          description: "Total value of purchases"
          data_type: decimal
          expr: "SUM(purchase_value)"
          ai_context:
            synonyms: [fb revenue, facebook revenue, purchase revenue]
        - name: outbound_clicks
          description: "Clicks leading to destinations off Facebook"
          data_type: decimal
          expr: "SUM(outbound_clicks)"
      metrics:
        - ref: ctr
        - ref: cpc
        - ref: cpm_on_spend
        - name: roas
          description: "Return on ad spend — purchase value divided by cost"
          data_type: decimal
          expr: "purchase_value / cost"
          ai_context:
            synonyms: [facebook roas, fb roas]
        - name: cpa
          description: "Cost per purchase — cost divided by purchases"
          data_type: decimal
          expr: "cost / purchases"
          ai_context:
            synonyms: [cost per purchase, cost per acquisition]

    # ── Schema J — Funnel Measurement Performance ────────────────────────────
    - name: funnel_measurement_performance
      description: "Funnel multi-attribution measurement — cross-channel performance with algorithmic (a2), MTA, platform, last-click, and first-click attribution models"
      ai_context: "Use for cross-channel attribution comparison. Shows spend, clicks, impressions, and conversions/revenue under five attribution models: algorithmic (a2), MTA, platform, last-click, first-click. Breakdowns by channel, campaign, country, brand, and conversion event."
      extras:
        storage:
          path: "fs1henp3k8p1hqo/funnel_measurement_performance/28e60e7b-b089-48c3-90fe-4684aea3784d/"
      column_mapping:
        date: date
        currency: currency
        country: funnel_measurement_performance-country
        channel: funnel_measurement_performance-channel
        partition_id: funnel_measurement_performance-partition_id
        brand: funnel_measurement_performance-brand
        conversion_event: funnel_measurement_performance-conversion_event
        report_name: funnel_measurement_performance-report_name
        a2_source: funnel_measurement_performance-a2_source
        campaign_name: funnel_measurement_performance-campaign
        traffic_source: funnel_measurement_performance-traffic_source
        spend: funnel_measurement_performance-spend
        clicks: funnel_measurement_performance-clicks
        impressions: funnel_measurement_performance-impressions
        a2_conversions: funnel_measurement_performance-a2_conversions
        mta_conversions: funnel_measurement_performance-mta_conversions
        platform_conversions: funnel_measurement_performance-platform_conversions
        lastclick_conversions: funnel_measurement_performance-lastclick_conversions
        firstclick_conversions: funnel_measurement_performance-firstclick_conversions
        a2_revenue: funnel_measurement_performance-a2_revenue
        mta_revenue: funnel_measurement_performance-mta_revenue
        platform_revenue: funnel_measurement_performance-platform_revenue
        lastclick_revenue: funnel_measurement_performance-lastclick_revenue
        firstclick_revenue: funnel_measurement_performance-firstclick_revenue
        delta_spend: funnel_measurement_performance-delta_spend
        delta_conversions: funnel_measurement_performance-delta_conversions
        delta_revenue: funnel_measurement_performance-delta_revenue
      dimensions:
        - ref: date
        - ref: currency
        - ref: country
        - ref: channel
        - name: partition_id
          description: "Funnel partition identifier"
          data_type: string
          type:
            categorical:
        - name: brand
          description: "Brand dimension"
          data_type: string
          type:
            categorical:
        - name: conversion_event
          description: "Type of conversion event being measured"
          data_type: string
          type:
            categorical:
        - name: report_name
          description: "Name of the Funnel report"
          data_type: string
          type:
            categorical:
        - name: a2_source
          description: "Algorithmic attribution source label"
          data_type: string
          type:
            categorical:
        - ref: campaign_name
        - name: traffic_source
          description: "Traffic source label"
          data_type: string
          type:
            categorical:
      measures:
        - ref: spend
        - ref: clicks
        - ref: impressions
        - name: a2_conversions
          description: "Conversions under algorithmic (a2) attribution"
          data_type: decimal
          expr: "SUM(a2_conversions)"
        - name: mta_conversions
          description: "Conversions under multi-touch attribution (MTA)"
          data_type: decimal
          expr: "SUM(mta_conversions)"
        - name: platform_conversions
          description: "Conversions as reported by the ad platform"
          data_type: decimal
          expr: "SUM(platform_conversions)"
        - name: lastclick_conversions
          description: "Conversions under last-click attribution"
          data_type: decimal
          expr: "SUM(lastclick_conversions)"
        - name: firstclick_conversions
          description: "Conversions under first-click attribution"
          data_type: decimal
          expr: "SUM(firstclick_conversions)"
        - name: a2_revenue
          description: "Revenue under algorithmic (a2) attribution"
          data_type: decimal
          expr: "SUM(a2_revenue)"
        - name: mta_revenue
          description: "Revenue under multi-touch attribution"
          data_type: decimal
          expr: "SUM(mta_revenue)"
        - name: platform_revenue
          description: "Revenue as reported by the ad platform"
          data_type: decimal
          expr: "SUM(platform_revenue)"
        - name: lastclick_revenue
          description: "Revenue under last-click attribution"
          data_type: decimal
          expr: "SUM(lastclick_revenue)"
        - name: firstclick_revenue
          description: "Revenue under first-click attribution"
          data_type: decimal
          expr: "SUM(firstclick_revenue)"
        - name: delta_spend
          description: "Change in spend vs. prior period"
          data_type: decimal
          expr: "SUM(delta_spend)"
        - name: delta_conversions
          description: "Change in conversions vs. prior period"
          data_type: decimal
          expr: "SUM(delta_conversions)"
        - name: delta_revenue
          description: "Change in revenue vs. prior period"
          data_type: decimal
          expr: "SUM(delta_revenue)"
      metrics:
        - ref: ctr
        - ref: cpc_on_spend

    # ── Schema K — Google Analytics 4 Event Data ─────────────────────────────
    - name: ga4_event_performance
      description: "Google Analytics 4 event-level data — conversions, purchase revenue, and event counts by source/medium/campaign"
      ai_context: "Use for GA4 event-level analytics — conversions, event values, purchase revenue by source, medium, campaign, channel grouping, and country. Includes is_conversion_event flag."
      extras:
        storage:
          path: "fs1henp3k8p1hqo/googleanalytics/b3bb7862-2304-4948-8b79-0e841a93b44a/"
      column_mapping:
        date: date
        currency: currency
        country: "googleanalytics-ga4:country"
        campaign_name: "googleanalytics-ga4:campaignName"
        source: "googleanalytics-ga4:source"
        medium: "googleanalytics-ga4:medium"
        source_medium: "googleanalytics-ga4:sourceMedium"
        default_channel_grouping: "googleanalytics-ga4:defaultChannelGrouping"
        event_name: "googleanalytics-ga4:eventName"
        hostname: "googleanalytics-ga4:hostName"
        is_conversion_event: "googleanalytics-ga4:isConversionEvent"
        samples_read_rate: "googleanalytics-ga4:samplesReadRate"
        conversions: "googleanalytics-ga4:conversions"
        event_value: "googleanalytics-ga4:eventValue"
        purchase_revenue: "googleanalytics-ga4:purchaseRevenue"
      dimensions:
        - ref: date
        - ref: currency
        - ref: country
        - ref: campaign_name
        - name: source
          description: "Traffic source (utm_source)"
          data_type: string
          type:
            categorical:
        - name: medium
          description: "Traffic medium (utm_medium)"
          data_type: string
          type:
            categorical:
        - name: source_medium
          description: "Combined source/medium"
          data_type: string
          type:
            categorical:
        - name: default_channel_grouping
          description: "GA4 default channel grouping (Organic Search, Paid Search, Direct…)"
          data_type: string
          type:
            categorical:
          ai_context:
            synonyms: [channel grouping, channel]
        - name: event_name
          description: "Name of the GA4 event"
          data_type: string
          type:
            categorical:
        - name: hostname
          description: "Hostname of the website"
          data_type: string
          type:
            categorical:
        - name: is_conversion_event
          description: "Whether the event is marked as a conversion"
          data_type: string
          type:
            categorical:
        - name: samples_read_rate
          description: "GA4 sampling rate indicator"
          data_type: string
          type:
            categorical:
      measures:
        - ref: conversions
        - name: event_value
          description: "Total value of GA4 events"
          data_type: decimal
          expr: "SUM(event_value)"
        - name: purchase_revenue
          description: "Total purchase revenue from GA4"
          data_type: decimal
          expr: "SUM(purchase_revenue)"
          ai_context:
            synonyms: [ga4 revenue, analytics revenue]

    # ── Schema L — Google Analytics 4 Ecommerce + Session Report ─────────────
    - name: ga4_ecommerce_sessions
      description: "Google Analytics 4 ecommerce and session data — transactions, revenue, new users, sessions by source/campaign"
      ai_context: "Use for GA4 ecommerce funnel — sessions, new users, add-to-carts, checkouts, purchases, transaction IDs, and revenue. Supports first-touch and session-touch attribution via firstUser and session campaign/source dimensions."
      extras:
        storage:
          path: "fs1henp3k8p1hqo/googleanalytics/d054ffc9-d2df-45a8-868c-e0f3e6a54d71/"
      column_mapping:
        date: date
        currency: currency
        country: "googleanalytics-ga4:country"
        first_user_campaign_name: "googleanalytics-ga4:firstUserCampaignName"
        first_user_source_medium: "googleanalytics-ga4:firstUserSourceMedium"
        session_campaign_name: "googleanalytics-ga4:sessionCampaignName"
        session_medium: "googleanalytics-ga4:sessionMedium"
        session_source: "googleanalytics-ga4:sessionSource"
        session_source_medium: "googleanalytics-ga4:sessionSourceMedium"
        transaction_id: "googleanalytics-ga4:transactionId"
        samples_read_rate: "googleanalytics-ga4:samplesReadRate"
        sessions: "googleanalytics-ga4:sessions"
        new_users: "googleanalytics-ga4:newUsers"
        add_to_carts: "googleanalytics-ga4:addToCarts"
        checkouts: "googleanalytics-ga4:checkouts"
        ecommerce_purchases: "googleanalytics-ga4:ecommercePurchases"
        transactions: "googleanalytics-ga4:transactions"
        purchase_revenue: "googleanalytics-ga4:purchaseRevenue"
        total_revenue: "googleanalytics-ga4:totalRevenue"
        refund_amount: "googleanalytics-ga4:refundAmount"
        shipping_amount: "googleanalytics-ga4:shippingAmount"
        tax_amount: "googleanalytics-ga4:taxAmount"
      dimensions:
        - ref: date
        - ref: currency
        - ref: country
        - name: first_user_campaign_name
          description: "Campaign that first acquired the user"
          data_type: string
          type:
            categorical:
          ai_context:
            synonyms: [first touch campaign, first user campaign]
        - name: first_user_source_medium
          description: "Source/medium that first acquired the user"
          data_type: string
          type:
            categorical:
        - name: session_campaign_name
          description: "Campaign associated with the session"
          data_type: string
          type:
            categorical:
        - name: session_medium
          description: "Medium of the session"
          data_type: string
          type:
            categorical:
        - name: session_source
          description: "Source of the session"
          data_type: string
          type:
