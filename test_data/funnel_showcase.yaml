    - name: bing_campaign_performance
      description: "Microsoft Bing Ads campaign-level performance data unified across all accounts"
      ai_context: "Use for Bing/Microsoft Ads performance — impressions, clicks, cost, conversions, revenue by campaign, device, network, match type, and goal."
      dimensions:
