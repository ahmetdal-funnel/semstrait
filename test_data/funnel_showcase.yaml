          description: "Total tickets for this channel"
          data_type: decimal
          expr: "SUM(total_tickets)"
        - name: delta
          description: "Change in ticket volume vs. prior period"
          data_type: decimal
          expr: "SUM(delta)"

    - name: gorgias_csat_distribution
      description: "Gorgias CSAT survey distribution — daily survey sends, response rates, and score distributions"
      ai_context: "Use for Gorgias CSAT (customer satisfaction) analysis — survey response rates, score distribution (1–5), and non-response breakdown."
      extras:
        storage:
