    # ── Shopify Joinset — Order lines enriched with inventory cost basis ───────
    #
    # shopify_orders is the anchor (one row per order line-item with revenue,
    # customer, and attribution). shopify_inventory is the satellite that
    # contributes the unit cost and real-time stock levels per variant.
    #
    # The join is many-to-one on variant_id. Because inventory is a daily
    # snapshot, the planner must use the latest snapshot (semi-additive
    # measures). This joinset unlocks gross margin calculation at order-line
    # level without requiring a separate join outside the model.
    #
    - name: shopify_enriched
      description: "Shopify order lines enriched with variant-level inventory cost — enables gross margin analysis at order and product level"
      ai_context: "Use for Shopify profitability analysis — combines order revenue, discounts, quantity, and customer/attribution context with variant unit cost from inventory snapshots. Enables gross margin, COGS, and margin-by-product queries."
      type:
        joinset:
          associativity: left
      keys:
        primary: [order_id]
        foreign:
          - columns: [variant_id]
            reference: shopify_inventory
            cardinality: many_to_one
      dimensions:
        - ref: date
        - ref: currency
        - ref: product_id
        - ref: product_title
        - ref: product_type
        - ref: product_tags
        - ref: variant_id
        - ref: variant_title
        - ref: sku
        - name: order_id
          description: "Shopify order identifier"
          data_type: string
          type:
            categorical:
        - name: order_name
          description: "Shopify order name (e.g. #1234)"
          data_type: string
          type:
            categorical:
        - name: order_action_type
          description: "Type of order action (sale, refund…)"
          data_type: string
          type:
            categorical:
        - name: customer_id
          description: "Shopify customer identifier"
          data_type: string
          type:
            categorical:
        - name: customer_email
          description: "Customer email address"
          data_type: string
          type:
            categorical:
        - name: customer_order_index
          description: "Order index for the customer (1 = first order)"
          data_type: string
          type:
            categorical:
          ai_context:
            synonyms: [order number, new vs returning]
        - name: discount_code
          description: "Discount code applied to the order"
          data_type: string
          type:
            categorical:
        - name: shipping_country
          description: "Shipping destination country"
          data_type: string
          type:
            categorical:
        - name: first_visit_source
          description: "Traffic source of the customer's first visit"
          data_type: string
          type:
            categorical:
          ai_context:
            synonyms: [first touch source, acquisition source]
        - name: first_visit_campaign
          description: "Campaign of the customer's first visit"
          data_type: string
          type:
            categorical:
        - name: last_visit_source
          description: "Traffic source of the customer's last visit before purchase"
          data_type: string
          type:
            categorical:
          ai_context:
            synonyms: [last touch source, last click source]
        - name: last_visit_campaign
          description: "Campaign of the customer's last visit"
          data_type: string
          type:
            categorical:
        - name: vendor
          description: "Product vendor / brand"
          data_type: string
          type:
            categorical:
        - name: location_name
          description: "Inventory location (from snapshot satellite)"
          data_type: string
          type:
            categorical:
      measures:
        - name: sales_quantity
          description: "Total units sold"
          data_type: decimal
          expr: "SUM(sales_quantity)"
          ai_context:
            synonyms: [units sold, quantity]
        - name: orders
          description: "Total number of orders"
          data_type: decimal
          expr: "SUM(orders)"
          ai_context:
            synonyms: [order count, number of orders]
        - name: total_amount
          description: "Total order amount (gross revenue)"
          data_type: decimal
          expr: "SUM(total_amount)"
          ai_context:
            synonyms: [gross revenue, order revenue, shopify revenue]
        - name: total_discount_before_taxes
          description: "Total discount amount before taxes"
          data_type: decimal
          expr: "SUM(total_discount_before_taxes)"
        - name: unit_price
          description: "Original unit price of the line item"
          data_type: decimal
          expr: "SUM(unit_price)"
        - name: total_cost
          description: "Total cost of goods — order quantity × variant unit cost from inventory snapshot"
          data_type: decimal
          expr: "SUM(total_cost)"
          ai_context:
            synonyms: [cogs, cost of goods]
        - name: variant_unit_cost
          description: "Variant unit cost from the latest inventory snapshot (semi-additive — snapshot)"
          data_type: decimal
          expr: "SUM(variant_unit_cost)"
          additivity:
            semi:
                non_additive_dimensions: [date]
        - name: on_hand_quantity
          description: "On-hand inventory quantity from the latest snapshot"
          data_type: decimal
          expr: "SUM(on_hand_quantity)"
          additivity:
            semi:
                non_additive_dimensions: [date]
          ai_context:
            synonyms: [stock, inventory]
      metrics:
        - ref: average_order_value
        - ref: gross_margin
        - name: gross_profit
          description: "Gross profit — revenue minus COGS"
          data_type: decimal
          expr: "total_amount - total_cost"
          ai_context:
            synonyms: [profit, gross profit]
      datasets:
        # Anchor — order line-items with revenue, customer, attribution
        - name: "d067774d-2be0-4908-aa83-8d83d043ceba"
          description: "Shopify order line-item detail (anchor)"
          extras:
            storage:
              path: "fs1henp3k8p1hqo/shopify/d067774d-2be0-4908-aa83-8d83d043ceba/"
          column_mapping:
            date: date
            currency: currency
            order_id: shopify-order_id
            order_name: shopify-order_name
            order_action_type: shopify-order_action_type
            customer_id: shopify-customer_id_v2
            customer_email: shopify-customer_email
            customer_order_index: shopify-customer_order_index_v2
            discount_code: shopify-discount_code
            shipping_country: shopify-shipping_country
            first_visit_source: shopify-first_visit_source
            first_visit_campaign: shopify-first_visit_campaign
            last_visit_source: shopify-last_visit_source
            last_visit_campaign: shopify-last_visit_campaign
            product_id: shopify-product_id
            product_title: shopify-product_title
            product_type: shopify-product_type
            product_tags: shopify-product_tags
            variant_id: shopify-variant_id
            variant_title: shopify-variant_title
            sku: shopify-sku
            vendor: shopify-vendor
            sales_quantity: shopify-sales_quantity
            orders: shopify-orders
            total_amount: shopify-total_amount
            total_discount_before_taxes: shopify-total_discount_amount_before_taxes
            unit_price: shopify-line_item_original_unit_price
            total_cost: "shopify-total_cost:funnel-derived"
        # Satellite — variant-level unit cost and stock levels from inventory snapshot
        - name: "d6d7da76-06f3-4b1d-a34c-1286b252e4ef"
          description: "Shopify inventory snapshot (satellite — unit cost and stock)"
          extras:
            storage:
              path: "fs1henp3k8p1hqo/shopify/d6d7da76-06f3-4b1d-a34c-1286b252e4ef/"
            temporal:
              type:
                snapshot:
                  validity_column: date
          column_mapping:
            variant_id: shopify-variant_id
            sku: shopify-sku
            location_name: shopify-location_name
            variant_unit_cost: shopify-variant_unit_cost
            on_hand_quantity: shopify-on_hand_quantity
      relationships:
        - name: orders_to_inventory
          from: "d067774d-2be0-4908-aa83-8d83d043ceba"
          to: "d6d7da76-06f3-4b1d-a34c-1286b252e4ef"
          type: left
          columns:
            - from: shopify-variant_id
              to: shopify-variant_id
          cardinality: many_to_one
