        total_closed_tickets: custom_alpinestars_gorgias-total_closed_tickets
        total_replied_tickets: custom_alpinestars_gorgias-total_replied_tickets
        total_one_touch_tickets: custom_alpinestars_gorgias-total_one_touch_tickets
        total_messages_received: custom_alpinestars_gorgias-total_messages_received
        total_messages_sent: custom_alpinestars_gorgias-total_messages_sent
      dimensions:
        - ref: date
      measures:
        - name: total_new_tickets
          description: "Total new tickets opened"
          data_type: decimal
          expr: "SUM(total_new_tickets)"
          ai_context:
            synonyms: [new tickets, tickets created]
        - name: total_closed_tickets
          description: "Total tickets closed"
          data_type: decimal
          expr: "SUM(total_closed_tickets)"
        - name: total_replied_tickets
          description: "Total tickets with at least one agent reply"
          data_type: decimal
          expr: "SUM(total_replied_tickets)"
        - name: total_one_touch_tickets
          description: "Tickets resolved with a single reply"
          data_type: decimal
          expr: "SUM(total_one_touch_tickets)"
        - name: total_messages_received
          description: "Total inbound messages received"
          data_type: decimal
          expr: "SUM(total_messages_received)"
        - name: total_messages_sent
          description: "Total outbound messages sent"
          data_type: decimal
          expr: "SUM(total_messages_sent)"

    - name: gorgias_ticket_volume_by_channel
      description: "Gorgias ticket volume aggregated by support channel — daily totals and period-over-period delta"
      ai_context: "Use for Gorgias channel volume analysis — how many tickets arrived via each support channel (email, chat, instagram…) per day and how that changed vs. prior period."
      extras:
        storage:
          path: "fs1henp3k8p1hqo/custom_alpinestars_gorgias/9bd56460-3464-458b-954e-1114e06083e6/"
      column_mapping:
