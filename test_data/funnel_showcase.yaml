          description: "Status of the budget"
          data_type: string
          type:
            categorical:
        - name: budget_association_status
          description: "Status of the budget association"
          data_type: string
          type:
            categorical:
        - name: goal
          description: "Conversion goal name"
          data_type: string
          type:
            categorical:
        - name: goal_type
          description: "Type of conversion goal"
          data_type: string
          type:
            categorical:
      measures:
        - ref: impressions
        - ref: clicks
        - ref: cost
        - name: total_position
          description: "Sum of ad positions (used to compute average position)"
          data_type: decimal
          expr: "SUM(total_position)"
        - name: low_quality_clicks
          description: "Clicks considered low quality"
          data_type: decimal
          expr: "SUM(low_quality_clicks)"
        - name: low_quality_impressions
          description: "Impressions considered low quality"
          data_type: decimal
          expr: "SUM(low_quality_impressions)"
        - name: low_quality_conversions
          description: "Conversions from low-quality clicks"
          data_type: decimal
          expr: "SUM(low_quality_conversions)"
        - name: phone_impressions
          description: "Call extension phone impressions"
          data_type: decimal
          expr: "SUM(phone_impressions)"
        - name: phone_calls
          description: "Tracked phone calls from ads"
          data_type: decimal
          expr: "SUM(phone_calls)"
        - ref: view_through_conversions
        - name: all_conversions
