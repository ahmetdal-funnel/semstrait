        - name: delivered_match_type
          description: "Actual match type used to serve the ad"
          data_type: string
          type:
            categorical:
        - name: tracking_template
          description: "Tracking URL template"
          data_type: string
          type:
            categorical:
        - name: custom_parameters
          description: "Custom URL parameters"
          data_type: string
          type:
            categorical:
        - name: budget_name
          description: "Name of the budget associated with the campaign"
          data_type: string
          type:
