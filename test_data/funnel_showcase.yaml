    # ── Impact Joinset — Conversion detail enriched by campaign metadata ────────
    #
    # impact_conversion_detail is the anchor (transaction-level, one row per
    # conversion). impact_campaign_performance is the satellite that contributes
    # campaign-level metadata (media partner, type, relationship, company URL)
    # via campaign_id. The join is many-to-one: many conversions per campaign.
    #
    # Use this when you need both individual transaction context (customer geo,
    # promo code, payout) AND campaign-level attributes (partner type, media
    # name) in the same query without needing two separate kinds.
    #
    - name: impact_enriched
      description: "Impact affiliate conversions enriched with campaign-level metadata — one row per transaction with partner, type, and relationship context"
      ai_context: "Use for Impact affiliate analysis that needs both transaction-level detail (customer country, promo code, order ID, payout) and campaign-level metadata (media partner, partner type, relationship). Joins conversion detail (anchor) to campaign performance (satellite) on campaign_id."
      type:
        joinset:
          associativity: left
      keys:
        primary: [transaction_id]
        foreign:
          - columns: [campaign_id]
            reference: impact_campaign_performance
            cardinality: many_to_one
      dimensions:
        - ref: date
        - ref: currency
        - ref: campaign_id
        - ref: campaign_name
        - ref: ad_id
        - ref: ad_name
        - name: transaction_id
          description: "Impact transaction identifier"
          data_type: string
          type:
            categorical:
        - name: action_tracker_id
          description: "Action tracker identifier"
          data_type: string
          type:
            categorical:
        - name: action_tracker_name
          description: "Action tracker name"
          data_type: string
          type:
            categorical:
        - name: media_partner_id
          description: "Media partner identifier"
          data_type: string
          type:
            categorical:
        - name: media_partner_name
          description: "Media partner name"
          data_type: string
          type:
            categorical:
        - name: customer_id
          description: "Customer identifier"
          data_type: string
          type:
            categorical:
        - name: customer_country
          description: "Customer country"
          data_type: string
          type:
            categorical:
        - name: customer_city
          description: "Customer city"
          data_type: string
          type:
            categorical:
        - name: customer_region
          description: "Customer region/state"
          data_type: string
          type:
            categorical:
        - name: referring_type
          description: "Type of referring traffic"
          data_type: string
          type:
            categorical:
        - name: referring_domain
          description: "Referring domain"
          data_type: string
          type:
            categorical:
        - name: promo_code
          description: "Promo or discount code used"
          data_type: string
          type:
            categorical:
        - name: order_id
          description: "Order identifier"
          data_type: string
          type:
            categorical:
        # Campaign-level metadata from the satellite (impact_campaign_performance)
        - name: network
          description: "Affiliate network name"
          data_type: string
          type:
            categorical:
        - name: media
          description: "Media partner name (from campaign level)"
          data_type: string
          type:
            categorical:
        - name: partner_type
          description: "Ad/placement type (banner, text, etc.)"
          data_type: string
          type:
            categorical:
        - name: relationship
          description: "Relationship type with the partner"
          data_type: string
          type:
            categorical:
      measures:
        - ref: affiliate_actions
        - name: amount
          description: "Order amount"
          data_type: decimal
          expr: "SUM(amount)"
          ai_context:
            synonyms: [order value, transaction value]
        - name: payout
          description: "Affiliate payout amount"
          data_type: decimal
