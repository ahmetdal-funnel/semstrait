        - name: campaign_type
          description: "Type of campaign (Search, Shopping, Audience…)"
          data_type: string
          type:
            categorical:
        - name: ad_distribution
          description: "Ad distribution network"
          data_type: string
          type:
            categorical:
        - name: campaign_labels
          description: "Labels applied to the campaign"
          data_type: string
          type:
            categorical:
        - name: device_type
          description: "Device type (Computer, Tablet, Smartphone)"
          data_type: string
          type:
