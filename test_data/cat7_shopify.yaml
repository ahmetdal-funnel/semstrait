# Category 7: Shopify Enriched — Joinset (v2)
# Order lines enriched with variant-level inventory cost.
#
# API-verified against Shopify Admin API (REST + GraphQL):
#
#   order_id = Order.id (numeric). order_name = Order.name (e.g. "#1001")
#   order_action_type = DERIVED (connector convention: "sale" vs "refund")
#   customer_id_v2 = connector convention (Fivetran/Airbyte schema versioning)
#   customer_order_index_v2 = GraphQL-only: customerJourneySummary.customerOrderIndex
#   first/last_visit_source/campaign = GraphQL-only: CustomerJourneySummary.firstVisit/lastVisit
#   total_amount = DERIVED (line_item price * quantity or Order.total_price)
#   total_cost = DERIVED (quantity * variant_unit_cost, "funnel-derived" suffix)
#   orders = DERIVED metric (COUNT DISTINCT order_id)
#   variant_unit_cost = InventoryItem.cost (REST) / InventoryItem.unitCost (GraphQL)
#   on_hand_quantity = GraphQL: InventoryLevel.quantities(names: ["on_hand"])
#     REST "available" is actually available-to-sell, not on-hand
#   product_type, product_tags = Product resource fields (not on LineItem directly)

semantic_model:
  name: alpinestars_shopify

  dimensions:
    - name: date
      description: "Reporting date"
      data_type: date
      type:
        temporal:
          grains: [day, week, month, quarter, year]

    - name: currency
      description: "Currency of the reported monetary values"
      data_type: string

    - name: product_id
      description: "Shopify product identifier"
      data_type: string

    - name: product_title
      description: "Product title / name"
      data_type: string
      ai_context:
        synonyms: [product name, item name]

    - name: product_type
      description: "Product type / category (from Product resource, not LineItem)"
      data_type: string
      ai_context:
        synonyms: [product category, item type]

    - name: product_tags
      description: "Comma-separated tags applied to the product (up to 250, from Product resource)"
      data_type: string

    - name: variant_id
      description: "Product variant identifier"
      data_type: string

    - name: variant_title
      description: "Product variant title (e.g. 'Large / Blue')"
      data_type: string

    - name: sku
      description: "Stock keeping unit (case-sensitive, available on LineItem, ProductVariant, and InventoryItem)"
      data_type: string

  measures:
    - name: total_amount
      description: "Total order amount (gross revenue) — derived from line item price x quantity"
      data_type: decimal
      agg: sum
            ai_context:
        synonyms: [gross revenue, order revenue, shopify revenue]

    - name: total_cost
      description: "Total cost of goods — order quantity x variant unit cost from inventory snapshot"
      data_type: decimal
      agg: sum
            ai_context:
        synonyms: [cogs, cost of goods]

  metrics:
    - name: average_order_value
      description: "Average order value — total revenue divided by number of orders"
      data_type: decimal
      expr: "total_amount / orders"
      ai_context:
        synonyms: [aov, avg order value]

    - name: gross_margin
      description: "Gross margin — revenue minus cost of goods, divided by revenue"
      data_type: decimal
      expr: "(total_amount - total_cost) / total_amount"
      ai_context:
        synonyms: [margin, profit margin]

  joinsets:
    - name: shopify_enriched
      description: "Shopify order lines enriched with variant-level inventory cost — enables gross margin analysis at order and product level"
      ai_context: "Use for Shopify profitability analysis — combines order revenue, discounts, quantity, and customer/attribution context with variant unit cost from inventory snapshots. Enables gross margin, COGS, and margin-by-product queries."
      associativity: left
      keys:
        primary: [order_id]
        foreign:
          - columns: [variant_id]
            reference: shopify_inventory_snapshot
            cardinality: many_to_one
      dimensions:
        - ref: date
        - ref: currency
        - ref: product_id
        - ref: product_title
        - ref: product_type
        - ref: product_tags
        - ref: variant_id
        - ref: variant_title
        - ref: sku

        # order
        - name: order_id
          description: "Shopify order identifier (Order.id, numeric)"
          data_type: string
        - name: order_name
          description: "Shopify human-readable order number (e.g. '#1001') — Order.name, distinct from order_id"
          data_type: string
        - name: order_action_type
          description: "Type of order action (sale/refund) — derived by connector from order line items vs refund line items"
          data_type: string

        # customer
        - name: customer_id
          description: "Shopify customer identifier (can be null for guest/POS orders, _v2 = connector schema version)"
          data_type: string
        - name: customer_email
          description: "Customer email address (from Order.email or Order.customer.email)"
          data_type: string
        - name: customer_order_index
          description: "Order index for this customer (1 = first order) — GraphQL-only: customerJourneySummary.customerOrderIndex (_v2 = connector version)"
          data_type: string
          ai_context:
            synonyms: [order number, new vs returning]

        # order details
        - name: discount_code
          description: "Discount code applied to the order (first code from Order.discount_codes array)"
          data_type: string
        - name: shipping_country
          description: "Shipping destination country (Order.shipping_address.country or country_code)"
          data_type: string

        # attribution (GraphQL-only: CustomerJourneySummary)
        - name: first_visit_source
          description: "Traffic source of customer's first visit (GraphQL: customerJourneySummary.firstVisit.source)"
          data_type: string
          ai_context:
            synonyms: [first touch source, acquisition source]
        - name: first_visit_campaign
          description: "UTM campaign of customer's first visit (GraphQL: firstVisit.utmParameters.campaign)"
          data_type: string
        - name: last_visit_source
          description: "Traffic source of customer's last visit before purchase (GraphQL: lastVisit.source)"
          data_type: string
          ai_context:
            synonyms: [last touch source, last click source]
        - name: last_visit_campaign
          description: "UTM campaign of customer's last visit before purchase"
          data_type: string

        # product
        - name: vendor
          description: "Product vendor / brand (from LineItem.vendor or Product.vendor)"
          data_type: string

        # inventory location (from satellite)
        - name: location_name
          description: "Inventory location name (warehouse, store — from Location resource via InventoryLevel)"
          data_type: string

      measures:
        - name: sales_quantity
          description: "Total units sold (LineItem.quantity — includes all; for net, subtract refunds)"
          data_type: decimal
          agg: sum
                    ai_context:
            synonyms: [units sold, quantity]

        - name: orders
          description: "Total number of orders (derived: COUNT DISTINCT order_id)"
          data_type: decimal
          agg: sum
                    ai_context:
            synonyms: [order count, number of orders]

        - ref: total_amount

        - name: total_discount_before_taxes
          description: "Total discount amount before taxes (LineItem.total_discount — Shopify discounts are pre-tax by default)"
          data_type: decimal
          agg: sum
          
        - name: unit_price
          description: "Original unit price before discounts (REST: LineItem.price, GraphQL: originalUnitPriceSet)"
          data_type: decimal
          agg: sum
          
        - ref: total_cost

        - name: variant_unit_cost
          description: "Variant unit cost from latest inventory snapshot (REST: InventoryItem.cost, GraphQL: unitCost — semi-additive)"
          data_type: decimal
          agg: sum
          additivity:
            semi:
                non_additive_dimensions: [date]

        - name: on_hand_quantity
          description: "On-hand inventory quantity from latest snapshot (GraphQL: quantities(names:['on_hand']) — semi-additive)"
          data_type: decimal
          agg: sum
          additivity:
            semi:
                non_additive_dimensions: [date]
          ai_context:
            synonyms: [stock, inventory]

      metrics:
        - ref: average_order_value
        - ref: gross_margin
        - name: gross_profit
          description: "Gross profit — revenue minus COGS"
          data_type: decimal
          expr: "total_amount - total_cost"
          ai_context:
            synonyms: [profit, gross profit]

      datasets:
        # Anchor — order line-items with revenue, customer, attribution
        - name: shopify_order_lines
          description: "Shopify order line-item detail (anchor — one row per line item with revenue, customer, and attribution)"
          extras:
            storage:
              path: "fs1henp3k8p1hqo/shopify/d067774d-2be0-4908-aa83-8d83d043ceba/"
          column_mapping:
            date: date
            currency: currency
            order_id: shopify-order_id
            order_name: shopify-order_name
            order_action_type: shopify-order_action_type
            customer_id: shopify-customer_id_v2
            customer_email: shopify-customer_email
            customer_order_index: shopify-customer_order_index_v2
            discount_code: shopify-discount_code
            shipping_country: shopify-shipping_country
            first_visit_source: shopify-first_visit_source
            first_visit_campaign: shopify-first_visit_campaign
            last_visit_source: shopify-last_visit_source
            last_visit_campaign: shopify-last_visit_campaign
            product_id: shopify-product_id
            product_title: shopify-product_title
            product_type: shopify-product_type
            product_tags: shopify-product_tags
            variant_id: shopify-variant_id
            variant_title: shopify-variant_title
            sku: shopify-sku
            vendor: shopify-vendor
            sales_quantity: shopify-sales_quantity
            orders: shopify-orders
            total_amount: shopify-total_amount
            total_discount_before_taxes: shopify-total_discount_amount_before_taxes
            unit_price: shopify-line_item_original_unit_price
            total_cost: "shopify-total_cost:funnel-derived"

        # Satellite — variant-level unit cost and stock levels from inventory snapshot
        - name: shopify_inventory_snapshot
          description: "Shopify inventory snapshot (satellite — variant unit cost and stock levels, daily snapshot)"
          extras:
            storage:
              path: "fs1henp3k8p1hqo/shopify/d6d7da76-06f3-4b1d-a34c-1286b252e4ef/"
            temporal:
              type:
                snapshot:
                  validity_column: date
          column_mapping:
            variant_id: shopify-variant_id
            sku: shopify-sku
            location_name: shopify-location_name
            variant_unit_cost: shopify-variant_unit_cost
            on_hand_quantity: shopify-on_hand_quantity

      relationships:
        - name: orders_to_inventory
          from: shopify_order_lines
          to: shopify_inventory_snapshot
          type: left
          columns:
            - from: shopify-variant_id
              to: shopify-variant_id
          cardinality: many_to_one
