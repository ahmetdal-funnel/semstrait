# Alpinestars EU Paid Media — v3 (spec-driven model + ExprSource<SemanticLeaf>)
#
# Adapted from `alpinestars_eu_ad_platform_v2.yaml` to the new model surface:
#  - top-level `version:` / `namespace:` removed (no slot on YamlRoot).
#  - Dimension `type:` is required (categorical / metadata / temporal / …).
#  - `column_mapping:` → `semantic_mapping:` (per `18 §10`); literal arm
#    keyword renamed `literal:` → `lit:` for symmetry with `expr:` bodies.
#  - `extras.temporal:` flattened: `temporal: { events: { event_time }, grain }`
#    instead of nested `temporal.type.events.occurred_at`.
#  - `expr:` blocks use the closed sugar roster from `14 §6.4.1` (Phase 8):
#      Leaves:    lit / col / field / dim / measure / metric / key
#      BinaryOp:  add subtract multiply divide safe_divide mod
#                 eq not_eq lt lt_eq gt gt_eq and or
#      UnaryOp:   negate (`not:` is the negation-fold dispatcher)
#      Predicate: in between like ilike is_null  (negation via `not:`)
#      Cond:      case if coalesce null_if
#      Aggregate: sum avg count count_distinct min max
#      Cast:      cast
#      Functions: upper lower length substring trim ltrim rtrim concat
#                 concat_ws replace lpad rpad reverse left right position
#                 split_part starts_with ends_with initcap repeat
#                 abs round ceil floor sqrt power sign exp ln log log10
#                 date_add date_sub date_diff date_trunc extract
#                 current_date current_timestamp to_date to_timestamp
#                 regexp_match regexp_extract regexp_replace
#                 greatest least
#  - Inline-DSL `expr: "cost / clicks"` form is preserved (parser stores
#    it as `ExprSource::Inline`; lowering is deferred per `14 §6.3`).
#  - `keys: { primary: [a, b] }` → `keys: { primary: { fields: [a, b] } }`.

semantic_model:
  name: alpinestars-eu-ad-platforms
  description: Cross-platform paid media metrics (independent variables for MMM)
  ai_context:
    description: >
      Paid media metrics across Google Ads, Facebook, Bing, TikTok, Impact, Klaviyo
      for Alpinestars EU (DE, ES, FR, GB, IT). Independent variables (X) for MMM.
  labels: [mmm, alpinestars, eu, paid-media, independent-variables]

  # ─── Shared dimensions ───────────────────────────────────────────────
  dimensions:
    - name: dataset_name
      data_type: string
      description: "Namespace extraction, platform name or source of data in current model version"
      type:
        metadata:
          source:
            path:
              token: 5

    - name: funnel_account_id
      description: "Funnel export account UUID extracted from resolved S3 location path"
      data_type: string
      type:
        metadata:
          source:
            path:
              token: 6

    - name: date
      description: "Reporting date"
      data_type: date
      type:
        temporal:
          grains: [day, week, month, quarter, year]

    - name: campaign
      description: "Campaign name"
      data_type: string
      type: categorical
      ai_context:
        synonyms:
          campaign: [ad campaign]

    - name: country
      description: "Country where the ad was served or the audience is located"
      data_type: string
      type: categorical

    # `market` is computed-only — declared inline at each Public DataKind
    # below. No root-pool entry (would otherwise be orphan per SR-E-3
    # since every site shadows it with its own `expr:`).

    - name: measurement_channel
      description: "Marketing channel classification (Paid Search, Paid Social, Video, Affiliates, Email)"
      data_type: string
      type: categorical
      ai_context:
        synonyms:
          channel: [ad channel, marketing channel]

    - name: traffic_source
      description: "Traffic source platform name (Google, Bing, Facebook, Tiktok, Impact, Klaviyo)"
      data_type: string
      type: categorical
      ai_context:
        synonyms:
          traffic_source: [platform]

    - name: measurement_source
      description: "Measurement source identifier"
      data_type: string
      type: categorical
      expr:
        concat:
          - measurement_channel
          - lit: " - "
          - traffic_source

    - name: currency
      description: "Currency of the reported monetary values"
      data_type: string
      type: categorical

  # ─── Shared measures ─────────────────────────────────────────────────
  measures:
    - name: cost
      description: "Total ad spend in account currency"
      data_type: decimal(18,2)
      agg: sum
      ai_context:
        synonyms:
          cost: [ad cost, ad spend, spend]

    - name: clicks
      description: "Number of clicks on the ad"
      data_type: decimal(18,2)
      agg: sum

    - name: impressions
      description: "Number of times the ad was displayed on screen"
      data_type: decimal(18,2)
      agg: sum

    - name: platform_conversions
      description: "Total tracked conversions attributed to ads"
      data_type: decimal(18,2)
      agg: sum
      ai_context:
        synonyms:
          conversions: [conv, total conversions]

    - name: platform_revenue
      description: "Revenue attributed to ad platform"
      data_type: decimal(18,2)
      agg: sum

    - name: actions
      description: "Actions performed in a campaign"
      data_type: decimal(18,2)
      agg: sum

  # ─── Shared metrics ──────────────────────────────────────────────────
  # Inline-DSL exprs are kept as authored — parser stores `ExprSource::Inline`;
  # lowering to `Expr<L>` is deferred per `14 §6.3`. They round-trip fine.
  metrics:
    - name: cpc
      description: "Cost per click"
      data_type: decimal(18,4)
      expr: "cost / clicks"

    - name: cpm
      description: "Cost per thousand impressions"
      data_type: decimal(18,4)
      expr: "(cost / impressions) * 1000"

    - name: ctr
      description: "Click-through rate"
      data_type: decimal(18,4)
      expr: "clicks / impressions"

    - name: cpa
      description: "Cost per conversion"
      data_type: decimal(18,4)
      expr: "cost / platform_conversions"

    - name: roas
      description: "Return on ad spend"
      data_type: decimal(18,4)
      expr: "platform_revenue / cost"

    - name: conversion_rate
      description: "Share of clicks resulting in a conversion"
      data_type: decimal(18,4)
      expr: "platform_conversions / clicks"

  # ═════════════════════════════════════════════════════════════════════
  # Kind: Paid Media Campaign Performance
  # ═════════════════════════════════════════════════════════════════════
  unionsets:
    - name: paid_media_campaign_performance
      description: "Cross-platform paid media performance unified across Google Ads, Bing Ads, Facebook/Meta, and TikTok"
      ai_context:
        description: "Use for cross-channel paid media analysis. Filter by platform or campaign_category (search/social). Hierarchy: campaign > adgroup > ad."
      mode: all

      # NOTE: SR-E-7 forbids `temporal.grain:` on a complex DataKind. The
      # shape (`events`) cascades from this unionset; each nested Dataset
      # below authors its own `grain:`.
      extras:
        temporal:
          events:
            event_time: date

      keys:
        primary:
          fields:
            - campaign_id
            - account_id
            - adgroup_id
            - ad_id
            - conversion_tracker_id
            - ad_video_id

      dimensions:
        # ── 1. Metadata & classification ─────────────────────────────
        - ref: date
        - ref: dataset_name
        - ref: campaign
        - ref: country
        - ref: traffic_source
        - ref: measurement_source
        - ref: measurement_channel
        - ref: currency
        - ref: funnel_account_id

        # Computed dimension: derives market code from campaign name and dataset_name.
        # Inline `name:` (not `ref:`) because RefEntry only allows expr override
        # against an existing root-pool entry; here we shadow the pool entry's
        # default with a computed expression.
        - name: market
          description: "Derived market code from campaign naming conventions"
          data_type: string
          type: categorical
          expr:
            case:
              whens:
                # Branch 1: ad-platform datasets
                - when:
                    in:
                      value:
                        col: dataset_name
                      list:
                        - lit: "adwords"
                        - lit: "facebookads"
                        - lit: "bing"
                        - lit: "tiktok"
                        - lit: "klaviyo"
                  then:
                    case:
                      whens:
                        # UK_ prefix → GB
                        - when:
                            regexp_match:
                              - col: campaign
                              - lit: "^UK_"
                          then:
                            lit: "GB"
                        # Facebook special-case
                        - when:
                            eq:
                              - dataset_name
                              - lit: "facebookads"
                          then:
                            case:
                              whens:
                                - when:
                                    regexp_match:
                                      - col: campaign
                                      - lit: "^EU_"
                                  then:
                                    upper: country
                              else:
                                upper:
                                  regexp_extract:
                                    - col: campaign
                                    - lit: "^([A-Z]{2})_"
                                    - lit: 1
                      else:
                        upper:
                          regexp_extract:
                            - col: campaign
                            - lit: "^([A-Z]{2})_"
                            - lit: 1

                # Branch 2: impact dataset
                - when:
                    eq:
                      - dataset_name
                      - lit: "impact"
                  then:
                    case:
                      whens:
                        - when:
                            regexp_match:
                              - col: campaign
                              - lit: "^Alpinestars UK"
                          then:
                            lit: "GB"
                      else:
                        regexp_extract:
                          - col: campaign
                          - lit: "^Alpinestars ([A-Z]{2})"
                          - lit: 1
              else:
                lit: ""

      # ── Measures ──────────────────────────────────────────────────────
      measures:
        - ref: cost
        - ref: clicks
        - ref: impressions
        - ref: platform_conversions
        - ref: platform_revenue
        - ref: actions

      # ── Metrics ───────────────────────────────────────────────────────
      metrics:
        - ref: cpc
        - ref: cpm
        - ref: ctr
        - ref: cpa
        - ref: roas
        - ref: conversion_rate

      # ── Datasets ──────────────────────────────────────────────────────
      datasets:
        # ── Google Ads ────────────────────────────────────────────────
        - name: adwords_campaign_data
          extras:
            catalog: polaris
            storage:
              tables:
                - "adwords.*"
            temporal:
              events:
                event_time: date
              grain: day
            semantic_mapping:
              measurement_channel:
                lit: { string: "Paid Search" }
              traffic_source:
                lit: { string: "Google" }
              date: date
              country: adwords-country
              campaign: adwords-campaign
              currency: currency
              cost: adwords-cost
              clicks: adwords-clicks
              impressions: adwords-impressions
              platform_conversions: adwords_conversions
              platform_revenue: adwords_allConvValue
              actions:
                lit: { int: 0 }

        # ── Bing Ads ──────────────────────────────────────────────────
        - name: bing_campaign_data
          extras:
            catalog: polaris
            storage:
              tables:
                - "bing.*"
            temporal:
              events:
                event_time: date
              grain: day
            semantic_mapping:
              measurement_channel:
                lit: { string: "Paid Search" }
              traffic_source:
                lit: { string: "Bing" }
              date: date
              campaign: bing-CampaignName
              currency: currency
              impressions: bing-impressions
              clicks: bing-clicks
              cost: bing-cost
              platform_conversions: bing-Conversions
              platform_revenue: bing-Revenue
              actions:
                lit: { int: 0 }

        # ── Facebook / Meta ───────────────────────────────────────────
        - name: facebook_adset_data
          extras:
            catalog: polaris
            storage:
              tables:
                - "facebookads.*"
            temporal:
              events:
                event_time: date
              grain: day
            semantic_mapping:
              measurement_channel:
                lit: { string: "Paid Social" }
              traffic_source:
                lit: { string: "Facebook" }
              date: date
              country: facebookads-country
              campaign: facebookads-campaign_name
              currency: currency
              cost: facebookads-spend
              impressions: facebookads-impressions
              clicks: facebookads-clicks
              platform_conversions:
                lit: { int: 0 }
              platform_revenue:
                lit: { int: 0 }
              actions:
                lit: { int: 0 }

        # ── TikTok ────────────────────────────────────────────────────
        - name: tiktok_ad_data
          extras:
            catalog: polaris
            storage:
              tables:
                - "tiktok.*"
            temporal:
              events:
                event_time: date
              grain: day
            semantic_mapping:
              measurement_channel:
                lit: { string: "Video" }
              traffic_source:
                lit: { string: "Tiktok" }
              date: date
              country: tiktok-country
              campaign: tiktok-campaign_name
              currency: currency
              cost: tiktok-stat_cost
              impressions: tiktok-show_cnt
              clicks: tiktok-click_cnt
              platform_conversions: tiktok-convert_cnt
              platform_revenue:
                lit: { int: 0 }
              actions:
                lit: { int: 0 }

        # ── Impact ────────────────────────────────────────────────────
        - name: impact_adset_data
          extras:
            catalog: polaris
            storage:
              tables:
                - "impact.*"
            temporal:
              events:
                event_time: date
              grain: day
            semantic_mapping:
              measurement_channel:
                lit: { string: "Affiliates" }
              traffic_source:
                lit: { string: "Impact" }
              date: date
              country: impact-country
              campaign: impact-campaign_name
              currency: currency
              cost: impact-client_cost
              impressions:
                lit: { int: 0 }
              clicks:
                lit: { int: 0 }
              platform_conversions:
                lit: { int: 0 }
              platform_revenue: impact-amount
              actions: impact-actions

        # ── Klaviyo ───────────────────────────────────────────────────
        - name: klaviyo_adset_data
          extras:
            catalog: polaris
            storage:
              tables:
                - "klaviyo.*"
            temporal:
              events:
                event_time: date
              grain: day
            semantic_mapping:
              measurement_channel:
                lit: { string: "Email" }
              traffic_source:
                lit: { string: "Klaviyo" }
              date: date
              country:
                lit: { string: "" }
              campaign: klaviyo-campaign_name
              currency:
                lit: { string: "" }
              cost:
                lit: { int: 0 }
              impressions:
                lit: { int: 0 }
              clicks: klaviyo-clicks2
              platform_conversions:
                lit: { int: 0 }
              platform_revenue:
                lit: { int: 0 }
              actions:
                lit: { int: 0 }

  # ═════════════════════════════════════════════════════════════════════
  # Standalone Dataset: Shopify
  # ═════════════════════════════════════════════════════════════════════
  datasets:
    - name: shopify
      extras:
        catalog: polaris
        storage:
          tables:
            - "shopify.*"
        temporal:
          events:
            event_time: date
          grain: day
        semantic_mapping:
          date: date
          brand:
            lit: { string: "Alpinestars" }
          conversion_event:
            lit: { string: "purchase" }
          currency: currency
          order_action_type: shopify-order_action_type
          sale_action_type: shopify-sale_action_type
          sale_line_type: sale_line_type
          sales_channel: order_app_name
          orders: shopify-orders
          revenue: shopify-total_amount
          tax: shopify-total_tax_amount
          country: shopify-shipping_country

      dimensions:
        - ref: dataset_name
        - ref: funnel_account_id
        - ref: date
        - ref: currency
        - name: country
          description: "Shopify order country"
          data_type: string
          type: categorical
        - name: market
          description: "Derived market code from Shopify country name"
          data_type: string
          type: categorical
          expr:
            case:
              whens:
                - when:
                    eq: [country, { lit: "Germany" }]
                  then:
                    lit: "DE"
                - when:
                    eq: [country, { lit: "Spain" }]
                  then:
                    lit: "ES"
                - when:
                    eq: [country, { lit: "France" }]
                  then:
                    lit: "FR"
                - when:
                    eq: [country, { lit: "United Kingdom" }]
                  then:
                    lit: "GB"
                - when:
                    eq: [country, { lit: "Italy" }]
                  then:
                    lit: "IT"
              else:
                lit: null
        - name: sales_channel
          data_type: string
          type: categorical
        - name: brand
          data_type: string
          type: categorical
        - name: sale_line_type
          data_type: string
          type: categorical
        - name: sale_action_type
          data_type: string
          type: categorical
        - name: order_action_type
          data_type: string
          type: categorical

      measures:
        - name: orders
          data_type: decimal(18,2)
          agg: sum
        - name: revenue
          data_type: decimal(18,2)
          agg: sum
        - name: tax
          data_type: decimal(18,2)
          agg: sum
