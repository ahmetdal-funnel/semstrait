semantic_model:
  name: grainset_basic
  description: "Grainset with two datasets at different temporal grains"

  kinds:
    - name: sales
      type:
        grainset:
      dimensions:
        - name: order_date
          data_type: date
          type:
            temporal:
              grains:
                - day
                - month
      measures:
        - name: revenue
          data_type: float64
          expr: "SUM(amount)"
        - name: order_count
          data_type: int64
          expr: "COUNT(order_id)"
      datasets:
        - name: orders_daily
          extras:
            column_mapping:
              order_date: created_at
              revenue: amount_usd
              order_count: num_orders
            storage:
              path: warehouse.orders_daily
        - name: orders_monthly
          extras:
            column_mapping:
              order_date:
                column: order_month
                grain: month
              revenue: total_revenue
              order_count: total_orders
            storage:
              path: warehouse.orders_monthly
