# Category 5: Klaviyo Email/SMS — Two Standalone Datasets (v2)
#
# API-verified against Klaviyo Reporting API v2024-10-15:
#
#   NAMING CORRECTIONS (vs v1 model):
#     opens2/clicks2 in source data = legacy CSV export column names
#       → current API statistics: opens/clicks (no "2" suffix)
#       → column_mapping keeps legacy source names (connector exports old format)
#     metric_id = request parameter for filtering, NOT a response field
#       → kept as dimension since connector exports it as a column
#     subject = NOT a campaign attribute — lives in CampaignMessage object
#       → accessible via /api/campaign-messages/ endpoint, not /api/campaigns/
#     received_email = maps to Klaviyo's "delivered" statistic
#       (filtered by send_channel=email in connector)
#
#   Campaign statistics (Reporting API):
#     recipients, opens, opens_unique, clicks, clicks_unique, unsubscribes,
#     unsubscribe_uniques = count statistics (additive)
#     open_rate, click_rate, click_to_open_rate, unsubscribe_rate = pre-computed
#       fractions [0.0-1.0], non-additive
#
#   Flow statistics (Reporting API):
#     All rates (open_rate, click_through_rate, bounce_rate, unsubscribe_rate)
#       are pre-computed fractions [0.0-1.0], non-additive
#     placed_order, placed_order_value, average_order_value, checkout_started,
#       viewed_product, subscribed_to_list, unsubscribed_from_list = Klaviyo event
#       metrics (tracked events attributed to flow), NOT reporting statistics
#
#   send_channel values: email, sms, push-notification, whatsapp
#
# Two separate datasets (different schemas, no unification):
#   5a: klaviyo_campaign_performance — campaign-level send metrics
#   5b: klaviyo_flow_performance — flow-level engagement + conversion metrics

semantic_model:
  name: alpinestars_klaviyo

  dimensions:
    - name: date
      description: "Reporting date"
      data_type: date
      type:
        temporal:
          grains: [day, week, month, quarter, year]

    - name: campaign_name
      description: "Klaviyo campaign name"
      data_type: string
      ai_context:
        synonyms: [campaign, email campaign]

  datasets:
    # ── 5a: Klaviyo Campaign Performance ────────────────────────────────────
    - name: klaviyo_campaign_performance
      description: "Klaviyo email and SMS campaign performance — recipients, open rates, click rates, and unsubscribes by campaign"
      ai_context: "Use for Klaviyo campaign send metrics — recipients, opens, clicks, unsubscribes per campaign. Rates are pre-computed fractions [0.0-1.0], non-additive across campaigns. send_channel values: email, sms, push-notification, whatsapp. Note: opens2/clicks2 in source data are legacy CSV export names for opens/clicks."
      extras:
        storage:
          paths:
            - "fs1henp3k8p1hqo/klaviyo/7ed22788-866f-4f83-b1f0-6b5e35311f9d/"
        column_mapping:
          date: date
          campaign_id: klaviyo-campaign_id
          campaign_name: klaviyo-campaign_name
          subject: klaviyo-subject
          send_time: klaviyo-send_time
          send_channel: klaviyo-send_channel
          metric_id: klaviyo-metric_id
          recipients: klaviyo-recipients
          opens: klaviyo-opens2
          opens_unique: klaviyo-opens_unique
          open_rate: klaviyo-open_rate
          email_clicks: klaviyo-clicks2
          clicks_unique: klaviyo-clicks_unique
          click_rate: klaviyo-click_rate
          click_to_open_rate: klaviyo-click_to_open_rate
          unsubscribes: klaviyo-unsubscribes
          unsubscribe_uniques: klaviyo-unsubscribe_uniques
          unsubscribe_rate: klaviyo-unsubscribe_rate
      dimensions:
        - ref: date
        - name: campaign_id
          description: "Klaviyo campaign identifier"
          data_type: string
        - ref: campaign_name
        - name: subject
          description: "Email subject line (from CampaignMessage object, not Campaign — joined by connector)"
          data_type: string
        - name: send_time
          description: "Campaign send timestamp (ISO 8601)"
          data_type: string
        - name: send_channel
          description: "Channel used to send the campaign (email, sms, push-notification, whatsapp)"
          data_type: string
          ai_context:
            synonyms: [klaviyo channel, klaviyo send channel, email send channel]
        - name: metric_id
          description: "Klaviyo metric identifier (request-level filter parameter exported as column by connector)"
          data_type: string

      measures:
        - name: recipients
          description: "Total number of campaign recipients"
          data_type: decimal
          agg: sum
          ai_context:
            synonyms: [sent, emails sent]

        - name: opens
          description: "Total email opens including machine opens (source column: opens2 — legacy CSV export name)"
          data_type: decimal
          agg: sum

        - name: opens_unique
          description: "Unique email opens"
          data_type: decimal
          agg: sum

        - name: open_rate
          description: "Email open rate — pre-computed fraction [0.0-1.0] per campaign, non-additive across campaigns"
          data_type: decimal
          agg: sum
          additivity: non

        - name: email_clicks
          description: "Total email link clicks (source column: clicks2 — legacy CSV export name)"
          data_type: decimal
          agg: sum
          ai_context:
            synonyms: [klaviyo clicks, email link clicks]

        - name: clicks_unique
          description: "Unique email link clicks"
          data_type: decimal
          agg: sum

        - name: click_rate
          description: "Email click rate — pre-computed fraction [0.0-1.0] per campaign, non-additive across campaigns"
          data_type: decimal
          agg: sum
          additivity: non

        - name: click_to_open_rate
          description: "Click-to-open rate (CTOR) — pre-computed fraction [0.0-1.0] per campaign, non-additive across campaigns"
          data_type: decimal
          agg: sum
          additivity: non
          ai_context:
            synonyms: [ctor]

        - name: unsubscribes
          description: "Total unsubscribes from this campaign"
          data_type: decimal
          agg: sum

        - name: unsubscribe_uniques
          description: "Unique unsubscribes"
          data_type: decimal
          agg: sum

        - name: unsubscribe_rate
          description: "Unsubscribe rate — pre-computed fraction [0.0-1.0] per campaign, non-additive across campaigns"
          data_type: decimal
          agg: sum
          additivity: non

    # ── 5b: Klaviyo Flow Performance ────────────────────────────────────────
    - name: klaviyo_flow_performance
      description: "Klaviyo automated flow performance — email engagement, deliverability, and conversion metrics by flow"
      ai_context: "Use for Klaviyo flow (automation) performance — delivered emails, opens, clicks, bounces, spam reports, and attributed conversions (placed orders, checkouts, product views). Rates are pre-computed fractions [0.0-1.0], non-additive. Event metrics (placed_order, checkout_started, etc.) are Klaviyo tracked events attributed to the flow, not reporting statistics."
      extras:
        storage:
          paths:
            - "fs1henp3k8p1hqo/klaviyo/bd7df896-f98f-4fba-b4c2-53efd61c53c1/"
        column_mapping:
          date: date
          currency: currency
          flow: klaviyo-flow
          received_email: klaviyo-received_email
          opens: klaviyo-opens
          opens_unique: klaviyo-opens_unique
          open_rate: klaviyo-email_open_rate
          email_clicks: klaviyo-clicks
          click_through_rate: klaviyo-email_click_through_rate
          bounced_email: klaviyo-bounced_email
          bounce_rate: klaviyo-email_bounce_rate
          dropped_email: klaviyo-dropped_email
          marked_spam: klaviyo-marked_email_as_spam
          clicked_to_unsubscribe: klaviyo-clicked_email_to_unsubscribe
          unsubscribe_rate: klaviyo-email_unsubscribe_rate
          placed_order: klaviyo-placed_order
          placed_order_value: klaviyo-placed_order_value
          average_order_value: klaviyo-average_order_value
          checkout_started: klaviyo-checkout_started
          viewed_product: klaviyo-viewed_product
          subscribed_to_list: klaviyo-subscribed_to_list
          unsubscribed_from_list: klaviyo-unsubscribed_from_list
      dimensions:
        - ref: date
        - name: currency
          description: "Currency of the reported monetary values"
          data_type: string
        - name: flow
          description: "Name of the Klaviyo automation flow"
          data_type: string
          ai_context:
            synonyms: [automation, klaviyo automation, email flow]

      measures:
        - name: received_email
          description: "Total emails delivered (Klaviyo API: 'delivered' statistic filtered by send_channel=email)"
          data_type: decimal
          agg: sum
          ai_context:
            synonyms: [delivered, emails delivered]

        - name: opens
          description: "Total email opens including machine opens"
          data_type: decimal
          agg: sum

        - name: opens_unique
          description: "Unique opens"
          data_type: decimal
          agg: sum

        - name: open_rate
          description: "Email open rate — pre-computed fraction [0.0-1.0] per flow, non-additive across flows"
          data_type: decimal
          agg: sum
          additivity: non

        - name: email_clicks
          description: "Total email link clicks"
          data_type: decimal
          agg: sum
          ai_context:
            synonyms: [klaviyo clicks, email link clicks]

        - name: click_through_rate
          description: "Email click-through rate — pre-computed fraction [0.0-1.0] per flow, non-additive across flows"
          data_type: decimal
          agg: sum
          additivity: non

        - name: bounced_email
          description: "Total bounced emails (hard + soft bounces)"
          data_type: decimal
          agg: sum

        - name: bounce_rate
          description: "Email bounce rate — pre-computed fraction [0.0-1.0] per flow, non-additive across flows"
          data_type: decimal
          agg: sum
          additivity: non

        - name: dropped_email
          description: "Total dropped/suppressed emails (Klaviyo event metric: email suppressed before send)"
          data_type: decimal
          agg: sum

        - name: marked_spam
          description: "Total spam complaints (Klaviyo event metric: Marked Email as Spam)"
          data_type: decimal
          agg: sum

        - name: clicked_to_unsubscribe
          description: "Total unsubscribe link clicks (Klaviyo event metric: Clicked Email to Unsubscribe)"
          data_type: decimal
          agg: sum

        - name: unsubscribe_rate
          description: "Email unsubscribe rate — pre-computed fraction [0.0-1.0] per flow, non-additive across flows"
          data_type: decimal
          agg: sum
          additivity: non

        - name: placed_order
          description: "Total orders attributed to this flow (Klaviyo event metric: Placed Order)"
          data_type: decimal
          agg: sum
          ai_context:
            synonyms: [flow orders, email orders]

        - name: placed_order_value
          description: "Total revenue from orders attributed to this flow (Klaviyo event metric: Placed Order value)"
          data_type: decimal
          agg: sum
          ai_context:
            synonyms: [flow revenue, email revenue]

        - name: average_order_value
          description: "Average order value from this flow — pre-computed, non-additive (placed_order_value / placed_order)"
          data_type: decimal
          agg: sum
          additivity: non

        - name: checkout_started
          description: "Total checkout starts attributed to this flow (Klaviyo event metric: Started Checkout)"
          data_type: decimal
          agg: sum

        - name: viewed_product
          description: "Total product views attributed to this flow (Klaviyo event metric: Viewed Product)"
          data_type: decimal
          agg: sum

        - name: subscribed_to_list
          description: "Total list subscriptions attributed to this flow (Klaviyo event metric: Subscribed to List)"
          data_type: decimal
          agg: sum

        - name: unsubscribed_from_list
          description: "Total list unsubscriptions attributed to this flow (Klaviyo event metric: Unsubscribed from List)"
          data_type: decimal
          agg: sum
